<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="854" viewBox="0 0 1600 854" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1600" height="854" fill="#ffffff"/>
  <defs>
    <linearGradient id="half" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0.5" stop-color="#f1ebf8"/><stop offset="0.5" stop-color="#fdf0e2"/>
    </linearGradient>
    <linearGradient id="half-edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0.5" stop-color="#6a3d9a"/><stop offset="0.5" stop-color="#c26100"/>
    </linearGradient>
  </defs>
  <rect x="36.0" y="36.0" width="329.5" height="215.5" rx="10" fill="#f1f1f1" stroke="#9a9a9a" stroke-width="2.5"/>
  <text x="200.8" y="88.3" text-anchor="middle" font-size="34" fill="#555555" font-weight="700">The phone</text>
  <text x="200.8" y="133.2" text-anchor="middle" font-size="34" fill="#2b2b2b">Over Bluetooth.</text>
  <text x="200.8" y="178.1" text-anchor="middle" font-size="34" fill="#2b2b2b">The wearer's card</text>
  <text x="200.8" y="223.0" text-anchor="middle" font-size="34" fill="#2b2b2b">in, other cards out.</text>
  <rect x="435.5" y="36.0" width="329.5" height="215.5" rx="10" fill="#f1ebf8" stroke="#6a3d9a" stroke-width="2.5"/>
  <text x="600.2" y="110.8" text-anchor="middle" font-size="34" fill="#6a3d9a" font-weight="700">Two amplifiers</text>
  <text x="600.2" y="155.7" text-anchor="middle" font-size="34" fill="#2b2b2b">×11 each. The</text>
  <text x="600.2" y="200.5" text-anchor="middle" font-size="34" fill="#2b2b2b">tone arrives tiny.</text>
  <rect x="835.0" y="36.0" width="329.5" height="215.5" rx="10" fill="url(#half)" stroke="url(#half-edge)" stroke-width="2.5"/>
  <text x="999.8" y="88.3" text-anchor="middle" font-size="34" fill="#2b2b2b" font-weight="700">Coated plate</text>
  <text x="999.8" y="133.2" text-anchor="middle" font-size="34" fill="#2b2b2b">Sends the tone,</text>
  <text x="999.8" y="178.1" text-anchor="middle" font-size="34" fill="#2b2b2b">and hears the</text>
  <text x="999.8" y="223.0" text-anchor="middle" font-size="34" fill="#2b2b2b">other band's.</text>
  <rect x="1234.5" y="36.0" width="329.5" height="215.5" rx="10" fill="#f1f1f1" stroke="#9a9a9a" stroke-width="2.5"/>
  <text x="1399.2" y="110.8" text-anchor="middle" font-size="34" fill="#555555" font-weight="700">Skin</text>
  <text x="1399.2" y="155.7" text-anchor="middle" font-size="34" fill="#2b2b2b">Carries the tone</text>
  <text x="1399.2" y="200.5" text-anchor="middle" font-size="34" fill="#2b2b2b">both ways.</text>
  <rect x="36.0" y="341.5" width="1528.0" height="170.6" rx="10" fill="#e3f3f4" stroke="#00838f" stroke-width="2.5"/>
  <text x="800.0" y="393.9" text-anchor="middle" font-size="34" fill="#00838f" font-weight="700">Raspberry Pi Pico 2 W</text>
  <text x="800.0" y="438.7" text-anchor="middle" font-size="34" fill="#2b2b2b">Makes both tones, 180 and 200 kHz, weighs five pitches in</text>
  <text x="800.0" y="483.6" text-anchor="middle" font-size="34" fill="#2b2b2b">what comes back, and runs Bluetooth. The rest is software.</text>
  <rect x="36.0" y="602.2" width="329.5" height="215.5" rx="10" fill="#f1ebf8" stroke="#6a3d9a" stroke-width="2.5"/>
  <text x="200.8" y="654.5" text-anchor="middle" font-size="34" fill="#6a3d9a" font-weight="700">Button</text>
  <text x="200.8" y="699.4" text-anchor="middle" font-size="34" fill="#2b2b2b">Press for the</text>
  <text x="200.8" y="744.3" text-anchor="middle" font-size="34" fill="#2b2b2b">battery. Hold 5 s</text>
  <text x="200.8" y="789.1" text-anchor="middle" font-size="34" fill="#2b2b2b">to reset the band.</text>
  <rect x="435.5" y="602.2" width="329.5" height="215.5" rx="10" fill="#f1ebf8" stroke="#6a3d9a" stroke-width="2.5"/>
  <text x="600.2" y="654.5" text-anchor="middle" font-size="34" fill="#6a3d9a" font-weight="700">Battery</text>
  <text x="600.2" y="699.4" text-anchor="middle" font-size="34" fill="#2b2b2b">1500 mAh</text>
  <text x="600.2" y="744.3" text-anchor="middle" font-size="34" fill="#2b2b2b">Li-ion, with an</text>
  <text x="600.2" y="789.1" text-anchor="middle" font-size="34" fill="#2b2b2b">on/off switch.</text>
  <rect x="835.0" y="602.2" width="329.5" height="215.5" rx="10" fill="#fdf0e2" stroke="#c26100" stroke-width="2.5"/>
  <text x="999.8" y="654.5" text-anchor="middle" font-size="34" fill="#c26100" font-weight="700">RGB LED</text>
  <text x="999.8" y="699.4" text-anchor="middle" font-size="34" fill="#2b2b2b">Blue to pair, white</text>
  <text x="999.8" y="744.3" text-anchor="middle" font-size="34" fill="#2b2b2b">for a handshake,</text>
  <text x="999.8" y="789.1" text-anchor="middle" font-size="34" fill="#2b2b2b">green when done.</text>
  <rect x="1234.5" y="602.2" width="329.5" height="215.5" rx="10" fill="#fdf0e2" stroke="#c26100" stroke-width="2.5"/>
  <text x="1399.2" y="654.5" text-anchor="middle" font-size="34" fill="#c26100" font-weight="700">Motor</text>
  <text x="1399.2" y="699.4" text-anchor="middle" font-size="34" fill="#2b2b2b">A buzz when a</text>
  <text x="1399.2" y="744.3" text-anchor="middle" font-size="34" fill="#2b2b2b">card is shared</text>
  <text x="1399.2" y="789.1" text-anchor="middle" font-size="34" fill="#2b2b2b">or received.</text>
