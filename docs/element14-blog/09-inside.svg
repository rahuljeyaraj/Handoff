  <path d="M1199.5 143.8 L1188.5 143.8" stroke="#9a9a9a" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M1188.5 133.8 L1188.5 153.7 L1172.5 143.8 Z" fill="#9a9a9a"/>
