  <path d="M610.2 536.2 L590.3 536.2 L600.2 520.2 Z" fill="#6a3d9a"/>
  <path d="M999.8 520.2 L999.8 578.2" stroke="#c26100" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M989.8 578.2 L1009.7 578.2 L999.8 594.2 Z" fill="#c26100"/>
