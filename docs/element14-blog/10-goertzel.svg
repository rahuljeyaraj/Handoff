<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="790" viewBox="0 0 1600 790" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1600" height="790" fill="#ffffff"/>
  <text x="36.0" y="60.0" text-anchor="start" font-size="24" fill="#2b2b2b" font-weight="700">The full receiver</text>
  <rect x="36.0" y="79.2" width="278.4" height="162.7" rx="10" fill="#f1ebf8" stroke="#6a3d9a" stroke-width="2.5"/>
  <text x="175.2" y="153.1" text-anchor="middle" font-size="24" fill="#6a3d9a" font-weight="700">Two amplifiers</text>
  <text x="175.2" y="184.8" text-anchor="middle" font-size="24" fill="#2b2b2b">The tone arrives tiny.</text>
  <rect x="348.4" y="79.2" width="278.4" height="162.7" rx="10" fill="#ffffff" stroke="#9a9a9a" stroke-width="2.5" stroke-dasharray="10 8"/>
  <text x="487.6" y="121.4" text-anchor="middle" font-size="24" fill="#707070" font-weight="700">Oscillator, mixers</text>
  <text x="487.6" y="153.1" text-anchor="middle" font-size="24" fill="#2b2b2b">Shift the tone down.</text>
  <text x="487.6" y="184.8" text-anchor="middle" font-size="24" fill="#2b2b2b">Two, as the clocks</text>
  <text x="487.6" y="216.5" text-anchor="middle" font-size="24" fill="#2b2b2b">are not in step.</text>
  <rect x="660.8" y="79.2" width="278.4" height="162.7" rx="10" fill="#ffffff" stroke="#9a9a9a" stroke-width="2.5" stroke-dasharray="10 8"/>
  <text x="800.0" y="137.3" text-anchor="middle" font-size="24" fill="#707070" font-weight="700">Filter</text>
  <text x="800.0" y="169.0" text-anchor="middle" font-size="24" fill="#2b2b2b">Keeps only the</text>
  <text x="800.0" y="200.6" text-anchor="middle" font-size="24" fill="#2b2b2b">shifted tone.</text>
  <rect x="973.2" y="79.2" width="278.4" height="162.7" rx="10" fill="#ffffff" stroke="#9a9a9a" stroke-width="2.5" stroke-dasharray="10 8"/>
  <text x="1112.4" y="153.1" text-anchor="middle" font-size="24" fill="#707070" font-weight="700">Amplifier</text>
  <text x="1112.4" y="184.8" text-anchor="middle" font-size="24" fill="#2b2b2b">Boosts it again.</text>
  <rect x="1285.6" y="79.2" width="278.4" height="162.7" rx="10" fill="#e3f3f4" stroke="#00838f" stroke-width="2.5"/>
  <text x="1424.8" y="137.3" text-anchor="middle" font-size="24" fill="#00838f" font-weight="700">Converter</text>
  <text x="1424.8" y="169.0" text-anchor="middle" font-size="24" fill="#2b2b2b">Samples the slow,</text>
  <text x="1424.8" y="200.6" text-anchor="middle" font-size="24" fill="#2b2b2b">shifted result.</text>
  <path d="M318.4 160.6 L330.4 160.6" stroke="#9a9a9a" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M330.4 169.2 L330.4 151.9 L344.4 160.6 Z" fill="#9a9a9a"/>
  <path d="M630.8 160.6 L642.8 160.6" stroke="#9a9a9a" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M642.8 169.2 L642.8 151.9 L656.8 160.6 Z" fill="#9a9a9a"/>
  <path d="M943.2 160.6 L955.2 160.6" stroke="#9a9a9a" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M955.2 169.2 L955.2 151.9 L969.2 160.6 Z" fill="#9a9a9a"/>
  <path d="M1255.6 160.6 L1267.6 160.6" stroke="#9a9a9a" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M1267.6 169.2 L1267.6 151.9 L1281.6 160.6 Z" fill="#9a9a9a"/>
  <text x="36.0" y="315.9" text-anchor="start" font-size="24" fill="#2b2b2b" font-weight="700">The simple receiver</text>
  <rect x="36.0" y="335.1" width="278.4" height="162.7" rx="10" fill="#f1ebf8" stroke="#6a3d9a" stroke-width="2.5"/>
  <text x="175.2" y="409.0" text-anchor="middle" font-size="24" fill="#6a3d9a" font-weight="700">Two amplifiers</text>
  <text x="175.2" y="440.7" text-anchor="middle" font-size="24" fill="#2b2b2b">The tone arrives tiny.</text>
  <rect x="348.4" y="335.1" width="278.4" height="162.7" rx="10" fill="#ffffff" stroke="#9a9a9a" stroke-width="2.5" stroke-dasharray="10 8"/>
  <text x="487.6" y="377.4" text-anchor="middle" font-size="24" fill="#707070" font-weight="700">Diode, capacitor</text>
  <text x="487.6" y="409.0" text-anchor="middle" font-size="24" fill="#2b2b2b">How loud, every</text>
  <text x="487.6" y="440.7" text-anchor="middle" font-size="24" fill="#2b2b2b">pitch at once. Or an</text>
  <text x="487.6" y="472.4" text-anchor="middle" font-size="24" fill="#2b2b2b">LM567: yes or no.</text>
  <rect x="973.2" y="335.1" width="278.4" height="162.7" rx="10" fill="#e3f3f4" stroke="#00838f" stroke-width="2.5"/>
  <text x="1112.4" y="393.2" text-anchor="middle" font-size="24" fill="#00838f" font-weight="700">Converter</text>
  <text x="1112.4" y="424.9" text-anchor="middle" font-size="24" fill="#2b2b2b">Samples the</text>
  <text x="1112.4" y="456.6" text-anchor="middle" font-size="24" fill="#2b2b2b">loudness.</text>
  <path d="M318.4 416.5 L330.4 416.5" stroke="#9a9a9a" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M330.4 425.2 L330.4 407.8 L344.4 416.5 Z" fill="#9a9a9a"/>
  <path d="M630.8 416.5 L955.2 416.5" stroke="#9a9a9a" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M955.2 425.2 L955.2 407.8 L969.2 416.5 Z" fill="#9a9a9a"/>
  <text x="36.0" y="571.8" text-anchor="start" font-size="24" fill="#2b2b2b" font-weight="700">The band's receiver: five pitches, five numbers</text>
  <rect x="36.0" y="591.0" width="278.4" height="162.7" rx="10" fill="#f1ebf8" stroke="#6a3d9a" stroke-width="2.5"/>
  <text x="175.2" y="665.0" text-anchor="middle" font-size="24" fill="#6a3d9a" font-weight="700">Two amplifiers</text>
  <text x="175.2" y="696.6" text-anchor="middle" font-size="24" fill="#2b2b2b">The tone arrives tiny.</text>
  <rect x="973.2" y="591.0" width="278.4" height="162.7" rx="10" fill="#e3f3f4" stroke="#00838f" stroke-width="2.5"/>
  <text x="1112.4" y="633.3" text-anchor="middle" font-size="24" fill="#00838f" font-weight="700">Converter</text>
  <text x="1112.4" y="665.0" text-anchor="middle" font-size="24" fill="#2b2b2b">Fast enough</text>
  <text x="1112.4" y="696.6" text-anchor="middle" font-size="24" fill="#2b2b2b">to sample the</text>
  <text x="1112.4" y="728.3" text-anchor="middle" font-size="24" fill="#2b2b2b">tone itself.</text>
  <rect x="1285.6" y="591.0" width="278.4" height="162.7" rx="10" fill="#e3f3f4" stroke="#00838f" stroke-width="2.5"/>
  <text x="1424.8" y="633.3" text-anchor="middle" font-size="24" fill="#00838f" font-weight="700">Five Goertzel filters</text>
  <text x="1424.8" y="665.0" text-anchor="middle" font-size="24" fill="#2b2b2b">In software. Every</text>
  <text x="1424.8" y="696.6" text-anchor="middle" font-size="24" fill="#2b2b2b">50 µs: how much of</text>
  <text x="1424.8" y="728.3" text-anchor="middle" font-size="24" fill="#2b2b2b">each of five pitches?</text>
  <path d="M318.4 672.4 L955.2 672.4" stroke="#9a9a9a" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M955.2 681.1 L955.2 663.7 L969.2 672.4 Z" fill="#9a9a9a"/>
  <path d="M1255.6 672.4 L1267.6 672.4" stroke="#9a9a9a" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M1267.6 681.1 L1267.6 663.7 L1281.6 672.4 Z" fill="#9a9a9a"/>
</svg>
