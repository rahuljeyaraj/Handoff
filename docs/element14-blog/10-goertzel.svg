<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="811" viewBox="0 0 1600 811" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1600" height="811" fill="#ffffff"/>
  <text x="36.0" y="61.0" text-anchor="start" font-size="25" fill="#2b2b2b" font-weight="700">The full receiver</text>
  <rect x="36.0" y="81.0" width="278.4" height="168.0" rx="10" fill="#f1ebf8" stroke="#6a3d9a" stroke-width="2.5"/>
  <text x="175.2" y="140.8" text-anchor="middle" font-size="25" fill="#6a3d9a" font-weight="700">Two amplifiers</text>
  <text x="175.2" y="173.8" text-anchor="middle" font-size="25" fill="#2b2b2b">The tone</text>
  <text x="175.2" y="206.8" text-anchor="middle" font-size="25" fill="#2b2b2b">arrives tiny.</text>
  <rect x="348.4" y="81.0" width="278.4" height="168.0" rx="10" fill="#ffffff" stroke="#9a9a9a" stroke-width="2.5" stroke-dasharray="10 8"/>
  <text x="487.6" y="124.2" text-anchor="middle" font-size="25" fill="#707070" font-weight="700">Oscillator, mixers</text>
  <text x="487.6" y="157.2" text-anchor="middle" font-size="25" fill="#2b2b2b">Shift the tone down.</text>
  <text x="487.6" y="190.2" text-anchor="middle" font-size="25" fill="#2b2b2b">Two, as the clocks</text>
  <text x="487.6" y="223.2" text-anchor="middle" font-size="25" fill="#2b2b2b">are not in step.</text>
  <rect x="660.8" y="81.0" width="278.4" height="168.0" rx="10" fill="#ffffff" stroke="#9a9a9a" stroke-width="2.5" stroke-dasharray="10 8"/>
  <text x="800.0" y="140.8" text-anchor="middle" font-size="25" fill="#707070" font-weight="700">Filter</text>
  <text x="800.0" y="173.8" text-anchor="middle" font-size="25" fill="#2b2b2b">Keeps only the</text>
  <text x="800.0" y="206.8" text-anchor="middle" font-size="25" fill="#2b2b2b">shifted tone.</text>
  <rect x="973.2" y="81.0" width="278.4" height="168.0" rx="10" fill="#ffffff" stroke="#9a9a9a" stroke-width="2.5" stroke-dasharray="10 8"/>
  <text x="1112.4" y="157.2" text-anchor="middle" font-size="25" fill="#707070" font-weight="700">Amplifier</text>
  <text x="1112.4" y="190.2" text-anchor="middle" font-size="25" fill="#2b2b2b">Boosts it again.</text>
  <rect x="1285.6" y="81.0" width="278.4" height="168.0" rx="10" fill="#e3f3f4" stroke="#00838f" stroke-width="2.5"/>
  <text x="1424.8" y="140.8" text-anchor="middle" font-size="25" fill="#00838f" font-weight="700">Converter</text>
  <text x="1424.8" y="173.8" text-anchor="middle" font-size="25" fill="#2b2b2b">Samples the slow,</text>
  <text x="1424.8" y="206.8" text-anchor="middle" font-size="25" fill="#2b2b2b">shifted result.</text>
  <path d="M318.4 165.0 L330.4 165.0" stroke="#9a9a9a" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M330.4 173.7 L330.4 156.3 L344.4 165.0 Z" fill="#9a9a9a"/>
  <path d="M630.8 165.0 L642.8 165.0" stroke="#9a9a9a" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M642.8 173.7 L642.8 156.3 L656.8 165.0 Z" fill="#9a9a9a"/>
  <path d="M943.2 165.0 L955.2 165.0" stroke="#9a9a9a" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M955.2 173.7 L955.2 156.3 L969.2 165.0 Z" fill="#9a9a9a"/>
  <path d="M1255.6 165.0 L1267.6 165.0" stroke="#9a9a9a" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M1267.6 173.7 L1267.6 156.3 L1281.6 165.0 Z" fill="#9a9a9a"/>
  <text x="36.0" y="324.0" text-anchor="start" font-size="25" fill="#2b2b2b" font-weight="700">The simple receiver</text>
  <rect x="36.0" y="344.0" width="278.4" height="168.0" rx="10" fill="#f1ebf8" stroke="#6a3d9a" stroke-width="2.5"/>
  <text x="175.2" y="403.8" text-anchor="middle" font-size="25" fill="#6a3d9a" font-weight="700">Two amplifiers</text>
  <text x="175.2" y="436.8" text-anchor="middle" font-size="25" fill="#2b2b2b">The tone</text>
  <text x="175.2" y="469.8" text-anchor="middle" font-size="25" fill="#2b2b2b">arrives tiny.</text>
  <rect x="348.4" y="344.0" width="278.4" height="168.0" rx="10" fill="#ffffff" stroke="#9a9a9a" stroke-width="2.5" stroke-dasharray="10 8"/>
  <text x="487.6" y="387.2" text-anchor="middle" font-size="25" fill="#707070" font-weight="700">Diode, capacitor</text>
  <text x="487.6" y="420.2" text-anchor="middle" font-size="25" fill="#2b2b2b">How loud, at</text>
  <text x="487.6" y="453.2" text-anchor="middle" font-size="25" fill="#2b2b2b">every pitch. Or an</text>
  <text x="487.6" y="486.2" text-anchor="middle" font-size="25" fill="#2b2b2b">LM567: yes or no.</text>
  <rect x="973.2" y="344.0" width="278.4" height="168.0" rx="10" fill="#e3f3f4" stroke="#00838f" stroke-width="2.5"/>
  <text x="1112.4" y="403.8" text-anchor="middle" font-size="25" fill="#00838f" font-weight="700">Converter</text>
  <text x="1112.4" y="436.8" text-anchor="middle" font-size="25" fill="#2b2b2b">Samples the</text>
  <text x="1112.4" y="469.8" text-anchor="middle" font-size="25" fill="#2b2b2b">loudness.</text>
  <path d="M318.4 428.0 L330.4 428.0" stroke="#9a9a9a" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M330.4 436.7 L330.4 419.3 L344.4 428.0 Z" fill="#9a9a9a"/>
  <path d="M630.8 428.0 L955.2 428.0" stroke="#9a9a9a" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M955.2 436.7 L955.2 419.3 L969.2 428.0 Z" fill="#9a9a9a"/>
  <text x="36.0" y="587.0" text-anchor="start" font-size="25" fill="#2b2b2b" font-weight="700">The band's receiver: one pitch, one number</text>
  <rect x="36.0" y="607.0" width="278.4" height="168.0" rx="10" fill="#f1ebf8" stroke="#6a3d9a" stroke-width="2.5"/>
  <text x="175.2" y="666.8" text-anchor="middle" font-size="25" fill="#6a3d9a" font-weight="700">Two amplifiers</text>
  <text x="175.2" y="699.8" text-anchor="middle" font-size="25" fill="#2b2b2b">The tone</text>
  <text x="175.2" y="732.8" text-anchor="middle" font-size="25" fill="#2b2b2b">arrives tiny.</text>
  <rect x="973.2" y="607.0" width="278.4" height="168.0" rx="10" fill="#e3f3f4" stroke="#00838f" stroke-width="2.5"/>
  <text x="1112.4" y="650.2" text-anchor="middle" font-size="25" fill="#00838f" font-weight="700">Converter</text>
  <text x="1112.4" y="683.2" text-anchor="middle" font-size="25" fill="#2b2b2b">Fast enough</text>
  <text x="1112.4" y="716.2" text-anchor="middle" font-size="25" fill="#2b2b2b">to sample the</text>
  <text x="1112.4" y="749.2" text-anchor="middle" font-size="25" fill="#2b2b2b">tone itself.</text>
  <rect x="1285.6" y="607.0" width="278.4" height="168.0" rx="10" fill="#e3f3f4" stroke="#00838f" stroke-width="2.5"/>
  <text x="1424.8" y="650.2" text-anchor="middle" font-size="25" fill="#00838f" font-weight="700">Goertzel filter</text>
  <text x="1424.8" y="683.2" text-anchor="middle" font-size="25" fill="#2b2b2b">In software.</text>
  <text x="1424.8" y="716.2" text-anchor="middle" font-size="25" fill="#2b2b2b">Every 50 µs: how</text>
  <text x="1424.8" y="749.2" text-anchor="middle" font-size="25" fill="#2b2b2b">much 200 kHz?</text>
  <path d="M318.4 691.0 L955.2 691.0" stroke="#9a9a9a" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M955.2 699.7 L955.2 682.3 L969.2 691.0 Z" fill="#9a9a9a"/>
  <path d="M1255.6 691.0 L1267.6 691.0" stroke="#9a9a9a" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M1267.6 699.7 L1267.6 682.3 L1281.6 691.0 Z" fill="#9a9a9a"/>
</svg>
