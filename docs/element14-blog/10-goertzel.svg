<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="648" viewBox="0 0 1600 648" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1600" height="648" fill="#ffffff"/>
  <text x="36.0" y="63.0" text-anchor="start" font-size="27" fill="#2b2b2b" font-weight="700">The usual receiver</text>
  <rect x="36.0" y="84.6" width="278.4" height="214.2" rx="10" fill="#f1ebf8" stroke="#6a3d9a" stroke-width="2.5"/>
  <text x="175.2" y="165.5" text-anchor="middle" font-size="27" fill="#6a3d9a" font-weight="700">Two amplifiers</text>
  <text x="175.2" y="201.2" text-anchor="middle" font-size="27" fill="#2b2b2b">The tone</text>
  <text x="175.2" y="236.8" text-anchor="middle" font-size="27" fill="#2b2b2b">arrives tiny.</text>
  <rect x="348.4" y="84.6" width="278.4" height="214.2" rx="10" fill="#ffffff" stroke="#9a9a9a" stroke-width="2.5" stroke-dasharray="10 8"/>
  <text x="487.6" y="129.9" text-anchor="middle" font-size="27" fill="#707070" font-weight="700">Oscillator, mixers</text>
  <text x="487.6" y="165.5" text-anchor="middle" font-size="27" fill="#2b2b2b">Shift the tone</text>
  <text x="487.6" y="201.2" text-anchor="middle" font-size="27" fill="#2b2b2b">down. Two,</text>
  <text x="487.6" y="236.8" text-anchor="middle" font-size="27" fill="#2b2b2b">as the clocks</text>
  <text x="487.6" y="272.4" text-anchor="middle" font-size="27" fill="#2b2b2b">are not in step.</text>
  <rect x="660.8" y="84.6" width="278.4" height="214.2" rx="10" fill="#ffffff" stroke="#9a9a9a" stroke-width="2.5" stroke-dasharray="10 8"/>
  <text x="800.0" y="165.5" text-anchor="middle" font-size="27" fill="#707070" font-weight="700">Filter</text>
  <text x="800.0" y="201.2" text-anchor="middle" font-size="27" fill="#2b2b2b">Keeps only the</text>
  <text x="800.0" y="236.8" text-anchor="middle" font-size="27" fill="#2b2b2b">shifted tone.</text>
  <rect x="973.2" y="84.6" width="278.4" height="214.2" rx="10" fill="#ffffff" stroke="#9a9a9a" stroke-width="2.5" stroke-dasharray="10 8"/>
  <text x="1112.4" y="183.3" text-anchor="middle" font-size="27" fill="#707070" font-weight="700">Amplifier</text>
  <text x="1112.4" y="219.0" text-anchor="middle" font-size="27" fill="#2b2b2b">Boosts it again.</text>
  <rect x="1285.6" y="84.6" width="278.4" height="214.2" rx="10" fill="#e3f3f4" stroke="#00838f" stroke-width="2.5"/>
  <text x="1424.8" y="165.5" text-anchor="middle" font-size="27" fill="#00838f" font-weight="700">Converter</text>
  <text x="1424.8" y="201.2" text-anchor="middle" font-size="27" fill="#2b2b2b">Samples the slow,</text>
  <text x="1424.8" y="236.8" text-anchor="middle" font-size="27" fill="#2b2b2b">shifted result.</text>
  <path d="M318.4 191.7 L330.4 191.7" stroke="#9a9a9a" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M330.4 200.4 L330.4 183.0 L344.4 191.7 Z" fill="#9a9a9a"/>
  <path d="M630.8 191.7 L642.8 191.7" stroke="#9a9a9a" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M642.8 200.4 L642.8 183.0 L656.8 191.7 Z" fill="#9a9a9a"/>
  <path d="M943.2 191.7 L955.2 191.7" stroke="#9a9a9a" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M955.2 200.4 L955.2 183.0 L969.2 191.7 Z" fill="#9a9a9a"/>
  <path d="M1255.6 191.7 L1267.6 191.7" stroke="#9a9a9a" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M1267.6 200.4 L1267.6 183.0 L1281.6 191.7 Z" fill="#9a9a9a"/>
  <text x="36.0" y="375.8" text-anchor="start" font-size="27" fill="#2b2b2b" font-weight="700">The band's receiver: four parts fewer</text>
  <rect x="36.0" y="397.4" width="278.4" height="214.2" rx="10" fill="#f1ebf8" stroke="#6a3d9a" stroke-width="2.5"/>
  <text x="175.2" y="478.3" text-anchor="middle" font-size="27" fill="#6a3d9a" font-weight="700">Two amplifiers</text>
  <text x="175.2" y="514.0" text-anchor="middle" font-size="27" fill="#2b2b2b">The tone</text>
  <text x="175.2" y="549.6" text-anchor="middle" font-size="27" fill="#2b2b2b">arrives tiny.</text>
  <rect x="973.2" y="397.4" width="278.4" height="214.2" rx="10" fill="#e3f3f4" stroke="#00838f" stroke-width="2.5"/>
  <text x="1112.4" y="460.5" text-anchor="middle" font-size="27" fill="#00838f" font-weight="700">Converter</text>
  <text x="1112.4" y="496.1" text-anchor="middle" font-size="27" fill="#2b2b2b">Fast enough</text>
  <text x="1112.4" y="531.8" text-anchor="middle" font-size="27" fill="#2b2b2b">to sample the</text>
  <text x="1112.4" y="567.4" text-anchor="middle" font-size="27" fill="#2b2b2b">tone itself.</text>
  <rect x="1285.6" y="397.4" width="278.4" height="214.2" rx="10" fill="#e3f3f4" stroke="#00838f" stroke-width="2.5"/>
  <text x="1424.8" y="460.5" text-anchor="middle" font-size="27" fill="#00838f" font-weight="700">Goertzel filter</text>
  <text x="1424.8" y="496.1" text-anchor="middle" font-size="27" fill="#2b2b2b">In software.</text>
  <text x="1424.8" y="531.8" text-anchor="middle" font-size="27" fill="#2b2b2b">Every 50 µs: how</text>
  <text x="1424.8" y="567.4" text-anchor="middle" font-size="27" fill="#2b2b2b">much 200 kHz?</text>
  <path d="M318.4 504.5 L955.2 504.5" stroke="#9a9a9a" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M955.2 513.2 L955.2 495.8 L969.2 504.5 Z" fill="#9a9a9a"/>
  <path d="M1255.6 504.5 L1267.6 504.5" stroke="#9a9a9a" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M1267.6 513.2 L1267.6 495.8 L1281.6 504.5 Z" fill="#9a9a9a"/>
</svg>
