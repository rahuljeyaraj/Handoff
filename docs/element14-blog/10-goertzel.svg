<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="885" viewBox="0 0 1600 885" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1600" height="885" fill="#ffffff"/>
  <text x="36.0" y="60.0" text-anchor="start" font-size="24" fill="#2b2b2b" font-weight="700">The full receiver</text>
  <rect x="36.0" y="79.2" width="278.4" height="194.4" rx="10" fill="#f1ebf8" stroke="#6a3d9a" stroke-width="2.5"/>
  <text x="175.2" y="169.0" text-anchor="middle" font-size="24" fill="#6a3d9a" font-weight="700">Two amplifiers</text>
  <text x="175.2" y="200.6" text-anchor="middle" font-size="24" fill="#2b2b2b">The tone arrives tiny.</text>
  <rect x="348.4" y="79.2" width="278.4" height="194.4" rx="10" fill="#ffffff" stroke="#9a9a9a" stroke-width="2.5" stroke-dasharray="10 8"/>
  <text x="487.6" y="137.3" text-anchor="middle" font-size="24" fill="#707070" font-weight="700">Oscillator, mixers</text>
  <text x="487.6" y="169.0" text-anchor="middle" font-size="24" fill="#2b2b2b">Shift the tone down.</text>
  <text x="487.6" y="200.6" text-anchor="middle" font-size="24" fill="#2b2b2b">Two, as the clocks</text>
  <text x="487.6" y="232.3" text-anchor="middle" font-size="24" fill="#2b2b2b">are not in step.</text>
  <rect x="660.8" y="79.2" width="278.4" height="194.4" rx="10" fill="#ffffff" stroke="#9a9a9a" stroke-width="2.5" stroke-dasharray="10 8"/>
  <text x="800.0" y="137.3" text-anchor="middle" font-size="24" fill="#707070" font-weight="700">Filter, amplifier</text>
  <text x="800.0" y="169.0" text-anchor="middle" font-size="24" fill="#2b2b2b">Keeps only the</text>
  <text x="800.0" y="200.6" text-anchor="middle" font-size="24" fill="#2b2b2b">shifted tone, then</text>
  <text x="800.0" y="232.3" text-anchor="middle" font-size="24" fill="#2b2b2b">boosts it again.</text>
  <rect x="973.2" y="79.2" width="278.4" height="194.4" rx="10" fill="#e3f3f4" stroke="#00838f" stroke-width="2.5"/>
  <text x="1112.4" y="153.1" text-anchor="middle" font-size="24" fill="#00838f" font-weight="700">Converter</text>
  <text x="1112.4" y="184.8" text-anchor="middle" font-size="24" fill="#2b2b2b">Samples the slow,</text>
  <text x="1112.4" y="216.5" text-anchor="middle" font-size="24" fill="#2b2b2b">shifted result.</text>
  <path d="M318.4 176.4 L330.4 176.4" stroke="#9a9a9a" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M330.4 185.1 L330.4 167.7 L344.4 176.4 Z" fill="#9a9a9a"/>
  <path d="M630.8 176.4 L642.8 176.4" stroke="#9a9a9a" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M642.8 185.1 L642.8 167.7 L656.8 176.4 Z" fill="#9a9a9a"/>
  <path d="M943.2 176.4 L955.2 176.4" stroke="#9a9a9a" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M955.2 185.1 L955.2 167.7 L969.2 176.4 Z" fill="#9a9a9a"/>
  <text x="36.0" y="347.6" text-anchor="start" font-size="24" fill="#2b2b2b" font-weight="700">The simple receiver</text>
  <rect x="36.0" y="366.8" width="278.4" height="194.4" rx="10" fill="#f1ebf8" stroke="#6a3d9a" stroke-width="2.5"/>
  <text x="175.2" y="456.6" text-anchor="middle" font-size="24" fill="#6a3d9a" font-weight="700">Two amplifiers</text>
  <text x="175.2" y="488.2" text-anchor="middle" font-size="24" fill="#2b2b2b">The tone arrives tiny.</text>
  <rect x="348.4" y="366.8" width="278.4" height="194.4" rx="10" fill="#ffffff" stroke="#9a9a9a" stroke-width="2.5" stroke-dasharray="10 8"/>
  <text x="487.6" y="440.7" text-anchor="middle" font-size="24" fill="#707070" font-weight="700">Diode, capacitor</text>
  <text x="487.6" y="472.4" text-anchor="middle" font-size="24" fill="#2b2b2b">How loud, and</text>
  <text x="487.6" y="504.1" text-anchor="middle" font-size="24" fill="#2b2b2b">every pitch at once.</text>
  <rect x="973.2" y="366.8" width="278.4" height="194.4" rx="10" fill="#e3f3f4" stroke="#00838f" stroke-width="2.5"/>
  <text x="1112.4" y="440.7" text-anchor="middle" font-size="24" fill="#00838f" font-weight="700">Converter</text>
  <text x="1112.4" y="472.4" text-anchor="middle" font-size="24" fill="#2b2b2b">Samples the</text>
  <text x="1112.4" y="504.1" text-anchor="middle" font-size="24" fill="#2b2b2b">loudness.</text>
  <path d="M318.4 464.0 L330.4 464.0" stroke="#9a9a9a" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M330.4 472.7 L330.4 455.3 L344.4 464.0 Z" fill="#9a9a9a"/>
  <path d="M630.8 464.0 L955.2 464.0" stroke="#9a9a9a" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M955.2 472.7 L955.2 455.3 L969.2 464.0 Z" fill="#9a9a9a"/>
  <text x="36.0" y="635.2" text-anchor="start" font-size="24" fill="#2b2b2b" font-weight="700">The band's receiver: the pitches, in software</text>
  <rect x="36.0" y="654.4" width="278.4" height="194.4" rx="10" fill="#f1ebf8" stroke="#6a3d9a" stroke-width="2.5"/>
  <text x="175.2" y="744.2" text-anchor="middle" font-size="24" fill="#6a3d9a" font-weight="700">Two amplifiers</text>
  <text x="175.2" y="775.8" text-anchor="middle" font-size="24" fill="#2b2b2b">The tone arrives tiny.</text>
  <rect x="973.2" y="654.4" width="278.4" height="194.4" rx="10" fill="#e3f3f4" stroke="#00838f" stroke-width="2.5"/>
  <text x="1112.4" y="712.5" text-anchor="middle" font-size="24" fill="#00838f" font-weight="700">Converter</text>
  <text x="1112.4" y="744.2" text-anchor="middle" font-size="24" fill="#2b2b2b">Fast enough</text>
  <text x="1112.4" y="775.8" text-anchor="middle" font-size="24" fill="#2b2b2b">to sample the</text>
  <text x="1112.4" y="807.5" text-anchor="middle" font-size="24" fill="#2b2b2b">tone itself.</text>
  <rect x="1285.6" y="654.4" width="278.4" height="194.4" rx="10" fill="#e3f3f4" stroke="#00838f" stroke-width="2.5"/>
  <text x="1424.8" y="696.6" text-anchor="middle" font-size="24" fill="#00838f" font-weight="700">Five Goertzel filters</text>
  <text x="1424.8" y="728.3" text-anchor="middle" font-size="24" fill="#2b2b2b">In software. The</text>
  <text x="1424.8" y="760.0" text-anchor="middle" font-size="24" fill="#2b2b2b">two tones every</text>
  <text x="1424.8" y="791.7" text-anchor="middle" font-size="24" fill="#2b2b2b">50 µs, the room's</text>
  <text x="1424.8" y="823.4" text-anchor="middle" font-size="24" fill="#2b2b2b">three every fourth.</text>
  <path d="M318.4 751.6 L955.2 751.6" stroke="#9a9a9a" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M955.2 760.3 L955.2 742.9 L969.2 751.6 Z" fill="#9a9a9a"/>
  <path d="M1255.6 751.6 L1267.6 751.6" stroke="#9a9a9a" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M1267.6 760.3 L1267.6 742.9 L1281.6 751.6 Z" fill="#9a9a9a"/>
</svg>
