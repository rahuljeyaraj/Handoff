<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="666" viewBox="0 0 1600 666" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1600" height="666" fill="#ffffff"/>
  <text x="380.0" y="73.0" text-anchor="start" font-size="37" fill="#2b2b2b" font-weight="700">Hands meet</text>
  <path d="M613.2 60.0 L1548.0 60.0" stroke="#9a9a9a" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M1548.0 70.0 L1548.0 50.1 L1564.0 60.0 Z" fill="#9a9a9a"/>
  <rect x="36.0" y="106.3" width="314.0" height="231.4" rx="10" fill="#ffffff" stroke="#ffffff" stroke-width="2.5"/>
  <text x="193.0" y="186.1" text-anchor="middle" font-size="37" fill="#2b2b2b" font-weight="700">Savithri's band</text>
  <text x="193.0" y="234.9" text-anchor="middle" font-size="37" fill="#2b2b2b">Beaconed, so it</text>
  <text x="193.0" y="283.8" text-anchor="middle" font-size="37" fill="#2b2b2b">receives first.</text>
  <rect x="380.0" y="106.3" width="285.5" height="231.4" rx="10" fill="#2e7d32" stroke="#2e7d32" stroke-width="2.5"/>
  <text x="522.8" y="161.7" text-anchor="middle" font-size="37" fill="#ffffff" font-weight="700">Beacons</text>
  <text x="522.8" y="210.5" text-anchor="middle" font-size="37" fill="#ffffff">its own</text>
  <text x="522.8" y="259.4" text-anchor="middle" font-size="37" fill="#ffffff">name, under</text>
  <text x="522.8" y="308.2" text-anchor="middle" font-size="37" fill="#ffffff">a checksum.</text>
  <rect x="679.5" y="106.3" width="285.5" height="231.4" rx="10" fill="#f1f1f1" stroke="#9a9a9a" stroke-width="2.5"/>
  <text x="822.3" y="210.5" text-anchor="middle" font-size="37" fill="#555555" font-weight="700">Recovers</text>
  <text x="822.3" y="259.4" text-anchor="middle" font-size="37" fill="#2b2b2b">then listens.</text>
  <rect x="979.0" y="106.3" width="285.5" height="231.4" rx="10" fill="#e9f4ec" stroke="#2e7d32" stroke-width="2.5"/>
  <text x="1121.8" y="186.1" text-anchor="middle" font-size="37" fill="#2e7d32" font-weight="700">Receives</text>
  <text x="1121.8" y="234.9" text-anchor="middle" font-size="37" fill="#2b2b2b">Rohit's card</text>
  <text x="1121.8" y="283.8" text-anchor="middle" font-size="37" fill="#2b2b2b">arrives.</text>
  <rect x="1278.5" y="106.3" width="285.5" height="231.4" rx="10" fill="#2e7d32" stroke="#2e7d32" stroke-width="2.5"/>
  <text x="1421.3" y="210.5" text-anchor="middle" font-size="37" fill="#ffffff" font-weight="700">Sends</text>
  <text x="1421.3" y="259.4" text-anchor="middle" font-size="37" fill="#ffffff">her own card.</text>
  <rect x="36.0" y="447.7" width="314.0" height="182.5" rx="10" fill="#ffffff" stroke="#ffffff" stroke-width="2.5"/>
  <text x="193.0" y="503.0" text-anchor="middle" font-size="37" fill="#2b2b2b" font-weight="700">Rohit's band</text>
  <text x="193.0" y="551.9" text-anchor="middle" font-size="37" fill="#2b2b2b">Read it, so it</text>
  <text x="193.0" y="600.7" text-anchor="middle" font-size="37" fill="#2b2b2b">sends first.</text>
  <rect x="380.0" y="447.7" width="285.5" height="182.5" rx="10" fill="#e9f1fc" stroke="#2f5fae" stroke-width="2.5"/>
  <text x="522.8" y="503.0" text-anchor="middle" font-size="37" fill="#2f5fae" font-weight="700">Reads it</text>
  <text x="522.8" y="551.9" text-anchor="middle" font-size="37" fill="#2b2b2b">The hands</text>
  <text x="522.8" y="600.7" text-anchor="middle" font-size="37" fill="#2b2b2b">have met.</text>
  <rect x="679.5" y="447.7" width="285.5" height="182.5" rx="10" fill="#f1f1f1" stroke="#9a9a9a" stroke-width="2.5"/>
  <text x="822.3" y="503.0" text-anchor="middle" font-size="37" fill="#555555" font-weight="700">Waits</text>
  <text x="822.3" y="551.9" text-anchor="middle" font-size="37" fill="#2b2b2b">for her beacon</text>
  <text x="822.3" y="600.7" text-anchor="middle" font-size="37" fill="#2b2b2b">to end.</text>
  <rect x="979.0" y="447.7" width="285.5" height="182.5" rx="10" fill="#2f5fae" stroke="#2f5fae" stroke-width="2.5"/>
  <text x="1121.8" y="527.5" text-anchor="middle" font-size="37" fill="#ffffff" font-weight="700">Sends</text>
  <text x="1121.8" y="576.3" text-anchor="middle" font-size="37" fill="#ffffff">his card.</text>
  <rect x="1278.5" y="447.7" width="285.5" height="182.5" rx="10" fill="#e9f1fc" stroke="#2f5fae" stroke-width="2.5"/>
  <text x="1421.3" y="503.0" text-anchor="middle" font-size="37" fill="#2f5fae" font-weight="700">Receives</text>
  <text x="1421.3" y="551.9" text-anchor="middle" font-size="37" fill="#2b2b2b">Savithri's</text>
  <text x="1421.3" y="600.7" text-anchor="middle" font-size="37" fill="#2b2b2b">card arrives.</text>
  <path d="M522.8 345.7 L522.8 423.7" stroke="#2e7d32" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M512.9 423.7 L532.7 423.7 L522.8 439.7 Z" fill="#2e7d32"/>
  <path d="M1121.8 439.7 L1121.8 361.7" stroke="#2f5fae" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M1131.7 361.7 L1111.8 361.7 L1121.8 345.7 Z" fill="#2f5fae"/>
  <path d="M1421.3 345.7 L1421.3 423.7" stroke="#2e7d32" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M1411.3 423.7 L1431.2 423.7 L1421.3 439.7 Z" fill="#2e7d32"/>
</svg>
