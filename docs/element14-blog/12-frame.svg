  <text x="1415.5" y="190.9" text-anchor="middle" font-size="28" fill="#2b2b2b">Covers the header</text>
  <text x="1415.5" y="227.9" text-anchor="middle" font-size="28" fill="#2b2b2b">and the piece</text>
  <text x="36.0" y="341.0" text-anchor="start" font-size="28" fill="#2b2b2b" font-weight="700">Where the frame starts: those same bits, as chips</text>
