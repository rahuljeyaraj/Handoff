  <text x="36.0" y="64.0" text-anchor="start" font-size="28" fill="#2b2b2b" font-weight="700">The five parts of a frame, in the order they are sent</text>
  <rect x="36.0" y="89.2" width="258.2" height="183.8" rx="10" fill="#e9f1fc" stroke="#2f5fae" stroke-width="2.5"/>
  <text x="165.1" y="135.5" text-anchor="middle" font-size="28" fill="#2f5fae" font-weight="700">Preamble</text>
  <text x="165.1" y="172.4" text-anchor="middle" font-size="28" fill="#2b2b2b">32 chips: the</text>
  <text x="165.1" y="209.4" text-anchor="middle" font-size="28" fill="#2b2b2b">two tones, turn</text>
  <text x="165.1" y="246.4" text-anchor="middle" font-size="28" fill="#2b2b2b">and turn about</text>
