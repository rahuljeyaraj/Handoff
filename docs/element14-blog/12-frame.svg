  <text x="424.5" y="190.9" text-anchor="middle" font-size="28" fill="#2b2b2b">Eight bits:</text>
  <text x="424.5" y="227.9" text-anchor="middle" font-size="28" fill="#2b2b2b">11110000</text>
  <rect x="554.7" y="89.2" width="297.0" height="183.8" rx="10" fill="#e9f4ec" stroke="#2e7d32" stroke-width="2.5"/>
  <text x="703.2" y="135.5" text-anchor="middle" font-size="28" fill="#2e7d32" font-weight="700">Header</text>
  <text x="703.2" y="172.4" text-anchor="middle" font-size="28" fill="#2b2b2b">Which frame,</text>
  <text x="703.2" y="209.4" text-anchor="middle" font-size="28" fill="#2b2b2b">of how many,</text>
  <text x="703.2" y="246.4" text-anchor="middle" font-size="28" fill="#2b2b2b">whose card</text>
  <rect x="865.6" y="89.2" width="387.4" height="183.8" rx="10" fill="#fdf3e1" stroke="#a86b00" stroke-width="2.5"/>
  <text x="1059.3" y="154.0" text-anchor="middle" font-size="28" fill="#a86b00" font-weight="700">A piece of the card</text>
  <text x="1059.3" y="190.9" text-anchor="middle" font-size="28" fill="#2b2b2b">32 bytes, always. A</text>
  <text x="1059.3" y="227.9" text-anchor="middle" font-size="28" fill="#2b2b2b">short piece is padded.</text>
  <rect x="1267.0" y="89.2" width="297.0" height="183.8" rx="10" fill="#fdeceb" stroke="#c0392b" stroke-width="2.5"/>
