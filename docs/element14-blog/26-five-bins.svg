  <rect x="968.4" y="170.0" width="284.8" height="154.8" rx="10" fill="#c0392b" stroke="#c0392b" stroke-width="2.5"/>
  <text x="1110.8" y="238.1" text-anchor="middle" font-size="30" fill="#ffffff" font-weight="700">Tone B, 200 kHz</text>
