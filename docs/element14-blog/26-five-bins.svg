  <text x="489.2" y="218.3" text-anchor="middle" font-size="30" fill="#555555" font-weight="700">160 kHz</text>
  <text x="489.2" y="257.9" text-anchor="middle" font-size="30" fill="#2b2b2b">How loud is</text>
  <text x="489.2" y="297.5" text-anchor="middle" font-size="30" fill="#2b2b2b">the room?</text>
  <rect x="657.6" y="170.0" width="284.8" height="154.8" rx="10" fill="#c0392b" stroke="#c0392b" stroke-width="2.5"/>
  <text x="800.0" y="238.1" text-anchor="middle" font-size="30" fill="#ffffff" font-weight="700">Tone A, 180 kHz</text>
