  <text x="1015.0" y="382.0" text-anchor="middle" font-size="39" fill="#2b2b2b">a firm grip</text>
  <text x="1015.0" y="426.0" text-anchor="middle" font-size="39" fill="#c0392b" font-weight="700">Heard</text>
