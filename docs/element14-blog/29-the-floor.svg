<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="681" viewBox="0 0 1600 681" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1600" height="681" fill="#ffffff"/>
  <text x="36.0" y="75.0" text-anchor="start" font-size="39" fill="#2b2b2b" font-weight="700">v1: louder than usual?</text>
  <rect x="36.0" y="114.0" width="732.0" height="330.0" rx="8" fill="#ffffff" stroke="#cfcfcf" stroke-width="2"/>
  <text x="36.0" y="502.5" text-anchor="start" font-size="39" fill="#555555">Usual has to be remembered. Every frame</text>
  <text x="36.0" y="554.0" text-anchor="start" font-size="39" fill="#555555">it had already gone deaf to was averaged</text>
  <text x="36.0" y="605.5" text-anchor="start" font-size="39" fill="#555555">in as quiet, so the floor only ever climbed.</text>
  <text x="832.0" y="75.0" text-anchor="start" font-size="39" fill="#2b2b2b" font-weight="700">v2: louder than the room, right now?</text>
  <rect x="832.0" y="114.0" width="732.0" height="330.0" rx="8" fill="#ffffff" stroke="#cfcfcf" stroke-width="2"/>
  <text x="832.0" y="502.5" text-anchor="start" font-size="39" fill="#555555">Signal and room are measured in the same</text>
  <text x="832.0" y="554.0" text-anchor="start" font-size="39" fill="#555555">50 µs, in the same amplifier, through the</text>
  <text x="832.0" y="605.5" text-anchor="start" font-size="39" fill="#555555">same body. Grip cancels.</text>
  <rect x="411.4" y="116.0" width="328.6" height="326.0" rx="0" fill="#f6f6f6" stroke="#f6f6f6" stroke-width="0"/>
