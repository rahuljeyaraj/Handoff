  <text x="70.0" y="243.2" text-anchor="start" font-size="39" fill="#c0392b" font-weight="700">the tone, unchanged</text>
  <text x="734.0" y="387.9" text-anchor="end" font-size="39" fill="#555555">the floor it remembered</text>
  <text x="734.0" y="145.6" text-anchor="end" font-size="39" fill="#2b2b2b">the gate</text>
  <text x="576.7" y="314.0" text-anchor="middle" font-size="39" fill="#555555" font-weight="700">Deaf from here</text>
