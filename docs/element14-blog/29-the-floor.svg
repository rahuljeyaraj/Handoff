  <text x="1381.0" y="382.0" text-anchor="middle" font-size="39" fill="#2b2b2b">a lighter grip</text>
  <text x="1381.0" y="426.0" text-anchor="middle" font-size="39" fill="#c0392b" font-weight="700">Heard</text>
