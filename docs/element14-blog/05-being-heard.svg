<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="884" viewBox="0 0 1600 884" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1600" height="884" fill="#ffffff"/>
  <text x="556.9" y="75.0" text-anchor="middle" font-size="39" fill="#2e7d32" font-weight="700">Savithri's band</text>
  <text x="973.7" y="75.0" text-anchor="middle" font-size="39" fill="#2b2b2b" font-weight="700">Between them</text>
  <text x="1390.6" y="75.0" text-anchor="middle" font-size="39" fill="#2f5fae" font-weight="700">Rohit's band</text>
  <rect x="36.0" y="106.2" width="277.5" height="190.4" rx="10" fill="#ffffff" stroke="#ffffff" stroke-width="2.5"/>
  <text x="174.7" y="189.3" text-anchor="middle" font-size="39" fill="#2b2b2b" font-weight="700">Both wait</text>
  <text x="174.7" y="240.8" text-anchor="middle" font-size="39" fill="#2b2b2b" font-weight="700">to hear first</text>
  <rect x="383.5" y="106.2" width="346.8" height="190.4" rx="10" fill="#e9f4ec" stroke="#2e7d32" stroke-width="2.5"/>
  <text x="556.9" y="189.3" text-anchor="middle" font-size="39" fill="#2b2b2b">Listens, waiting</text>
  <text x="556.9" y="240.8" text-anchor="middle" font-size="39" fill="#2b2b2b">to hear someone.</text>
  <rect x="800.3" y="106.2" width="346.8" height="190.4" rx="10" fill="#f1f1f1" stroke="#9a9a9a" stroke-width="2.5" stroke-dasharray="12 9"/>
  <text x="973.7" y="163.6" text-anchor="middle" font-size="39" fill="#2b2b2b">Hands meet.</text>
  <text x="973.7" y="215.1" text-anchor="middle" font-size="39" fill="#2b2b2b">Silence. Nobody</text>
  <text x="973.7" y="266.6" text-anchor="middle" font-size="39" fill="#2b2b2b">ever speaks.</text>
  <rect x="1217.2" y="106.2" width="346.8" height="190.4" rx="10" fill="#e9f1fc" stroke="#2f5fae" stroke-width="2.5"/>
  <text x="1390.6" y="189.3" text-anchor="middle" font-size="39" fill="#2b2b2b">Listens, waiting</text>
  <text x="1390.6" y="240.8" text-anchor="middle" font-size="39" fill="#2b2b2b">to hear someone.</text>
  <rect x="36.0" y="330.6" width="277.5" height="241.9" rx="10" fill="#ffffff" stroke="#ffffff" stroke-width="2.5"/>
  <text x="174.7" y="413.8" text-anchor="middle" font-size="39" fill="#2b2b2b" font-weight="700">One</text>
  <text x="174.7" y="465.2" text-anchor="middle" font-size="39" fill="#2b2b2b" font-weight="700">beacons,</text>
  <text x="174.7" y="516.7" text-anchor="middle" font-size="39" fill="#2b2b2b" font-weight="700">apart</text>
  <rect x="383.5" y="330.6" width="346.8" height="241.9" rx="10" fill="#e9f4ec" stroke="#2e7d32" stroke-width="2.5"/>
  <text x="556.9" y="388.0" text-anchor="middle" font-size="39" fill="#2b2b2b">Sends a</text>
  <text x="556.9" y="439.5" text-anchor="middle" font-size="39" fill="#2b2b2b">beacon: a tiny</text>
  <text x="556.9" y="491.0" text-anchor="middle" font-size="39" fill="#2b2b2b">frame with its</text>
  <text x="556.9" y="542.5" text-anchor="middle" font-size="39" fill="#2b2b2b">own name in it.</text>
  <rect x="800.3" y="330.6" width="346.8" height="241.9" rx="10" fill="#f1f1f1" stroke="#9a9a9a" stroke-width="2.5" stroke-dasharray="12 9"/>
  <text x="973.7" y="439.5" text-anchor="middle" font-size="39" fill="#2b2b2b">The beacon</text>
  <text x="973.7" y="491.0" text-anchor="middle" font-size="39" fill="#2b2b2b">never arrives.</text>
  <rect x="1217.2" y="330.6" width="346.8" height="241.9" rx="10" fill="#e9f1fc" stroke="#2f5fae" stroke-width="2.5"/>
  <text x="1390.6" y="439.5" text-anchor="middle" font-size="39" fill="#2b2b2b">Hears nothing.</text>
  <text x="1390.6" y="491.0" text-anchor="middle" font-size="39" fill="#2b2b2b">Is anyone there?</text>
  <path d="M738.3 451.6 L776.3 451.6" stroke="#9a9a9a" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="10 9"/>
  <path d="M776.3 461.5 L776.3 441.7 L792.3 451.6 Z" fill="#9a9a9a"/>
  <rect x="36.0" y="606.6" width="277.5" height="241.9" rx="10" fill="#ffffff" stroke="#ffffff" stroke-width="2.5"/>
  <text x="174.7" y="663.9" text-anchor="middle" font-size="39" fill="#2b2b2b" font-weight="700">One</text>
  <text x="174.7" y="715.4" text-anchor="middle" font-size="39" fill="#2b2b2b" font-weight="700">beacons,</text>
  <text x="174.7" y="766.9" text-anchor="middle" font-size="39" fill="#2b2b2b" font-weight="700">hand in</text>
  <text x="174.7" y="818.4" text-anchor="middle" font-size="39" fill="#2b2b2b" font-weight="700">hand</text>
  <rect x="383.5" y="606.6" width="346.8" height="241.9" rx="10" fill="#e9f4ec" stroke="#2e7d32" stroke-width="2.5"/>
  <text x="556.9" y="663.9" text-anchor="middle" font-size="39" fill="#2b2b2b">Sends a</text>
  <text x="556.9" y="715.4" text-anchor="middle" font-size="39" fill="#2b2b2b">beacon: a tiny</text>
  <text x="556.9" y="766.9" text-anchor="middle" font-size="39" fill="#2b2b2b">frame with its</text>
  <text x="556.9" y="818.4" text-anchor="middle" font-size="39" fill="#2b2b2b">own name in it.</text>
  <rect x="800.3" y="606.6" width="346.8" height="241.9" rx="10" fill="#fdeceb" stroke="#c0392b" stroke-width="2.5"/>
  <text x="973.7" y="689.7" text-anchor="middle" font-size="39" fill="#2b2b2b">The beacon</text>
  <text x="973.7" y="741.2" text-anchor="middle" font-size="39" fill="#2b2b2b">crosses</text>
  <text x="973.7" y="792.6" text-anchor="middle" font-size="39" fill="#2b2b2b">both bodies.</text>
  <rect x="1217.2" y="606.6" width="346.8" height="241.9" rx="10" fill="#e9f1fc" stroke="#2f5fae" stroke-width="2.5"/>
  <text x="1390.6" y="715.4" text-anchor="middle" font-size="39" fill="#2b2b2b">Reads it. So the</text>
  <text x="1390.6" y="766.9" text-anchor="middle" font-size="39" fill="#2b2b2b">hands have met.</text>
  <path d="M738.3 727.5 L776.3 727.5" stroke="#2e7d32" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M776.3 737.4 L776.3 717.6 L792.3 727.5 Z" fill="#2e7d32"/>
  <path d="M1155.2 727.5 L1193.2 727.5" stroke="#c0392b" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M1193.2 737.4 L1193.2 717.6 L1209.2 727.5 Z" fill="#c0392b"/>
</svg>
