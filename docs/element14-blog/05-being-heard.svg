<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="883" viewBox="0 0 1600 883" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1600" height="883" fill="#ffffff"/>
  <text x="657.7" y="72.0" text-anchor="middle" font-size="36" fill="#2e7d32" font-weight="700">Savithri's band</text>
  <text x="1034.2" y="72.0" text-anchor="middle" font-size="36" fill="#2b2b2b" font-weight="700">Between them</text>
  <text x="1410.7" y="72.0" text-anchor="middle" font-size="36" fill="#2f5fae" font-weight="700">Rohit's band</text>
  <rect x="36.0" y="100.8" width="398.5" height="226.1" rx="10" fill="#ffffff" stroke="#ffffff" stroke-width="2.5"/>
  <text x="235.2" y="202.7" text-anchor="middle" font-size="36" fill="#2b2b2b" font-weight="700">If both wait</text>
  <text x="235.2" y="250.2" text-anchor="middle" font-size="36" fill="#2b2b2b" font-weight="700">to hear first</text>
  <rect x="504.5" y="100.8" width="306.5" height="226.1" rx="10" fill="#e9f4ec" stroke="#2e7d32" stroke-width="2.5"/>
  <text x="657.7" y="178.9" text-anchor="middle" font-size="36" fill="#2b2b2b">Listens,</text>
  <text x="657.7" y="226.4" text-anchor="middle" font-size="36" fill="#2b2b2b">waiting to</text>
  <text x="657.7" y="274.0" text-anchor="middle" font-size="36" fill="#2b2b2b">hear someone.</text>
  <rect x="881.0" y="100.8" width="306.5" height="226.1" rx="10" fill="#f1f1f1" stroke="#9a9a9a" stroke-width="2.5" stroke-dasharray="12 9"/>
  <text x="1034.2" y="155.2" text-anchor="middle" font-size="36" fill="#2b2b2b">Hands meet.</text>
  <text x="1034.2" y="202.7" text-anchor="middle" font-size="36" fill="#2b2b2b">Silence.</text>
  <text x="1034.2" y="250.2" text-anchor="middle" font-size="36" fill="#2b2b2b">Nobody ever</text>
  <text x="1034.2" y="297.7" text-anchor="middle" font-size="36" fill="#2b2b2b">speaks.</text>
  <rect x="1257.5" y="100.8" width="306.5" height="226.1" rx="10" fill="#e9f1fc" stroke="#2f5fae" stroke-width="2.5"/>
  <text x="1410.7" y="178.9" text-anchor="middle" font-size="36" fill="#2b2b2b">Listens,</text>
  <text x="1410.7" y="226.4" text-anchor="middle" font-size="36" fill="#2b2b2b">waiting to</text>
  <text x="1410.7" y="274.0" text-anchor="middle" font-size="36" fill="#2b2b2b">hear someone.</text>
  <rect x="36.0" y="360.9" width="398.5" height="226.1" rx="10" fill="#ffffff" stroke="#ffffff" stroke-width="2.5"/>
  <text x="235.2" y="462.8" text-anchor="middle" font-size="36" fill="#2b2b2b" font-weight="700">If one beacons</text>
  <text x="235.2" y="510.3" text-anchor="middle" font-size="36" fill="#2b2b2b" font-weight="700">while apart</text>
  <rect x="504.5" y="360.9" width="306.5" height="226.1" rx="10" fill="#e9f4ec" stroke="#2e7d32" stroke-width="2.5"/>
  <text x="657.7" y="462.8" text-anchor="middle" font-size="36" fill="#2b2b2b">Sends a</text>
  <text x="657.7" y="510.3" text-anchor="middle" font-size="36" fill="#2b2b2b">beacon.</text>
  <rect x="881.0" y="360.9" width="306.5" height="226.1" rx="10" fill="#f1f1f1" stroke="#9a9a9a" stroke-width="2.5" stroke-dasharray="12 9"/>
  <text x="1034.2" y="462.8" text-anchor="middle" font-size="36" fill="#2b2b2b">The beacon</text>
  <text x="1034.2" y="510.3" text-anchor="middle" font-size="36" fill="#2b2b2b">never arrives.</text>
  <rect x="1257.5" y="360.9" width="306.5" height="226.1" rx="10" fill="#e9f1fc" stroke="#2f5fae" stroke-width="2.5"/>
  <text x="1410.7" y="439.0" text-anchor="middle" font-size="36" fill="#2b2b2b">Hears</text>
  <text x="1410.7" y="486.5" text-anchor="middle" font-size="36" fill="#2b2b2b">nothing. Is</text>
  <text x="1410.7" y="534.0" text-anchor="middle" font-size="36" fill="#2b2b2b">anyone there?</text>
  <path d="M819.0 473.9 L857.0 473.9" stroke="#9a9a9a" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="10 9"/>
  <path d="M857.0 483.8 L857.0 464.0 L873.0 473.9 Z" fill="#9a9a9a"/>
  <rect x="36.0" y="621.0" width="398.5" height="226.1" rx="10" fill="#ffffff" stroke="#ffffff" stroke-width="2.5"/>
  <text x="235.2" y="722.8" text-anchor="middle" font-size="36" fill="#2b2b2b" font-weight="700">If one beacons</text>
  <text x="235.2" y="770.4" text-anchor="middle" font-size="36" fill="#2b2b2b" font-weight="700">while hand in hand</text>
  <rect x="504.5" y="621.0" width="306.5" height="226.1" rx="10" fill="#e9f4ec" stroke="#2e7d32" stroke-width="2.5"/>
  <text x="657.7" y="722.8" text-anchor="middle" font-size="36" fill="#2b2b2b">Sends a</text>
  <text x="657.7" y="770.4" text-anchor="middle" font-size="36" fill="#2b2b2b">beacon.</text>
  <rect x="881.0" y="621.0" width="306.5" height="226.1" rx="10" fill="#fdeceb" stroke="#c0392b" stroke-width="2.5"/>
  <text x="1034.2" y="699.1" text-anchor="middle" font-size="36" fill="#2b2b2b">The beacon</text>
  <text x="1034.2" y="746.6" text-anchor="middle" font-size="36" fill="#2b2b2b">crosses</text>
  <text x="1034.2" y="794.1" text-anchor="middle" font-size="36" fill="#2b2b2b">both bodies.</text>
  <rect x="1257.5" y="621.0" width="306.5" height="226.1" rx="10" fill="#e9f1fc" stroke="#2f5fae" stroke-width="2.5"/>
  <text x="1410.7" y="699.1" text-anchor="middle" font-size="36" fill="#2b2b2b">Reads it. So</text>
  <text x="1410.7" y="746.6" text-anchor="middle" font-size="36" fill="#2b2b2b">the hands</text>
  <text x="1410.7" y="794.1" text-anchor="middle" font-size="36" fill="#2b2b2b">have met.</text>
  <path d="M819.0 734.0 L857.0 734.0" stroke="#2e7d32" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M857.0 743.9 L857.0 724.1 L873.0 734.0 Z" fill="#2e7d32"/>
  <path d="M1195.5 734.0 L1233.5 734.0" stroke="#c0392b" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M1233.5 743.9 L1233.5 724.1 L1249.5 734.0 Z" fill="#c0392b"/>
</svg>
