  <path d="M1209.6 624.4 L1229.4 624.4 L1219.5 640.4 Z" fill="#c0392b"/>
  <path d="M867.0 755.5 L749.0 755.5" stroke="#2e7d32" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
