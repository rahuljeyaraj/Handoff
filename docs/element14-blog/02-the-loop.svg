<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="893" viewBox="0 0 1600 893" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1600" height="893" fill="#ffffff"/>
  <rect x="36.0" y="36.0" width="442.7" height="268.3" rx="10" fill="#e9f1fc" stroke="#2f5fae" stroke-width="2.5"/>
  <text x="257.3" y="156.5" text-anchor="middle" font-size="44" fill="#2f5fae" font-weight="700">Rohit's band</text>
  <text x="257.3" y="214.6" text-anchor="middle" font-size="44" fill="#2b2b2b">Puts the tone out.</text>
  <rect x="578.7" y="36.0" width="442.7" height="268.3" rx="10" fill="#e9f1fc" stroke="#2f5fae" stroke-width="2.5"/>
  <text x="800.0" y="98.4" text-anchor="middle" font-size="44" fill="#2f5fae" font-weight="700">His coated plate</text>
  <text x="800.0" y="156.5" text-anchor="middle" font-size="44" fill="#2b2b2b">Half a capacitor.</text>
  <text x="800.0" y="214.6" text-anchor="middle" font-size="44" fill="#2b2b2b">Never touches</text>
  <text x="800.0" y="272.7" text-anchor="middle" font-size="44" fill="#2b2b2b">his skin.</text>
  <rect x="1121.3" y="36.0" width="442.7" height="268.3" rx="10" fill="#fdeceb" stroke="#c0392b" stroke-width="2.5"/>
  <text x="1342.7" y="98.4" text-anchor="middle" font-size="44" fill="#c0392b" font-weight="700">The wire</text>
  <text x="1342.7" y="156.5" text-anchor="middle" font-size="44" fill="#2b2b2b">His arm, the</text>
  <text x="1342.7" y="214.6" text-anchor="middle" font-size="44" fill="#2b2b2b">handshake,</text>
  <text x="1342.7" y="272.7" text-anchor="middle" font-size="44" fill="#2b2b2b">her arm.</text>
  <rect x="36.0" y="414.3" width="442.7" height="442.6" rx="10" fill="#f1f1f1" stroke="#9a9a9a" stroke-width="2.5"/>
  <text x="257.3" y="476.8" text-anchor="middle" font-size="44" fill="#555555" font-weight="700">The room</text>
  <text x="257.3" y="534.8" text-anchor="middle" font-size="44" fill="#2b2b2b">Both bands' outer</text>
  <text x="257.3" y="592.9" text-anchor="middle" font-size="44" fill="#2b2b2b">faces, and both</text>
  <text x="257.3" y="651.0" text-anchor="middle" font-size="44" fill="#2b2b2b">bodies, couple to</text>
  <text x="257.3" y="709.1" text-anchor="middle" font-size="44" fill="#2b2b2b">the floor and</text>
  <text x="257.3" y="767.2" text-anchor="middle" font-size="44" fill="#2b2b2b">walls. The loop</text>
  <text x="257.3" y="825.2" text-anchor="middle" font-size="44" fill="#2b2b2b">closes here.</text>
  <rect x="578.7" y="414.3" width="442.7" height="442.6" rx="10" fill="#e9f4ec" stroke="#2e7d32" stroke-width="2.5"/>
  <text x="800.0" y="622.0" text-anchor="middle" font-size="44" fill="#2e7d32" font-weight="700">Savithri's band</text>
  <text x="800.0" y="680.0" text-anchor="middle" font-size="44" fill="#2b2b2b">Hears the tone.</text>
  <rect x="1121.3" y="414.3" width="442.7" height="442.6" rx="10" fill="#e9f4ec" stroke="#2e7d32" stroke-width="2.5"/>
  <text x="1342.7" y="592.9" text-anchor="middle" font-size="44" fill="#2e7d32" font-weight="700">Her coated plate</text>
  <text x="1342.7" y="651.0" text-anchor="middle" font-size="44" fill="#2b2b2b">Picks the tone</text>
  <text x="1342.7" y="709.1" text-anchor="middle" font-size="44" fill="#2b2b2b">up off her skin.</text>
