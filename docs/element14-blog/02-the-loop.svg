<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="899" viewBox="0 0 1600 899" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1600" height="899" fill="#ffffff"/>
  <rect x="36.0" y="36.0" width="689.0" height="214.2" rx="10" fill="#e9f1fc" stroke="#2f5fae" stroke-width="2.5"/>
  <text x="380.5" y="99.5" text-anchor="middle" font-size="45" fill="#2f5fae" font-weight="700">Rohit's band</text>
  <text x="380.5" y="158.9" text-anchor="middle" font-size="45" fill="#2b2b2b">Switches a pin</text>
  <text x="380.5" y="218.2" text-anchor="middle" font-size="45" fill="#2b2b2b">between two pitches.</text>
  <rect x="875.0" y="36.0" width="689.0" height="214.2" rx="10" fill="#e9f1fc" stroke="#2f5fae" stroke-width="2.5"/>
  <text x="1219.5" y="129.2" text-anchor="middle" font-size="45" fill="#2f5fae" font-weight="700">His coated plate</text>
  <text x="1219.5" y="188.6" text-anchor="middle" font-size="45" fill="#2b2b2b">Puts the tone onto his skin.</text>
  <rect x="36.0" y="342.2" width="689.0" height="214.2" rx="10" fill="#f1f1f1" stroke="#9a9a9a" stroke-width="2.5"/>
  <text x="380.5" y="405.7" text-anchor="middle" font-size="45" fill="#555555" font-weight="700">The room</text>
  <text x="380.5" y="465.1" text-anchor="middle" font-size="45" fill="#2b2b2b">Floor and walls</text>
  <text x="380.5" y="524.5" text-anchor="middle" font-size="45" fill="#2b2b2b">carry the return.</text>
  <rect x="875.0" y="342.2" width="689.0" height="214.2" rx="10" fill="#fdeceb" stroke="#c0392b" stroke-width="2.5"/>
  <text x="1219.5" y="405.7" text-anchor="middle" font-size="45" fill="#c0392b" font-weight="700">The wire</text>
  <text x="1219.5" y="465.1" text-anchor="middle" font-size="45" fill="#2b2b2b">His arm, the</text>
  <text x="1219.5" y="524.5" text-anchor="middle" font-size="45" fill="#2b2b2b">handshake, her arm.</text>
  <rect x="36.0" y="648.4" width="689.0" height="214.2" rx="10" fill="#e9f4ec" stroke="#2e7d32" stroke-width="2.5"/>
  <text x="380.5" y="711.9" text-anchor="middle" font-size="45" fill="#2e7d32" font-weight="700">Savithri's band</text>
  <text x="380.5" y="771.3" text-anchor="middle" font-size="45" fill="#2b2b2b">Scores both pitches,</text>
  <text x="380.5" y="830.7" text-anchor="middle" font-size="45" fill="#2b2b2b">takes the louder.</text>
  <rect x="875.0" y="648.4" width="689.0" height="214.2" rx="10" fill="#e9f4ec" stroke="#2e7d32" stroke-width="2.5"/>
  <text x="1219.5" y="741.6" text-anchor="middle" font-size="45" fill="#2e7d32" font-weight="700">Her coated plate</text>
  <text x="1219.5" y="801.0" text-anchor="middle" font-size="45" fill="#2b2b2b">Picks the tone up off her skin.</text>
