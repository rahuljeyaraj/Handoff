<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="890" viewBox="0 0 1600 890" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1600" height="890" fill="#ffffff"/>
  <text x="36.0" y="75.0" text-anchor="start" font-size="39" fill="#2e7d32" font-weight="700">Savithri's band</text>
  <rect x="36.0" y="102.3" width="285.2" height="293.4" rx="10" fill="#2e7d32" stroke="#2e7d32" stroke-width="2.5"/>
  <text x="178.6" y="185.4" text-anchor="middle" font-size="39" fill="#ffffff" font-weight="700">Beacons</text>
  <text x="178.6" y="236.9" text-anchor="middle" font-size="39" fill="#ffffff">A nonce,</text>
  <text x="178.6" y="288.4" text-anchor="middle" font-size="39" fill="#ffffff">under a</text>
  <text x="178.6" y="339.9" text-anchor="middle" font-size="39" fill="#ffffff">checksum.</text>
  <rect x="321.2" y="102.3" width="50.9" height="293.4" rx="10" fill="#f1f1f1" stroke="#9a9a9a" stroke-width="2.5"/>
  <rect x="372.2" y="102.3" width="1191.8" height="293.4" rx="10" fill="#e9f4ec" stroke="#2e7d32" stroke-width="2.5"/>
  <text x="968.1" y="236.9" text-anchor="middle" font-size="39" fill="#2e7d32" font-weight="700">Listens</text>
  <text x="968.1" y="288.4" text-anchor="middle" font-size="39" fill="#2b2b2b">A random period, drawn fresh every cycle.</text>
  <path d="M36.0 405.7 L36.0 421.7 L372.2 421.7 L372.2 405.7" stroke="#9a9a9a" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="36.0" y="458.8" text-anchor="start" font-size="39" fill="#555555" font-weight="700">Deaf while it beacons, and for a moment after</text>
  <text x="36.0" y="532.9" text-anchor="start" font-size="39" fill="#2f5fae" font-weight="700">Rohit's band</text>
  <rect x="36.0" y="560.2" width="529.7" height="293.4" rx="10" fill="#e9f1fc" stroke="#2f5fae" stroke-width="2.5"/>
  <text x="300.9" y="617.5" text-anchor="middle" font-size="39" fill="#2f5fae" font-weight="700">Listens</text>
  <text x="300.9" y="669.0" text-anchor="middle" font-size="39" fill="#2b2b2b">Reads the beacon.</text>
  <text x="300.9" y="720.5" text-anchor="middle" font-size="39" fill="#2b2b2b">Checksum good,</text>
  <text x="300.9" y="772.0" text-anchor="middle" font-size="39" fill="#2b2b2b">nonce not its own:</text>
  <text x="300.9" y="823.5" text-anchor="middle" font-size="39" fill="#2b2b2b">the hands have met.</text>
  <rect x="565.7" y="560.2" width="285.2" height="293.4" rx="10" fill="#f1f1f1" stroke="#9a9a9a" stroke-width="2.5" stroke-dasharray="10 8"/>
  <text x="708.3" y="643.3" text-anchor="middle" font-size="39" fill="#2b2b2b">The beacon it</text>
  <text x="708.3" y="694.8" text-anchor="middle" font-size="39" fill="#2b2b2b">would have</text>
  <text x="708.3" y="746.2" text-anchor="middle" font-size="39" fill="#2b2b2b">sent, now</text>
  <text x="708.3" y="797.7" text-anchor="middle" font-size="39" fill="#2b2b2b">never sent</text>
  <rect x="850.9" y="560.2" width="713.1" height="293.4" rx="10" fill="#2f5fae" stroke="#2f5fae" stroke-width="2.5"/>
  <text x="1207.5" y="694.8" text-anchor="middle" font-size="39" fill="#ffffff" font-weight="700">Sends</text>
  <text x="1207.5" y="746.2" text-anchor="middle" font-size="39" fill="#ffffff">the first frame of his card.</text>
</svg>
