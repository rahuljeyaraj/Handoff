<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="620" fill="#ffffff"/>
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#333"/>
    </marker>
  </defs>

  <text x="450" y="36" text-anchor="middle" font-size="21" font-weight="700" fill="#1a1a1a">Frame — where does the packet start?</text>
  <line x1="50" y1="52" x2="850" y2="52" stroke="#d0d0d0" stroke-width="1"/>

  <text x="70" y="82" font-size="14" font-weight="700" fill="#4066c0">A.  The five parts</text>

  <rect x="70"  y="96" width="150" height="46" fill="#dde6f5" stroke="#4066c0"/>
  <rect x="220" y="96" width="80"  height="46" fill="#4066c0"/>
  <rect x="300" y="96" width="100" height="46" fill="#eaf3ea" stroke="#2e7d32"/>
  <rect x="400" y="96" width="330" height="46" fill="#f5f0e3" stroke="#8a6d1f"/>
  <rect x="730" y="96" width="100" height="46" fill="#fbeae8" stroke="#c0392b"/>

  <text x="145" y="118" text-anchor="middle" font-size="13" font-weight="700" fill="#2a4a90">Preamble</text>
  <text x="145" y="134" text-anchor="middle" font-size="10" fill="#5a76a8">32 chips  1010...</text>
  <text x="260" y="118" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">Marker</text>
  <text x="260" y="134" text-anchor="middle" font-size="10" fill="#ccd8ee">0xF0</text>
  <text x="350" y="118" text-anchor="middle" font-size="13" font-weight="700" fill="#2e7d32">Header</text>
  <text x="350" y="134" text-anchor="middle" font-size="10" fill="#5a8a5c">2 bytes</text>
  <text x="565" y="118" text-anchor="middle" font-size="13" font-weight="700" fill="#8a6d1f">Payload</text>
  <text x="565" y="134" text-anchor="middle" font-size="10" fill="#a08a50">32 bytes, always — pad with NOPs</text>
  <text x="780" y="118" text-anchor="middle" font-size="13" font-weight="700" fill="#c0392b">CRC</text>
  <text x="780" y="134" text-anchor="middle" font-size="10" fill="#c07a70">2 bytes</text>

  <line x1="300" y1="152" x2="830" y2="152" stroke="#999" stroke-width="1"/>
  <line x1="300" y1="148" x2="300" y2="156" stroke="#999"/>
  <line x1="730" y1="148" x2="730" y2="156" stroke="#999"/>
  <line x1="830" y1="148" x2="830" y2="156" stroke="#999"/>
  <text x="515" y="168" text-anchor="middle" font-size="11" fill="#777">CRC covers header + payload</text>

  <text x="70" y="192" font-size="11" fill="#888">No length field. The frag count already says when the record is complete — and a length field can itself be corrupted.</text>

  <line x1="50" y1="208" x2="850" y2="208" stroke="#e5e5e5"/>

  <text x="70" y="236" font-size="14" font-weight="700" fill="#c0392b">B.  One 00 in the whole run — that is the landmark</text>

  <text x="70" y="266" font-size="11" fill="#555">preamble chips</text>
  <text x="330" y="266" font-size="11" fill="#4066c0" font-weight="700">marker 0xF0 = 11110000</text>

  <g font-size="11" font-family="Consolas, monospace" text-anchor="middle">
    <rect x="70"  y="276" width="22" height="26" fill="#dde6f5" stroke="#aabbdd"/><text x="81"  y="294" fill="#4a5a78">1</text>
    <rect x="94"  y="276" width="22" height="26" fill="#f4f7fc" stroke="#aabbdd"/><text x="105" y="294" fill="#4a5a78">0</text>
    <rect x="118" y="276" width="22" height="26" fill="#dde6f5" stroke="#aabbdd"/><text x="129" y="294" fill="#4a5a78">1</text>
    <rect x="142" y="276" width="22" height="26" fill="#f4f7fc" stroke="#aabbdd"/><text x="153" y="294" fill="#4a5a78">0</text>
    <rect x="166" y="276" width="22" height="26" fill="#dde6f5" stroke="#aabbdd"/><text x="177" y="294" fill="#4a5a78">1</text>
    <rect x="190" y="276" width="22" height="26" fill="#f4f7fc" stroke="#aabbdd"/><text x="201" y="294" fill="#4a5a78">0</text>
    <text x="228" y="294" font-size="14" fill="#999">···</text>
    <rect x="250" y="276" width="22" height="26" fill="#c9d7ee" stroke="#4066c0"/><text x="261" y="294" fill="#2a4a90">1</text>
    <rect x="274" y="276" width="22" height="26" fill="#eef3fb" stroke="#4066c0"/><text x="285" y="294" fill="#2a4a90">0</text>
    <rect x="298" y="276" width="22" height="26" fill="#c9d7ee" stroke="#4066c0"/><text x="309" y="294" fill="#2a4a90">1</text>
    <rect x="322" y="276" width="22" height="26" fill="#eef3fb" stroke="#4066c0"/><text x="333" y="294" fill="#2a4a90">0</text>
    <rect x="346" y="276" width="22" height="26" fill="#c9d7ee" stroke="#4066c0"/><text x="357" y="294" fill="#2a4a90">1</text>
    <rect x="370" y="276" width="22" height="26" fill="#eef3fb" stroke="#4066c0"/><text x="381" y="294" fill="#2a4a90">0</text>
    <rect x="394" y="276" width="22" height="26" fill="#c9d7ee" stroke="#4066c0"/><text x="405" y="294" fill="#2a4a90">1</text>
    <rect x="418" y="276" width="22" height="26" fill="#c0392b"/><text x="429" y="294" fill="#fff" font-weight="700">0</text>
    <rect x="442" y="276" width="22" height="26" fill="#c0392b"/><text x="453" y="294" fill="#fff" font-weight="700">0</text>
    <rect x="466" y="276" width="22" height="26" fill="#d8ecd9" stroke="#2e7d32"/><text x="477" y="294" fill="#2e7d32">1</text>
    <rect x="490" y="276" width="22" height="26" fill="#f0f8f0" stroke="#2e7d32"/><text x="501" y="294" fill="#2e7d32">0</text>
    <rect x="514" y="276" width="22" height="26" fill="#d8ecd9" stroke="#2e7d32"/><text x="525" y="294" fill="#2e7d32">1</text>
    <rect x="538" y="276" width="22" height="26" fill="#f0f8f0" stroke="#2e7d32"/><text x="549" y="294" fill="#2e7d32">0</text>
    <rect x="562" y="276" width="22" height="26" fill="#d8ecd9" stroke="#2e7d32"/><text x="573" y="294" fill="#2e7d32">1</text>
    <rect x="586" y="276" width="22" height="26" fill="#f0f8f0" stroke="#2e7d32"/><text x="597" y="294" fill="#2e7d32">0</text>
    <rect x="610" y="276" width="22" height="26" fill="#d8ecd9" stroke="#2e7d32"/><text x="621" y="294" fill="#2e7d32">1</text>
    <rect x="634" y="276" width="22" height="26" fill="#eee" stroke="#bbb"/><text x="645" y="294" fill="#888">?</text>
    <rect x="658" y="276" width="22" height="26" fill="#eee" stroke="#bbb"/><text x="669" y="294" fill="#888">?</text>
  </g>

  <line x1="440" y1="312" x2="440" y2="330" stroke="#c0392b" stroke-width="2"/>
  <text x="424" y="346" text-anchor="middle" font-size="12" font-weight="700" fill="#c0392b">the only 00</text>
  <text x="548" y="326" text-anchor="middle" font-size="11" fill="#2e7d32">verify these 7</text>
  <line x1="645" y1="312" x2="645" y2="340" stroke="#333" stroke-width="2" marker-end="url(#ah)"/>
  <text x="712" y="352" text-anchor="middle" font-size="12" font-weight="700" fill="#333">header starts here</text>

  <line x1="50" y1="366" x2="850" y2="366" stroke="#e5e5e5"/>

  <text x="70" y="394" font-size="14" font-weight="700" fill="#2e7d32">C.  Three states</text>

  <rect x="90" y="410" width="130" height="52" rx="8" fill="#f4f7fc" stroke="#4066c0" stroke-width="2"/>
  <text x="155" y="432" text-anchor="middle" font-size="13" font-weight="700" fill="#4066c0">HUNT</text>
  <text x="155" y="450" text-anchor="middle" font-size="10" fill="#666">look for 00</text>

  <line x1="220" y1="436" x2="285" y2="436" stroke="#333" stroke-width="2" marker-end="url(#ah)"/>
  <text x="252" y="428" text-anchor="middle" font-size="10" fill="#555">found</text>

  <rect x="295" y="410" width="130" height="52" rx="8" fill="#f0f8f0" stroke="#2e7d32" stroke-width="2"/>
  <text x="360" y="432" text-anchor="middle" font-size="13" font-weight="700" fill="#2e7d32">MARKER</text>
  <text x="360" y="450" text-anchor="middle" font-size="10" fill="#666">check 1010101</text>

  <line x1="425" y1="436" x2="490" y2="436" stroke="#333" stroke-width="2" marker-end="url(#ah)"/>
  <text x="457" y="428" text-anchor="middle" font-size="10" fill="#555">ok</text>

  <rect x="500" y="410" width="130" height="52" rx="8" fill="#f5f0e3" stroke="#8a6d1f" stroke-width="2"/>
  <text x="565" y="432" text-anchor="middle" font-size="13" font-weight="700" fill="#8a6d1f">BODY</text>
  <text x="565" y="450" text-anchor="middle" font-size="10" fill="#666">576 chips, pair by pair</text>

  <line x1="630" y1="436" x2="695" y2="436" stroke="#333" stroke-width="2" marker-end="url(#ah)"/>
  <rect x="705" y="410" width="130" height="52" rx="8" fill="#fbeae8" stroke="#c0392b" stroke-width="2"/>
  <text x="770" y="432" text-anchor="middle" font-size="13" font-weight="700" fill="#c0392b">CRC check</text>
  <text x="770" y="450" text-anchor="middle" font-size="10" fill="#666">GOOD or BAD_CRC</text>

  <path d="M360,462 L360,486 L155,486 L155,464" fill="none" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#ah)"/>
  <text x="258" y="500" text-anchor="middle" font-size="10" fill="#c0392b">tail wrong = false sync. Resume hunting, but keep the history.</text>

  <line x1="50" y1="516" x2="850" y2="516" stroke="#e5e5e5"/>

  <text x="70" y="544" font-size="14" font-weight="700" fill="#8a6d1f">D.  The slicer runs only in HUNT</text>
  <text x="90" y="568" font-size="12" fill="#555">HUNT needs a yes/no per chip, so it tracks a fast <tspan font-weight="700" fill="#2e7d32">hi</tspan> and a fast <tspan font-weight="700" fill="#c0392b">lo</tspan>, and slices at the midpoint.</text>
  <text x="90" y="588" font-size="12" fill="#555">Once locked, that threshold is <tspan font-weight="700">never used again</tspan> — BODY is pure Manchester pair comparison.</text>

  <line x1="50" y1="602" x2="850" y2="602" stroke="#d0d0d0"/>
  <text x="450" y="614" text-anchor="middle" font-size="11" fill="#888">Handoff — M1 walkthrough — 7/13</text>
</svg>
