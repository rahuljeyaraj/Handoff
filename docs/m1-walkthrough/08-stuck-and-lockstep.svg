<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" width="900" height="640" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="640" fill="#faf9f7"/>
  <text x="450" y="38" text-anchor="middle" font-size="23" font-weight="600" fill="#1a1a1a">Corner cases 3 and 4 — the two safety nets</text>
  <line x1="90" y1="54" x2="810" y2="54" stroke="#d8d4cd" stroke-width="2"/>

  <!-- ===== case 3 ===== -->
  <text x="110" y="88" font-size="15" font-weight="600" fill="#7a7a7a">3 — A CARRIER THAT NEVER GOES AWAY</text>

  <text x="102" y="126" text-anchor="end" font-size="13" font-weight="600" fill="#8f5a2f">B</text>
  <rect x="110" y="108" width="660" height="32" fill="#efece7" stroke="#b8b3aa" stroke-width="1.2"/>
  <rect x="110" y="108" width="60" height="32" fill="#cfe3d3" stroke="#3f7f4f" stroke-width="1"/>
  <text x="140" y="129" text-anchor="middle" font-size="11" fill="#1f4a2f">sniff</text>
  <rect x="170" y="108" width="440" height="32" fill="#cfe3d3" stroke="#3f7f4f" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="390" y="129" text-anchor="middle" font-size="12" fill="#1f4a2f">waiting for the channel to go quiet… it never does</text>
  <rect x="610" y="108" width="160" height="32" fill="#f0e2c8" stroke="#c79a3a" stroke-width="1.4"/>
  <text x="690" y="129" text-anchor="middle" font-size="12" fill="#8a6a1a">gives up waiting, elects anyway</text>

  <path d="M 170 148 L 170 160 L 610 160 L 610 148" fill="none" stroke="#c79a3a" stroke-width="1.6"/>
  <text x="390" y="178" text-anchor="middle" font-size="13" font-weight="600" fill="#c79a3a">hard cap: 18 ms</text>
  <text x="390" y="196" text-anchor="middle" font-size="12" fill="#8a8a8a">longer than any legal shout (10 ms), so a real shout is never cut short</text>

  <rect x="110" y="212" width="660" height="44" rx="10" fill="#ffffff" stroke="#d8d4cd" stroke-width="1.5"/>
  <text x="440" y="240" text-anchor="middle" font-size="13" fill="#3a3a3a">A stuck transmitter or a shifted noise floor must never take a band off the air permanently.</text>

  <line x1="90" y1="284" x2="810" y2="284" stroke="#e2ded7" stroke-width="1.5"/>

  <!-- ===== case 4 ===== -->
  <text x="110" y="316" font-size="15" font-weight="600" fill="#7a7a7a">4 — BOTH ENDS TALKING, NEITHER HEARING (LOCKSTEP)</text>

  <text x="102" y="356" text-anchor="end" font-size="13" font-weight="600" fill="#2f6f8f">A</text>
  <rect x="110" y="338" width="660" height="32" fill="#efece7" stroke="#b8b3aa" stroke-width="1.2"/>
  <rect x="110" y="338" width="150" height="32" fill="#2f6f8f"/>
  <text x="185" y="359" text-anchor="middle" font-size="11" fill="#ffffff">talks</text>
  <rect x="260" y="338" width="150" height="32" fill="#a9cdb4" stroke="#3f7f4f" stroke-width="1"/>
  <text x="335" y="359" text-anchor="middle" font-size="11" fill="#1f4a2f">listens — nothing</text>
  <rect x="410" y="338" width="150" height="32" fill="#2f6f8f"/>
  <text x="485" y="359" text-anchor="middle" font-size="11" fill="#ffffff">talks</text>
  <rect x="560" y="338" width="150" height="32" fill="#a9cdb4" stroke="#3f7f4f" stroke-width="1"/>
  <text x="635" y="359" text-anchor="middle" font-size="11" fill="#1f4a2f">listens — nothing</text>

  <text x="102" y="416" text-anchor="end" font-size="13" font-weight="600" fill="#8f5a2f">B</text>
  <rect x="110" y="398" width="660" height="32" fill="#efece7" stroke="#b8b3aa" stroke-width="1.2"/>
  <rect x="110" y="398" width="150" height="32" fill="#2f6f8f"/>
  <text x="185" y="419" text-anchor="middle" font-size="11" fill="#ffffff">talks</text>
  <rect x="260" y="398" width="150" height="32" fill="#a9cdb4" stroke="#3f7f4f" stroke-width="1"/>
  <text x="335" y="419" text-anchor="middle" font-size="11" fill="#1f4a2f">listens — nothing</text>
  <rect x="410" y="398" width="150" height="32" fill="#2f6f8f"/>
  <text x="485" y="419" text-anchor="middle" font-size="11" fill="#ffffff">talks</text>
  <rect x="560" y="398" width="150" height="32" fill="#a9cdb4" stroke="#3f7f4f" stroke-width="1"/>
  <text x="635" y="419" text-anchor="middle" font-size="11" fill="#1f4a2f">listens — nothing</text>

  <text x="440" y="454" text-anchor="middle" font-size="13" font-weight="600" fill="#c0392b">perfectly in step, so each one is always deaf exactly when the other talks</text>

  <!-- detection + fix -->
  <rect x="110" y="474" width="320" height="106" rx="12" fill="#ffffff" stroke="#c0392b" stroke-width="1.8"/>
  <text x="270" y="502" text-anchor="middle" font-size="14" font-weight="600" fill="#c0392b">how it is spotted</text>
  <text x="270" y="528" text-anchor="middle" font-size="13" fill="#3a3a3a">2 turns in a row where</text>
  <text x="270" y="548" text-anchor="middle" font-size="13" fill="#3a3a3a">we received nothing at all</text>
  <text x="270" y="570" text-anchor="middle" font-size="12" fill="#8a8a8a">= something is wrong</text>

  <rect x="470" y="474" width="320" height="106" rx="12" fill="#ffffff" stroke="#3f7f4f" stroke-width="1.8"/>
  <text x="630" y="502" text-anchor="middle" font-size="14" font-weight="600" fill="#3f7f4f">how it is broken</text>
  <text x="630" y="528" text-anchor="middle" font-size="13" fill="#3a3a3a">stop, roll new dice, listen again</text>
  <text x="630" y="550" text-anchor="middle" font-size="13" fill="#3a3a3a">up to 16 times</text>
  <text x="630" y="570" text-anchor="middle" font-size="12" fill="#8a8a8a">different draws = out of step</text>

  <text x="450" y="616" text-anchor="middle" font-size="13" fill="#8a8a8a">Handoff — contact trigger — corner cases 3 &amp; 4</text>
</svg>
