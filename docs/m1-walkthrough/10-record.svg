<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="560" fill="#ffffff"/>
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#333"/>
    </marker>
  </defs>

  <text x="450" y="36" text-anchor="middle" font-size="21" font-weight="700" fill="#1a1a1a">Record — cut it up, send it, put it back together</text>
  <line x1="50" y1="52" x2="850" y2="52" stroke="#d0d0d0" stroke-width="1"/>

  <!-- A: the round trip -->
  <text x="70" y="82" font-size="14" font-weight="700" fill="#4066c0">A.  The round trip</text>

  <rect x="70" y="98" width="130" height="56" rx="6" fill="#dde6f5" stroke="#4066c0"/>
  <text x="135" y="122" text-anchor="middle" font-size="12" font-weight="700" fill="#2a4a90">your phone</text>
  <text x="135" y="140" text-anchor="middle" font-size="10" fill="#5a76a8">sends your card once</text>

  <line x1="200" y1="126" x2="240" y2="126" stroke="#333" stroke-width="2" marker-end="url(#ah)"/>

  <rect x="248" y="98" width="130" height="56" rx="6" fill="#eaf3ea" stroke="#2e7d32"/>
  <text x="313" y="122" text-anchor="middle" font-size="12" font-weight="700" fill="#2e7d32">band stores it</text>
  <text x="313" y="140" text-anchor="middle" font-size="10" fill="#5a8a5c">packed, not as text</text>

  <line x1="378" y1="126" x2="418" y2="126" stroke="#333" stroke-width="2" marker-end="url(#ah)"/>

  <rect x="426" y="98" width="130" height="56" rx="6" fill="#f5f0e3" stroke="#8a6d1f"/>
  <text x="491" y="122" text-anchor="middle" font-size="12" font-weight="700" fill="#8a6d1f">cut into pieces</text>
  <text x="491" y="140" text-anchor="middle" font-size="10" fill="#a08a50">32 bytes each</text>

  <line x1="556" y1="126" x2="596" y2="126" stroke="#333" stroke-width="2" marker-end="url(#ah)"/>

  <rect x="604" y="98" width="130" height="56" rx="6" fill="#f5f0e3" stroke="#8a6d1f"/>
  <text x="669" y="122" text-anchor="middle" font-size="12" font-weight="700" fill="#8a6d1f">through the body</text>
  <text x="669" y="140" text-anchor="middle" font-size="10" fill="#a08a50">any order</text>

  <line x1="734" y1="126" x2="774" y2="126" stroke="#333" stroke-width="2" marker-end="url(#ah)"/>
  <rect x="782" y="98" width="46" height="56" rx="6" fill="#dde6f5" stroke="#4066c0"/>
  <text x="805" y="132" text-anchor="middle" font-size="20">📇</text>

  <line x1="50" y1="176" x2="850" y2="176" stroke="#e5e5e5"/>

  <!-- B: cuts fall between fields -->
  <text x="70" y="204" font-size="14" font-weight="700" fill="#2e7d32">B.  Cuts fall between whole fields, never through one</text>

  <g>
    <rect x="90"  y="220" width="96"  height="34" fill="#2e7d32"/>
    <rect x="188" y="220" width="120" height="34" fill="#5c9e5f"/>
    <rect x="310" y="220" width="76"  height="34" fill="#8fc191"/>
    <rect x="388" y="220" width="140" height="34" fill="#a8cfa9"/>
    <rect x="530" y="220" width="110" height="34" fill="#cfe0cf"/>
    <rect x="642" y="220" width="150" height="34" fill="#e4ece4"/>
  </g>
  <g font-size="11" text-anchor="middle" font-weight="700">
    <text x="138" y="242" fill="#fff">name</text>
    <text x="248" y="242" fill="#fff">mobile</text>
    <text x="348" y="242" fill="#31502f">email</text>
    <text x="458" y="242" fill="#31502f">org</text>
    <text x="585" y="242" fill="#4a5a4a">title</text>
    <text x="717" y="242" fill="#6a7a6a">address</text>
  </g>

  <line x1="386" y1="212" x2="386" y2="272" stroke="#c0392b" stroke-width="2" stroke-dasharray="4,3"/>
  <line x1="640" y1="212" x2="640" y2="272" stroke="#c0392b" stroke-width="2" stroke-dasharray="4,3"/>

  <text x="238" y="290" text-anchor="middle" font-size="11" font-weight="700" fill="#c0392b">piece 0</text>
  <text x="513" y="290" text-anchor="middle" font-size="11" font-weight="700" fill="#c0392b">piece 1</text>
  <text x="717" y="290" text-anchor="middle" font-size="11" font-weight="700" fill="#c0392b">piece 2</text>

  <text x="90" y="314" font-size="12" fill="#555">Any piece that arrives can be read on its own.</text>

  <line x1="50" y1="332" x2="850" y2="332" stroke="#e5e5e5"/>

  <!-- C: bitmap -->
  <text x="70" y="360" font-size="14" font-weight="700" fill="#8a6d1f">C.  A tick-box list, not a queue</text>

  <g>
    <rect x="90"  y="376" width="44" height="40" fill="#2e7d32"/>
    <rect x="138" y="376" width="44" height="40" fill="#eeeeee" stroke="#ccc" stroke-dasharray="3,3"/>
    <rect x="186" y="376" width="44" height="40" fill="#2e7d32"/>
    <rect x="234" y="376" width="44" height="40" fill="#2e7d32"/>
    <rect x="282" y="376" width="44" height="40" fill="#eeeeee" stroke="#ccc" stroke-dasharray="3,3"/>
    <rect x="330" y="376" width="44" height="40" fill="#2e7d32"/>
  </g>
  <g font-size="15" text-anchor="middle" font-weight="700">
    <text x="112" y="403" fill="#fff">✓</text>
    <text x="160" y="403" fill="#bbb">·</text>
    <text x="208" y="403" fill="#fff">✓</text>
    <text x="256" y="403" fill="#fff">✓</text>
    <text x="304" y="403" fill="#bbb">·</text>
    <text x="352" y="403" fill="#fff">✓</text>
  </g>
  <text x="90" y="436" font-size="11" fill="#666">arrived</text>
  <text x="138" y="436" font-size="11" fill="#c0392b">still missing</text>

  <text x="420" y="392" font-size="12" fill="#555">Gaps stay as padding, which the decoder skips.</text>
  <text x="420" y="412" font-size="12" font-weight="700" fill="#2e7d32">So a half-finished transfer still reads.</text>
  <text x="420" y="432" font-size="12" fill="#555">Repeats just tick a box that is already ticked.</text>

  <line x1="50" y1="456" x2="850" y2="456" stroke="#e5e5e5"/>

  <!-- D: rebuild -->
  <text x="70" y="484" font-size="14" font-weight="700" fill="#4066c0">D.  Rebuilt into a real card at the far end</text>
  <text x="90" y="508" font-size="12" fill="#555">Missing boilerplate is invented back. No name field? It is derived from what did arrive.</text>
  <text x="90" y="528" font-size="12" fill="#555">A second implementation in Python checks the C both ways, so a shared misreading cannot pass.</text>

  <line x1="50" y1="542" x2="850" y2="542" stroke="#d0d0d0"/>
  <text x="450" y="555" text-anchor="middle" font-size="11" fill="#888">Handoff — M1 walkthrough — 10/13</text>
</svg>
