<svg xmlns="http://www.w3.org/2000/svg" width="860" height="440" viewBox="0 0 860 440" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="860" height="440" fill="#ffffff"/>

  <!-- header -->
  <text x="430" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#1a1a1a">What the product does</text>
  <line x1="60" y1="58" x2="800" y2="58" stroke="#d0d0d0" stroke-width="1"/>

  <!-- person A -->
  <circle cx="180" cy="150" r="26" fill="none" stroke="#333" stroke-width="2"/>
  <line x1="180" y1="176" x2="180" y2="250" stroke="#333" stroke-width="2"/>
  <line x1="180" y1="250" x2="150" y2="320" stroke="#333" stroke-width="2"/>
  <line x1="180" y1="250" x2="210" y2="320" stroke="#333" stroke-width="2"/>
  <line x1="180" y1="200" x2="270" y2="230" stroke="#333" stroke-width="2"/>

  <!-- person B -->
  <circle cx="680" cy="150" r="26" fill="none" stroke="#333" stroke-width="2"/>
  <line x1="680" y1="176" x2="680" y2="250" stroke="#333" stroke-width="2"/>
  <line x1="680" y1="250" x2="650" y2="320" stroke="#333" stroke-width="2"/>
  <line x1="680" y1="250" x2="710" y2="320" stroke="#333" stroke-width="2"/>
  <line x1="680" y1="200" x2="590" y2="230" stroke="#333" stroke-width="2"/>

  <!-- clasped hands -->
  <circle cx="430" cy="240" r="10" fill="#333"/>
  <text x="430" y="285" text-anchor="middle" font-size="13" fill="#555">handshake = closed circuit</text>

  <!-- wristbands -->
  <rect x="250" y="214" width="40" height="24" rx="4" fill="#eef3ff" stroke="#4066c0" stroke-width="2"/>
  <rect x="570" y="214" width="40" height="24" rx="4" fill="#eef3ff" stroke="#4066c0" stroke-width="2"/>
  <text x="270" y="205" text-anchor="middle" font-size="12" fill="#4066c0">wristband</text>
  <text x="590" y="205" text-anchor="middle" font-size="12" fill="#4066c0">wristband</text>

  <!-- signal path through arms -->
  <path d="M285 226 H575" stroke="#c0392b" stroke-width="2.5" stroke-dasharray="7 5"/>
  <text x="430" y="218" text-anchor="middle" font-size="13" fill="#c0392b" font-weight="600">contact data travels through the two bodies (200 kHz)</text>

  <!-- phones -->
  <rect x="120" y="360" width="34" height="56" rx="5" fill="#f4f4f4" stroke="#555" stroke-width="2"/>
  <rect x="706" y="360" width="34" height="56" rx="5" fill="#f4f4f4" stroke="#555" stroke-width="2"/>
  <path d="M180 330 q -30 20 -40 30" stroke="#2e7d32" stroke-width="2" fill="none"/>
  <path d="M680 330 q 30 20 40 30" stroke="#2e7d32" stroke-width="2" fill="none"/>
  <text x="137" y="352" text-anchor="middle" font-size="11" fill="#2e7d32">BLE</text>
  <text x="723" y="352" text-anchor="middle" font-size="11" fill="#2e7d32">BLE</text>
  <text x="137" y="432" text-anchor="middle" font-size="11" fill="#555">own phone</text>
  <text x="723" y="432" text-anchor="middle" font-size="11" fill="#555">own phone</text>

  <!-- footer -->
  <line x1="60" y1="402" x2="800" y2="402" stroke="#d0d0d0" stroke-width="1"/>
  <text x="430" y="424" text-anchor="middle" font-size="12" fill="#888">Handoff — M1 walkthrough — 1/…</text>
</svg>
