<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="440" fill="#ffffff"/>
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#333"/>
    </marker>
  </defs>

  <text x="450" y="36" text-anchor="middle" font-size="21" font-weight="700" fill="#1a1a1a">CRC — the fingerprint that decides what to trust</text>
  <line x1="50" y1="52" x2="850" y2="52" stroke="#d0d0d0" stroke-width="1"/>

  <!-- sender -->
  <text x="200" y="86" text-anchor="middle" font-size="13" font-weight="700" fill="#4066c0">SENDER</text>

  <rect x="100" y="100" width="200" height="44" fill="#f5f0e3" stroke="#8a6d1f"/>
  <text x="200" y="127" text-anchor="middle" font-size="12" fill="#8a6d1f">34 bytes of frame</text>

  <line x1="200" y1="144" x2="200" y2="172" stroke="#333" stroke-width="2" marker-end="url(#ah)"/>
  <text x="212" y="163" font-size="11" fill="#666">scramble</text>

  <rect x="150" y="176" width="100" height="40" rx="6" fill="#dde6f5" stroke="#4066c0" stroke-width="2"/>
  <text x="200" y="202" text-anchor="middle" font-size="14" font-weight="700" fill="#2a4a90">2 bytes</text>
  <text x="200" y="236" text-anchor="middle" font-size="11" fill="#666">the fingerprint</text>

  <!-- channel -->
  <line x1="310" y1="160" x2="590" y2="160" stroke="#333" stroke-width="2" marker-end="url(#ah)"/>
  <text x="450" y="150" text-anchor="middle" font-size="12" fill="#555">both travel through the body</text>
  <text x="450" y="182" text-anchor="middle" font-size="11" fill="#c0392b">noise may flip bits on the way</text>

  <!-- receiver -->
  <text x="700" y="86" text-anchor="middle" font-size="13" font-weight="700" fill="#2e7d32">RECEIVER</text>

  <rect x="600" y="100" width="200" height="44" fill="#f5f0e3" stroke="#8a6d1f"/>
  <text x="700" y="127" text-anchor="middle" font-size="12" fill="#8a6d1f">34 bytes it heard</text>

  <line x1="700" y1="144" x2="700" y2="172" stroke="#333" stroke-width="2" marker-end="url(#ah)"/>
  <text x="712" y="163" font-size="11" fill="#666">scramble the same way</text>

  <rect x="650" y="176" width="100" height="40" rx="6" fill="#eaf3ea" stroke="#2e7d32" stroke-width="2"/>
  <text x="700" y="202" text-anchor="middle" font-size="14" font-weight="700" fill="#2e7d32">2 bytes</text>

  <!-- compare -->
  <text x="450" y="270" text-anchor="middle" font-size="15" font-weight="700" fill="#1a1a1a">compare the two fingerprints</text>

  <rect x="150" y="290" width="270" height="56" rx="8" fill="#eaf3ea" stroke="#2e7d32" stroke-width="2"/>
  <text x="285" y="314" text-anchor="middle" font-size="14" font-weight="700" fill="#2e7d32">same</text>
  <text x="285" y="334" text-anchor="middle" font-size="12" fill="#555">frame is good — pass it up</text>

  <rect x="480" y="290" width="270" height="56" rx="8" fill="#fbeae8" stroke="#c0392b" stroke-width="2"/>
  <text x="615" y="314" text-anchor="middle" font-size="14" font-weight="700" fill="#c0392b">different</text>
  <text x="615" y="334" text-anchor="middle" font-size="12" fill="#555">throw it away, ask again</text>

  <line x1="50" y1="368" x2="850" y2="368" stroke="#e5e5e5"/>

  <text x="450" y="394" text-anchor="middle" font-size="13" fill="#555">
    8-bit fingerprint: <tspan font-weight="700" fill="#c0392b">1 bad frame in 256</tspan> sneaks through
  </text>
  <text x="450" y="416" text-anchor="middle" font-size="13" fill="#555">
    16-bit fingerprint: <tspan font-weight="700" fill="#2e7d32">1 in 65,000</tspan> — for one extra byte
  </text>

  <line x1="50" y1="426" x2="850" y2="426" stroke="#d0d0d0"/>
  <text x="450" y="438" text-anchor="middle" font-size="11" fill="#888">Handoff — M1 walkthrough — 8/13</text>
</svg>
