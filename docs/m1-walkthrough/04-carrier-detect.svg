<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="480" fill="#ffffff"/>

  <text x="450" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#1a1a1a">Carrier detection — a moving threshold, not a fixed one</text>
  <line x1="50" y1="55" x2="850" y2="55" stroke="#d0d0d0" stroke-width="1"/>

  <!-- LEFT: fixed threshold fails -->
  <text x="70" y="90" font-size="14" font-weight="700" fill="#c0392b">Fixed threshold — fails</text>
  <rect x="70" y="100" width="340" height="150" fill="#fcf3f2" stroke="#e6c3bd"/>
  <!-- signal that drifts down -->
  <polyline points="75,150 110,145 145,235 150,150 185,238 190,150 225,150 260,150 295,150 330,205 335,175 370,205 375,180 405,200"
            fill="none" stroke="#333" stroke-width="2"/>
  <line x1="70" y1="170" x2="410" y2="170" stroke="#c0392b" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="240" y="120" text-anchor="middle" font-size="11" fill="#c0392b">threshold</text>
  <text x="240" y="243" text-anchor="middle" font-size="11" fill="#8a2b22">grip loosens -&gt; real carrier now sits BELOW the line</text>

  <!-- RIGHT: tracked floor works -->
  <text x="490" y="90" font-size="14" font-weight="700" fill="#2e7d32">Tracked floor — works</text>
  <rect x="490" y="100" width="340" height="150" fill="#f1f8f1" stroke="#bfe0bf"/>
  <polyline points="495,150 530,145 565,235 570,150 605,238 610,150 645,150 680,150 715,150 750,205 755,175 790,205 795,180 825,200"
            fill="none" stroke="#333" stroke-width="2"/>
  <!-- slow floor tracks under -->
  <polyline points="495,150 545,150 560,150 575,148 640,147 700,146 760,168 800,178 825,182"
            fill="none" stroke="#2e7d32" stroke-width="2"/>
  <text x="700" y="200" font-size="11" fill="#2e7d32">slow floor (ambient)</text>
  <text x="660" y="243" text-anchor="middle" font-size="11" fill="#2b6b2b">"present" = level &gt; 3x floor  AND  &gt;= 24 LSB above it</text>

  <line x1="50" y1="275" x2="850" y2="275" stroke="#e5e5e5" stroke-width="1"/>

  <!-- pitfall row -->
  <text x="70" y="305" font-size="14" font-weight="700" fill="#1a1a1a">Why the floor is a slow SYMMETRIC average, not a min-chaser</text>
  <!-- manchester half on half off -->
  <g>
    <rect x="90"  y="330" width="30" height="60" fill="#2e7d32"/>
    <rect x="120" y="378" width="30" height="12" fill="#ddd"/>
    <rect x="150" y="330" width="30" height="60" fill="#2e7d32"/>
    <rect x="180" y="378" width="30" height="12" fill="#ddd"/>
    <rect x="210" y="330" width="30" height="60" fill="#2e7d32"/>
    <rect x="240" y="378" width="30" height="12" fill="#ddd"/>
  </g>
  <text x="180" y="410" text-anchor="middle" font-size="11" fill="#555">every Manchester bit is half-on, half-off</text>
  <text x="300" y="350" font-size="12" fill="#c0392b">a min-chaser dives to ~0 on each quiet half...</text>
  <text x="300" y="370" font-size="12" fill="#c0392b">...then "3x floor" fires on the loud half = detects its own noise</text>
  <text x="300" y="392" font-size="12" fill="#2e7d32">slow symmetric floor barely moves across the 32-chip preamble</text>
  <text x="300" y="412" font-size="12" fill="#555">hold = 8 chips of hysteresis so the flag does not chatter</text>

  <line x1="50" y1="440" x2="850" y2="440" stroke="#d0d0d0" stroke-width="1"/>
  <text x="450" y="462" text-anchor="middle" font-size="12" fill="#888">Handoff — M1 walkthrough — 4/…   |   firmware/lib/dsp/carrier.c   |   coarse gate only; bit decisions are differential (Section 6)</text>
</svg>
