<svg xmlns="http://www.w3.org/2000/svg" width="900" height="580" viewBox="0 0 900 580" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="580" fill="#ffffff"/>
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#333"/>
    </marker>
  </defs>

  <text x="450" y="36" text-anchor="middle" font-size="21" font-weight="700" fill="#1a1a1a">The beacon is not "I am about to send" — it is just "I am here"</text>
  <line x1="50" y1="52" x2="850" y2="52" stroke="#d0d0d0" stroke-width="1"/>

  <text x="70" y="82" font-size="14" font-weight="700" fill="#c0392b">The step that flips:  whoever HEARS the beacon is the one who talks first.</text>
  <text x="70" y="104" font-size="13" fill="#555">The beaconer stops, listens, and ends up receiving. Nobody waits for anybody.</text>

  <line x1="50" y1="122" x2="850" y2="122" stroke="#e5e5e5"/>

  <!-- timeline axis -->
  <text x="70" y="152" font-size="12" font-weight="700" fill="#888">milliseconds</text>
  <g font-size="10" fill="#aaa" text-anchor="middle">
    <text x="200" y="152">0</text>
    <text x="290" y="152">2</text>
    <text x="380" y="152">4</text>
    <text x="470" y="152">6</text>
    <text x="560" y="152">8</text>
    <text x="650" y="152">10</text>
    <text x="740" y="152">12</text>
  </g>
  <line x1="200" y1="160" x2="790" y2="160" stroke="#e5e5e5"/>

  <!-- BEACONER -->
  <text x="70" y="196" font-size="13" font-weight="700" fill="#8a6d1f">beaconer</text>
  <text x="70" y="212" font-size="10" fill="#aaa">(band A)</text>

  <rect x="200" y="176" width="450" height="30" fill="#8a6d1f"/>
  <text x="425" y="196" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">BEACON — plain carrier, deaf while it plays</text>
  <rect x="650" y="176" width="45" height="30" fill="#eee" stroke="#ccc"/>
  <text x="672" y="196" text-anchor="middle" font-size="9" fill="#999">settle</text>
  <rect x="695" y="176" width="95" height="30" fill="#dde6f5" stroke="#4066c0"/>
  <text x="742" y="196" text-anchor="middle" font-size="11" fill="#2a4a90">listen</text>

  <!-- HEARER -->
  <text x="70" y="266" font-size="13" font-weight="700" fill="#4066c0">hearer</text>
  <text x="70" y="282" font-size="10" fill="#aaa">(band B)</text>

  <rect x="200" y="246" width="22" height="30" fill="#eee" stroke="#ccc" stroke-dasharray="3,2"/>
  <rect x="222" y="246" width="23" height="30" fill="#4066c0"/>
  <text x="234" y="266" text-anchor="middle" font-size="9" fill="#fff">sniff</text>
  <rect x="245" y="246" width="200" height="30" fill="#f0f4fa" stroke="#4066c0" stroke-dasharray="3,2"/>
  <text x="345" y="266" text-anchor="middle" font-size="11" fill="#2a4a90">backoff (dice roll)</text>
  <rect x="445" y="246" width="90" height="30" fill="#dde6f5" stroke="#4066c0"/>
  <text x="490" y="266" text-anchor="middle" font-size="11" fill="#2a4a90">listen</text>
  <rect x="535" y="246" width="255" height="30" fill="#2e7d32"/>
  <text x="662" y="266" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">SENDS REAL DATA</text>

  <!-- arrows -->
  <line x1="228" y1="210" x2="228" y2="242" stroke="#c0392b" stroke-width="2" marker-end="url(#ah)"/>
  <text x="228" y="228" font-size="9" fill="#c0392b" text-anchor="middle"> </text>
  <text x="238" y="232" font-size="10" fill="#c0392b">heard it</text>

  <line x1="600" y1="242" x2="600" y2="212" stroke="#2e7d32" stroke-width="2" marker-end="url(#ah)"/>
  <text x="612" y="232" font-size="10" fill="#2e7d32">its data arrives</text>

  <text x="490" y="300" font-size="11" fill="#c0392b">hears silence — the beaconer has stopped —</text>
  <text x="490" y="314" font-size="11" font-weight="700" fill="#c0392b">so it declares itself the sender</text>

  <line x1="50" y1="330" x2="850" y2="330" stroke="#e5e5e5"/>

  <text x="70" y="358" font-size="14" font-weight="700" fill="#2e7d32">Roles that come out of it</text>

  <rect x="90" y="374" width="330" height="66" rx="8" fill="#f5f0e3" stroke="#8a6d1f"/>
  <text x="255" y="398" text-anchor="middle" font-size="13" font-weight="700" fill="#8a6d1f">the one who beaconed</text>
  <text x="255" y="422" text-anchor="middle" font-size="14" font-weight="700" fill="#333">becomes the RECEIVER</text>

  <rect x="480" y="374" width="330" height="66" rx="8" fill="#eaf3ea" stroke="#2e7d32"/>
  <text x="645" y="398" text-anchor="middle" font-size="13" font-weight="700" fill="#2e7d32">the one who heard it</text>
  <text x="645" y="422" text-anchor="middle" font-size="14" font-weight="700" fill="#333">becomes the SENDER</text>

  <text x="90" y="470" font-size="12" fill="#555">The hearer wakes first, so it gets a head start. By the time it finishes its dice roll the</text>
  <text x="90" y="488" font-size="12" fill="#555">beacon has ended, so the channel is quiet — and a quiet channel means "go ahead and talk".</text>

  <text x="90" y="518" font-size="12" fill="#555">The beaconer&#8217;s 20 ms listening window exists for exactly this: to catch that reply.</text>
  <text x="90" y="536" font-size="12" font-weight="700" fill="#1a1a1a">Measured end to end: data flowing 12 ms after the beacon began.</text>

  <line x1="50" y1="556" x2="850" y2="556" stroke="#d0d0d0"/>
  <text x="450" y="572" text-anchor="middle" font-size="11" fill="#888">Handoff — M1 walkthrough — 11e/13</text>
</svg>
