<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="560" fill="#ffffff"/>
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#555"/>
    </marker>
  </defs>

  <text x="450" y="36" text-anchor="middle" font-size="21" font-weight="700" fill="#1a1a1a">The idea: the wake-up already names your role</text>
  <line x1="50" y1="52" x2="850" y2="52" stroke="#d0d0d0" stroke-width="1"/>

  <!-- start -->
  <rect x="340" y="76" width="220" height="46" rx="8" fill="#eeeeee" stroke="#999"/>
  <text x="450" y="105" text-anchor="middle" font-size="14" font-weight="700" fill="#333">idle: shout, then listen</text>

  <line x1="450" y1="122" x2="450" y2="148" stroke="#555" stroke-width="2" marker-end="url(#ar)"/>
  <text x="462" y="142" font-size="12" fill="#666">something arrives</text>

  <!-- the single question -->
  <rect x="270" y="152" width="360" height="52" rx="8" fill="#fff8e6" stroke="#8a6d1f" stroke-width="2"/>
  <text x="450" y="184" text-anchor="middle" font-size="15" font-weight="700" fill="#8a6d1f">one question: when did I hear it?</text>

  <!-- two branches -->
  <line x1="380" y1="204" x2="250" y2="244" stroke="#555" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="520" y1="204" x2="650" y2="244" stroke="#555" stroke-width="2" marker-end="url(#ar)"/>

  <!-- left branch -->
  <rect x="70" y="250" width="330" height="54" rx="8" fill="#f4f7fc" stroke="#4066c0"/>
  <text x="235" y="272" text-anchor="middle" font-size="13" font-weight="700" fill="#4066c0">while sniffing</text>
  <text x="235" y="292" text-anchor="middle" font-size="12" fill="#555">= someone else&#8217;s shout</text>

  <line x1="235" y1="304" x2="235" y2="330" stroke="#555" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="70" y="334" width="330" height="40" rx="6" fill="#dde6f5"/>
  <text x="235" y="359" text-anchor="middle" font-size="12" fill="#2a4a90">let them finish shouting</text>

  <line x1="235" y1="374" x2="235" y2="400" stroke="#555" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="70" y="404" width="330" height="52" rx="8" fill="#2e7d32"/>
  <text x="235" y="436" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">I AM THE SENDER</text>

  <!-- right branch -->
  <rect x="500" y="250" width="330" height="54" rx="8" fill="#f0f8f0" stroke="#2e7d32"/>
  <text x="665" y="272" text-anchor="middle" font-size="13" font-weight="700" fill="#2e7d32">right after my own shout</text>
  <text x="665" y="292" text-anchor="middle" font-size="12" fill="#555">= someone answering me</text>

  <line x1="665" y1="304" x2="665" y2="330" stroke="#555" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="500" y="334" width="330" height="40" rx="6" fill="#d8ecd9"/>
  <text x="665" y="359" text-anchor="middle" font-size="12" fill="#2e7d32">do not wait — it is already playing</text>

  <line x1="665" y1="374" x2="665" y2="400" stroke="#555" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="500" y="404" width="330" height="52" rx="8" fill="#4066c0"/>
  <text x="665" y="436" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">I AM THE RECEIVER</text>

  <!-- fallback -->
  <line x1="830" y1="430" x2="866" y2="430" stroke="#c0392b" stroke-width="0"/>
  <rect x="500" y="470" width="330" height="44" rx="6" fill="#fbeae8" stroke="#c0392b" stroke-dasharray="4,3"/>
  <text x="665" y="488" text-anchor="middle" font-size="11" font-weight="700" fill="#c0392b">only if both ends think this</text>
  <text x="665" y="504" text-anchor="middle" font-size="11" fill="#8a5a52">fall back to the dice roll</text>
  <line x1="665" y1="456" x2="665" y2="466" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="3,2" marker-end="url(#ar)"/>

  <text x="70" y="488" font-size="12" fill="#555">No dice here. Two bands cannot both</text>
  <text x="70" y="506" font-size="12" fill="#555">hear each other — shouting makes you deaf.</text>

  <line x1="50" y1="528" x2="850" y2="528" stroke="#d0d0d0"/>
  <text x="450" y="548" text-anchor="middle" font-size="11" fill="#888">Handoff — M1 walkthrough — 11g/13</text>
</svg>
