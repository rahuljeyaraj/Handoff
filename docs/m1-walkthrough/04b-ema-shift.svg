<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="430" fill="#ffffff"/>

  <text x="450" y="36" text-anchor="middle" font-size="21" font-weight="700" fill="#1a1a1a">Why shift 2 = 4 chips and shift 7 = 128 chips</text>
  <line x1="50" y1="52" x2="850" y2="52" stroke="#d0d0d0" stroke-width="1"/>

  <!-- formula -->
  <text x="70" y="86" font-size="14" fill="#1a1a1a">Each step:  <tspan font-family="Consolas,monospace" fill="#4066c0">new = old + (input - old) &gt;&gt; shift</tspan></text>
  <text x="70" y="110" font-size="13" fill="#555">"&gt;&gt; shift" divides by <tspan font-weight="700">2^shift</tspan>, not by shift. So the step size is 1 / 2^shift,</text>
  <text x="70" y="130" font-size="13" fill="#555">and the filter "remembers" about 2^shift chips back.</text>

  <text x="120" y="165" font-size="13" font-family="Consolas,monospace" fill="#2e7d32">shift = 2  ->  step = 1/4    ->  memory ~ 2^2 = 4 chips   (fast)</text>
  <text x="120" y="188" font-size="13" font-family="Consolas,monospace" fill="#c0392b">shift = 7  ->  step = 1/128  ->  memory ~ 2^7 = 128 chips (slow)</text>

  <line x1="50" y1="208" x2="850" y2="208" stroke="#e5e5e5" stroke-width="1"/>

  <!-- plot -->
  <text x="70" y="235" font-size="13" fill="#555">Input jumps up. How fast each average catches up:</text>

  <!-- axes -->
  <line x1="90" y1="250" x2="90" y2="380" stroke="#999" stroke-width="1"/>
  <line x1="90" y1="380" x2="830" y2="380" stroke="#999" stroke-width="1"/>
  <text x="60" y="258" font-size="10" fill="#999">high</text>
  <text x="60" y="382" font-size="10" fill="#999">low</text>

  <!-- input step -->
  <polyline points="90,370 210,370 210,270 830,270" fill="none" stroke="#333" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="700" y="264" font-size="11" fill="#333">input</text>

  <!-- fast EMA: catches up in ~4 chips (short horizontal span) -->
  <path d="M90 370 L210 370 C 225 330, 245 285, 275 275 L830 271" fill="none" stroke="#2e7d32" stroke-width="2.5"/>
  <text x="300" y="292" font-size="11" fill="#2e7d32">fast (shift 2): ~4 chips to catch up</text>

  <!-- slow EMA: long slow rise -->
  <path d="M90 370 L210 370 C 360 366, 620 300, 830 276" fill="none" stroke="#c0392b" stroke-width="2.5"/>
  <text x="560" y="330" font-size="11" fill="#c0392b">slow (shift 7): ~128 chips to catch up</text>

  <!-- chip ticks -->
  <g stroke="#ccc" stroke-width="1">
    <line x1="210" y1="380" x2="210" y2="384"/>
    <line x1="240" y1="380" x2="240" y2="384"/>
    <line x1="270" y1="380" x2="270" y2="384"/>
    <line x1="300" y1="380" x2="300" y2="384"/>
  </g>
  <text x="255" y="398" font-size="10" fill="#999">chips -&gt;</text>

  <line x1="50" y1="405" x2="850" y2="405" stroke="#d0d0d0" stroke-width="1"/>
  <text x="450" y="424" text-anchor="middle" font-size="12" fill="#888">Handoff — M1 walkthrough — 4b   |   exponential moving average, one update per chip</text>
</svg>
