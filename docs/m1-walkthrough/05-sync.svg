<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="500" fill="#ffffff"/>

  <text x="450" y="36" text-anchor="middle" font-size="21" font-weight="700" fill="#1a1a1a">Sync — which 5 scores make this chip, and where does it start</text>
  <line x1="50" y1="52" x2="850" y2="52" stroke="#d0d0d0" stroke-width="1"/>

  <!-- Panel A -->
  <text x="70" y="82" font-size="14" font-weight="700" fill="#4066c0">A.  5 scores -&gt; 1 chip energy  (drop the edges, average the middle 3)</text>

  <g>
    <rect x="90"  y="95"  width="34" height="70" fill="#cfd8ea"/>
    <rect x="130" y="100" width="34" height="65" fill="#2e7d32"/>
    <rect x="170" y="98"  width="34" height="67" fill="#2e7d32"/>
    <rect x="210" y="102" width="34" height="63" fill="#2e7d32"/>
    <rect x="250" y="120" width="34" height="45" fill="#cfd8ea"/>
  </g>
  <line x1="90" y1="165" x2="284" y2="165" stroke="#333"/>
  <text x="107" y="182" text-anchor="middle" font-size="10" fill="#8899bb">guard</text>
  <text x="187" y="182" text-anchor="middle" font-size="10" fill="#2e7d32">summed</text>
  <text x="267" y="182" text-anchor="middle" font-size="10" fill="#8899bb">guard</text>
  <text x="187" y="200" text-anchor="middle" font-size="11" fill="#555">a boundary window is a blend of two chips -&gt; carries noise, no info</text>

  <line x1="310" y1="130" x2="360" y2="130" stroke="#333" stroke-width="2" marker-end="url(#ah)"/>
  <rect x="370" y="100" width="70" height="60" rx="6" fill="#eaf3ea" stroke="#2e7d32" stroke-width="2"/>
  <text x="405" y="135" text-anchor="middle" font-size="13" font-weight="700" fill="#2e7d32">chip</text>
  <text x="405" y="152" text-anchor="middle" font-size="10" fill="#555">energy</text>

  <text x="470" y="120" font-size="12" fill="#555">4000 of these per second,</text>
  <text x="470" y="138" font-size="12" fill="#555">core 1 -&gt; core 0.</text>

  <line x1="50" y1="220" x2="850" y2="220" stroke="#e5e5e5" stroke-width="1"/>

  <!-- Panel B -->
  <text x="70" y="248" font-size="14" font-weight="700" fill="#c0392b">B.  The boundary walks (two crystals drift). Track it: biggest jump = the edge.</text>

  <!-- score staircase -->
  <text x="70" y="275" font-size="11" fill="#555">scores across 2 chips:</text>
  <polyline points="90,360 130,360 170,360 210,362 250,360
                    250,300 290,300 330,302 370,300 410,300"
           fill="none" stroke="#333" stroke-width="2"/>
  <line x1="250" y1="300" x2="250" y2="360" stroke="#c0392b" stroke-width="3"/>
  <text x="258" y="335" font-size="11" fill="#c0392b">big jump here</text>

  <!-- histogram -->
  <text x="480" y="275" font-size="11" fill="#555">edge histogram (leaky), one bar per phase slot:</text>
  <g>
    <rect x="500" y="330" width="26" height="20" fill="#bbb"/>
    <rect x="534" y="326" width="26" height="24" fill="#bbb"/>
    <rect x="568" y="290" width="26" height="60" fill="#c0392b"/>
    <rect x="602" y="332" width="26" height="18" fill="#bbb"/>
    <rect x="636" y="334" width="26" height="16" fill="#bbb"/>
  </g>
  <line x1="500" y1="350" x2="662" y2="350" stroke="#333"/>
  <text x="581" y="368" text-anchor="middle" font-size="10" fill="#c0392b">slot 2 = boundary</text>

  <!-- nudge -->
  <text x="70" y="410" font-size="12" fill="#1a1a1a">Correction: if the edge is early, next chip is <tspan font-family="Consolas,monospace">wpc - 1</tspan> windows; if late, <tspan font-family="Consolas,monospace">wpc + 1</tspan>.</text>
  <text x="70" y="430" font-size="12" fill="#555">At most +-1 window per chip — follow slow crystal drift, never chase noise. Then rotate the histogram with it.</text>
  <text x="70" y="450" font-size="12" fill="#2e7d32"><tspan font-family="Consolas,monospace">sync_phase_error()</tspan> returns 0 when locked. Tests assert on that.</text>

  <line x1="50" y1="470" x2="850" y2="470" stroke="#d0d0d0" stroke-width="1"/>
  <text x="450" y="490" text-anchor="middle" font-size="12" fill="#888">Handoff — M1 walkthrough — 5/…   |   firmware/lib/dsp/sync.c   |   end of the DSP layer</text>

  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#333"/></marker>
  </defs>
</svg>
