<svg xmlns="http://www.w3.org/2000/svg" width="900" height="545" viewBox="0 0 900 545" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="545" fill="#ffffff"/>

  <text x="450" y="36" text-anchor="middle" font-size="21" font-weight="700" fill="#1a1a1a">Listen vs sniff — and the trade hiding behind it</text>
  <line x1="50" y1="52" x2="850" y2="52" stroke="#d0d0d0" stroke-width="1"/>

  <text x="70" y="82" font-size="14" font-weight="700" fill="#4066c0">A.  What we do now — chop the gap into sniffs</text>

  <rect x="140" y="96" width="90" height="28" fill="#c0392b"/>
  <text x="185" y="115" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">BEACON 10ms</text>
  <rect x="230" y="96" width="130" height="28" fill="#4066c0"/>
  <text x="295" y="115" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">listen 20ms</text>
  <g>
    <rect x="368" y="96" width="14" height="28" fill="#9db8e0"/>
    <rect x="410" y="96" width="14" height="28" fill="#9db8e0"/>
    <rect x="452" y="96" width="14" height="28" fill="#9db8e0"/>
    <rect x="494" y="96" width="14" height="28" fill="#9db8e0"/>
    <rect x="536" y="96" width="14" height="28" fill="#9db8e0"/>
    <rect x="578" y="96" width="14" height="28" fill="#9db8e0"/>
    <rect x="620" y="96" width="14" height="28" fill="#9db8e0"/>
    <rect x="662" y="96" width="14" height="28" fill="#9db8e0"/>
    <rect x="704" y="96" width="14" height="28" fill="#9db8e0"/>
  </g>
  <rect x="746" y="96" width="90" height="28" fill="#c0392b"/>
  <text x="791" y="115" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">BEACON</text>

  <text x="545" y="142" text-anchor="middle" font-size="11" fill="#5a76a8">sniff 2ms · deaf 8ms · repeat</text>

  <text x="140" y="172" font-size="12" fill="#555">Deaf gaps exist, so the beacon must outlast one:</text>
  <text x="140" y="192" font-size="13" font-weight="700" fill="#c0392b">beacon must be &#8805; 10 ms</text>

  <line x1="50" y1="212" x2="850" y2="212" stroke="#e5e5e5"/>

  <text x="70" y="240" font-size="14" font-weight="700" fill="#2e7d32">B.  The alternative — never stop listening</text>

  <rect x="140" y="254" width="28" height="28" fill="#c0392b"/>
  <text x="154" y="273" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">2ms</text>
  <rect x="168" y="254" width="668" height="28" fill="#4066c0"/>
  <text x="502" y="273" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">listening, continuously</text>

  <text x="140" y="302" font-size="12" fill="#555">No deaf gaps at all, so a beacon only has to be long enough to be noticed:</text>
  <text x="140" y="322" font-size="13" font-weight="700" fill="#2e7d32">beacon can be ~2 ms</text>

  <line x1="50" y1="342" x2="850" y2="342" stroke="#e5e5e5"/>

  <text x="70" y="370" font-size="14" font-weight="700" fill="#8a6d1f">C.  So sniffing saves receive power and costs transmit power</text>

  <text x="200" y="398" text-anchor="middle" font-size="12" font-weight="700" fill="#555">receiving</text>
  <text x="520" y="398" text-anchor="middle" font-size="12" font-weight="700" fill="#555">transmitting</text>

  <text x="120" y="424" font-size="12" fill="#4066c0" font-weight="700">sniff</text>
  <rect x="200" y="412" width="87" height="18" fill="#9db8e0"/>
  <text x="295" y="426" font-size="11" fill="#555">29%</text>
  <rect x="520" y="412" width="60" height="18" fill="#e6a09a"/>
  <text x="588" y="426" font-size="11" font-weight="700" fill="#c0392b">6.7%</text>

  <text x="120" y="454" font-size="12" fill="#2e7d32" font-weight="700">always on</text>
  <rect x="200" y="442" width="279" height="18" fill="#9db8e0"/>
  <text x="487" y="456" font-size="11" fill="#555">93%</text>
  <rect x="520" y="442" width="12" height="18" fill="#e6a09a"/>
  <text x="540" y="456" font-size="11" font-weight="700" fill="#2e7d32">1.3%</text>

  <text x="120" y="490" font-size="12" fill="#1a1a1a">If driving the electrode costs more than running the ADC — usually true — then <tspan font-weight="700" fill="#2e7d32">always-on wins</tspan>.</text>
  <text x="120" y="508" font-size="12" fill="#888">Undecidable until there is a real power budget. Both are one config constant apart.</text>

  <line x1="50" y1="524" x2="850" y2="524" stroke="#d0d0d0"/>
  <text x="450" y="538" text-anchor="middle" font-size="11" fill="#888">Handoff — M1 walkthrough — 11c/13</text>
</svg>
