<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="560" fill="#faf9f7"/>

  <text x="450" y="44" text-anchor="middle" font-size="24" font-weight="600" fill="#1a1a1a">Step 3 — What one band does over and over</text>
  <line x1="90" y1="60" x2="810" y2="60" stroke="#d8d4cd" stroke-width="2"/>

  <!-- callout labels -->
  <text x="95" y="112" text-anchor="middle" font-size="14" font-weight="600" fill="#2f6f8f">shout</text>
  <text x="95" y="130" text-anchor="middle" font-size="13" fill="#2f6f8f">10 ms</text>
  <line x1="95" y1="140" x2="95" y2="178" stroke="#b8b3aa" stroke-width="1.2"/>

  <text x="185" y="112" text-anchor="middle" font-size="14" font-weight="600" fill="#3f7f4f">listen</text>
  <text x="185" y="130" text-anchor="middle" font-size="13" fill="#3f7f4f">24 ms</text>
  <line x1="185" y1="140" x2="185" y2="178" stroke="#b8b3aa" stroke-width="1.2"/>

  <text x="500" y="112" text-anchor="middle" font-size="14" font-weight="600" fill="#3f7f4f">sniff — 2 ms of listening every 10 ms</text>
  <text x="500" y="130" text-anchor="middle" font-size="13" fill="#7a7a7a">deaf for the other 8 ms</text>
  <line x1="500" y1="140" x2="500" y2="178" stroke="#b8b3aa" stroke-width="1.2"/>

  <!-- the bar -->
  <rect x="70" y="180" width="700" height="46" fill="#efece7" stroke="#d8d4cd" stroke-width="1.5"/>

  <!-- TX 0-10ms -->
  <rect x="70" y="180" width="50" height="46" fill="#2f6f8f"/>
  <!-- settle 10-11ms -->
  <rect x="120" y="180" width="5" height="46" fill="#9a9a9a"/>
  <!-- listen 11-35ms -->
  <rect x="125" y="180" width="120" height="46" fill="#cfe3d3" stroke="#3f7f4f" stroke-width="1.2"/>
  <!-- sniff windows every 10ms from 35ms -->
  <g fill="#cfe3d3" stroke="#3f7f4f" stroke-width="1.2">
    <rect x="245" y="180" width="10" height="46"/>
    <rect x="295" y="180" width="10" height="46"/>
    <rect x="345" y="180" width="10" height="46"/>
    <rect x="395" y="180" width="10" height="46"/>
    <rect x="445" y="180" width="10" height="46"/>
    <rect x="495" y="180" width="10" height="46"/>
    <rect x="545" y="180" width="10" height="46"/>
    <rect x="595" y="180" width="10" height="46"/>
    <rect x="645" y="180" width="10" height="46"/>
    <rect x="695" y="180" width="10" height="46"/>
    <rect x="745" y="180" width="10" height="46"/>
  </g>
  <rect x="70" y="180" width="700" height="46" fill="none" stroke="#b8b3aa" stroke-width="1.5"/>

  <!-- settle leader -->
  <line x1="122" y1="178" x2="140" y2="152" stroke="#b8b3aa" stroke-width="1.2"/>
  <text x="150" y="148" font-size="12" fill="#7a7a7a">deaf 1 ms — own amp recovering</text>

  <!-- time axis -->
  <g stroke="#b8b3aa" stroke-width="1.2">
    <line x1="70" y1="226" x2="70" y2="242"/>
    <line x1="245" y1="226" x2="245" y2="242"/>
    <line x1="570" y1="226" x2="570" y2="252"/>
  </g>
  <text x="70" y="260" text-anchor="middle" font-size="12" fill="#7a7a7a">0</text>
  <text x="245" y="260" text-anchor="middle" font-size="12" fill="#7a7a7a">35 ms</text>

  <!-- next beacon bracket -->
  <path d="M 570 274 L 570 284 L 770 284 L 770 274" fill="none" stroke="#2f6f8f" stroke-width="1.8"/>
  <text x="670" y="304" text-anchor="middle" font-size="13" fill="#2f6f8f">next shout: 100 ms + a coin toss of 0–100 ms</text>

  <!-- deaf gap bracket -->
  <path d="M 355 236 L 355 246 L 395 246 L 395 236" fill="none" stroke="#c0392b" stroke-width="1.6"/>
  <text x="375" y="264" text-anchor="middle" font-size="12" fill="#c0392b">deaf 8 ms</text>

  <!-- legend -->
  <rect x="70" y="336" width="700" height="58" rx="10" fill="#ffffff" stroke="#d8d4cd" stroke-width="1.5"/>
  <rect x="100" y="356" width="22" height="18" fill="#2f6f8f"/>
  <text x="132" y="371" font-size="14" fill="#3a3a3a">transmitting</text>
  <rect x="270" y="356" width="22" height="18" fill="#cfe3d3" stroke="#3f7f4f" stroke-width="1.2"/>
  <text x="302" y="371" font-size="14" fill="#3a3a3a">ears open</text>
  <rect x="430" y="356" width="22" height="18" fill="#efece7" stroke="#b8b3aa" stroke-width="1.2"/>
  <text x="462" y="371" font-size="14" fill="#3a3a3a">deaf</text>
  <text x="560" y="371" font-size="13" fill="#7a7a7a">listening is the expensive part, so it is rationed</text>

  <!-- numbers box -->
  <rect x="70" y="414" width="700" height="94" rx="10" fill="#ffffff" stroke="#d8d4cd" stroke-width="1.5"/>
  <g font-size="14" fill="#3a3a3a">
    <text x="100" y="442">shout</text>      <text x="250" y="442" fill="#1a1a1a" font-weight="600">10 ms</text>
    <text x="100" y="468">post-shout listen</text> <text x="250" y="468" fill="#1a1a1a" font-weight="600">24 ms</text>
    <text x="100" y="494">shout spacing</text> <text x="250" y="494" fill="#1a1a1a" font-weight="600">100–200 ms</text>

    <text x="440" y="442">sniff window</text>  <text x="620" y="442" fill="#1a1a1a" font-weight="600">2 ms</text>
    <text x="440" y="468">sniff spacing</text>  <text x="620" y="468" fill="#1a1a1a" font-weight="600">10 ms</text>
    <text x="440" y="494">longest deaf gap</text> <text x="620" y="494" fill="#c0392b" font-weight="600">8 ms</text>
  </g>

  <text x="450" y="540" text-anchor="middle" font-size="13" fill="#8a8a8a">Handoff — contact trigger — 3/6</text>
</svg>
