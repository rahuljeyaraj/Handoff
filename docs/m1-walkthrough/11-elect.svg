<svg xmlns="http://www.w3.org/2000/svg" width="900" height="570" viewBox="0 0 900 570" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="570" fill="#ffffff"/>
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#333"/>
    </marker>
  </defs>

  <text x="450" y="36" text-anchor="middle" font-size="21" font-weight="700" fill="#1a1a1a">Election — who talks first?</text>
  <line x1="50" y1="52" x2="850" y2="52" stroke="#d0d0d0" stroke-width="1"/>

  <!-- A: normal case -->
  <text x="70" y="82" font-size="14" font-weight="700" fill="#2e7d32">A.  The usual case — one dice roll is smaller</text>

  <text x="70" y="118" font-size="13" font-weight="700" fill="#4066c0">band A</text>
  <line x1="140" y1="112" x2="800" y2="112" stroke="#ddd"/>
  <rect x="140" y="100" width="150" height="24" fill="#dde6f5" stroke="#4066c0"/>
  <text x="215" y="117" text-anchor="middle" font-size="11" fill="#2a4a90">waits (rolled 2)</text>
  <rect x="290" y="100" width="60" height="24" fill="#f0f4fa" stroke="#4066c0" stroke-dasharray="3,2"/>
  <text x="320" y="117" text-anchor="middle" font-size="10" fill="#4066c0">listen</text>
  <rect x="350" y="100" width="200" height="24" fill="#2e7d32"/>
  <text x="450" y="117" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">silence heard — TALKS</text>

  <text x="70" y="170" font-size="13" font-weight="700" fill="#8a6d1f">band B</text>
  <line x1="140" y1="164" x2="800" y2="164" stroke="#ddd"/>
  <rect x="140" y="152" width="330" height="24" fill="#f5f0e3" stroke="#8a6d1f"/>
  <text x="305" y="169" text-anchor="middle" font-size="11" fill="#8a6d1f">waits (rolled 5)</text>
  <rect x="470" y="152" width="60" height="24" fill="#faf6ea" stroke="#8a6d1f" stroke-dasharray="3,2"/>
  <text x="500" y="169" text-anchor="middle" font-size="10" fill="#8a6d1f">listen</text>
  <rect x="530" y="152" width="200" height="24" fill="#5a7fc0"/>
  <text x="630" y="169" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">hears A — LISTENS</text>

  <line x1="420" y1="128" x2="500" y2="148" stroke="#c0392b" stroke-width="1.5" marker-end="url(#ah)"/>

  <line x1="50" y1="200" x2="850" y2="200" stroke="#e5e5e5"/>

  <!-- B: clash -->
  <text x="70" y="228" font-size="14" font-weight="700" fill="#c0392b">B.  The clash — both rolls land too close together</text>

  <text x="70" y="264" font-size="13" font-weight="700" fill="#4066c0">band A</text>
  <line x1="140" y1="258" x2="800" y2="258" stroke="#ddd"/>
  <rect x="140" y="246" width="150" height="24" fill="#dde6f5" stroke="#4066c0"/>
  <text x="215" y="263" text-anchor="middle" font-size="11" fill="#2a4a90">waits (rolled 2)</text>
  <rect x="290" y="246" width="220" height="24" fill="#c0392b"/>
  <text x="400" y="263" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">talks</text>

  <text x="70" y="308" font-size="13" font-weight="700" fill="#8a6d1f">band B</text>
  <line x1="140" y1="302" x2="800" y2="302" stroke="#ddd"/>
  <rect x="140" y="290" width="172" height="24" fill="#f5f0e3" stroke="#8a6d1f"/>
  <text x="226" y="307" text-anchor="middle" font-size="11" fill="#8a6d1f">waits (rolled 2.3)</text>
  <rect x="312" y="290" width="220" height="24" fill="#c0392b"/>
  <text x="422" y="307" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">talks too</text>

  <rect x="290" y="240" width="30" height="80" fill="#c0392b" opacity="0.15"/>
  <text x="305" y="338" text-anchor="middle" font-size="10" fill="#c0392b">too close</text>

  <text x="560" y="278" font-size="12" fill="#555">A carrier takes a few chips to notice.</text>
  <text x="560" y="298" font-size="12" fill="#555">Rolls landing inside that gap both go.</text>
  <text x="560" y="318" font-size="12" font-weight="700" fill="#c0392b">Happens about 1 try in 3.</text>

  <line x1="50" y1="356" x2="850" y2="356" stroke="#e5e5e5"/>

  <!-- C: redraw -->
  <text x="70" y="384" font-size="14" font-weight="700" fill="#4066c0">C.  The fix: roll again</text>

  <g>
    <rect x="90" y="400" width="70" height="40" rx="6" fill="#fbeae8" stroke="#c0392b"/>
    <text x="125" y="425" text-anchor="middle" font-size="12" font-weight="700" fill="#c0392b">clash</text>
    <line x1="160" y1="420" x2="196" y2="420" stroke="#333" stroke-width="2" marker-end="url(#ah)"/>
    <rect x="204" y="400" width="70" height="40" rx="6" fill="#fbeae8" stroke="#c0392b"/>
    <text x="239" y="425" text-anchor="middle" font-size="12" font-weight="700" fill="#c0392b">clash</text>
    <line x1="274" y1="420" x2="310" y2="420" stroke="#333" stroke-width="2" marker-end="url(#ah)"/>
    <rect x="318" y="400" width="70" height="40" rx="6" fill="#eaf3ea" stroke="#2e7d32"/>
    <text x="353" y="425" text-anchor="middle" font-size="12" font-weight="700" fill="#2e7d32">clear</text>
    <line x1="388" y1="420" x2="424" y2="420" stroke="#333" stroke-width="2" marker-end="url(#ah)"/>
    <rect x="432" y="400" width="130" height="40" rx="6" fill="#2e7d32"/>
    <text x="497" y="425" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">roles settled</text>
  </g>

  <text x="600" y="416" font-size="12" fill="#555">Up to 16 rolls, ~112 ms worst case.</text>
  <text x="600" y="436" font-size="12" font-weight="700" fill="#2e7d32">Total failure: about 1 in 30 million.</text>

  <line x1="50" y1="466" x2="850" y2="466" stroke="#e5e5e5"/>

  <text x="70" y="494" font-size="14" font-weight="700" fill="#8a6d1f">D.  Why not just give each band a fixed number?</text>
  <text x="90" y="516" font-size="12" fill="#555">Through the body there is no way to arbitrate a clash by priority.</text>
  <text x="90" y="536" font-size="12" fill="#555">The lowest number would win forever, and every other band would starve.</text>

  <line x1="50" y1="550" x2="850" y2="550" stroke="#d0d0d0"/>
  <text x="450" y="563" text-anchor="middle" font-size="11" fill="#888">Handoff — M1 walkthrough — 11/13</text>
</svg>
