<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 660" width="900" height="660" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="660" fill="#faf9f7"/>

  <text x="450" y="38" text-anchor="middle" font-size="23" font-weight="600" fill="#1a1a1a">Step 5 — One handshake, end to end</text>
  <line x1="90" y1="54" x2="810" y2="54" stroke="#d8d4cd" stroke-width="2"/>

  <!-- ================= OVERVIEW ================= -->
  <text x="110" y="82" font-size="14" font-weight="600" fill="#7a7a7a">THE WHOLE CONTACT</text>

  <text x="100" y="114" text-anchor="end" font-size="14" font-weight="600" fill="#2f6f8f">A</text>
  <rect x="110" y="96" width="675" height="30" fill="#efece7" stroke="#b8b3aa" stroke-width="1.2"/>
  <rect x="110" y="96" width="37.5" height="30" fill="#2f6f8f"/>
  <rect x="147.5" y="96" width="3.75" height="30" fill="#9a9a9a"/>
  <rect x="151.25" y="96" width="15" height="30" fill="#cfe3d3" stroke="#3f7f4f" stroke-width="1"/>
  <rect x="166.25" y="96" width="581.25" height="30" fill="#a9cdb4" stroke="#3f7f4f" stroke-width="1"/>
  <text x="457" y="116" text-anchor="middle" font-size="13" fill="#1f4a2f">receiving — 156 ms frame</text>

  <text x="100" y="162" text-anchor="end" font-size="14" font-weight="600" fill="#8f5a2f">B</text>
  <rect x="110" y="144" width="675" height="30" fill="#efece7" stroke="#b8b3aa" stroke-width="1.2"/>
  <rect x="110" y="144" width="52.5" height="30" fill="#f0e2c8" stroke="#c79a3a" stroke-width="1"/>
  <rect x="162.5" y="144" width="585" height="30" fill="#2f6f8f"/>
  <text x="455" y="164" text-anchor="middle" font-size="13" fill="#ffffff">transmitting — 156 ms frame</text>

  <line x1="162.5" y1="180" x2="162.5" y2="196" stroke="#c79a3a" stroke-width="1.5"/>
  <text x="168" y="210" font-size="13" font-weight="600" fill="#c79a3a">14 ms to find each other</text>
  <text x="168" y="228" font-size="12" fill="#8a8a8a">everything below happens inside this sliver</text>

  <line x1="747.5" y1="180" x2="747.5" y2="196" stroke="#b8b3aa" stroke-width="1.2"/>
  <text x="785" y="210" text-anchor="end" font-size="12" fill="#8a8a8a">170 ms</text>

  <line x1="90" y1="252" x2="810" y2="252" stroke="#e2ded7" stroke-width="1.5"/>

  <!-- ================= ZOOM ================= -->
  <text x="110" y="282" font-size="14" font-weight="600" fill="#7a7a7a">THE FIRST 20 ms, CLOSE UP</text>

  <!-- guides -->
  <g stroke="#e2ded7" stroke-width="1">
    <line x1="278.75" y1="296" x2="278.75" y2="470"/>
    <line x1="447.5" y1="296" x2="447.5" y2="470"/>
    <line x1="515" y1="296" x2="515" y2="470"/>
    <line x1="582.5" y1="296" x2="582.5" y2="470"/>
    <line x1="616.25" y1="296" x2="616.25" y2="470"/>
  </g>

  <!-- A zoom -->
  <text x="100" y="342" text-anchor="end" font-size="14" font-weight="600" fill="#2f6f8f">A</text>
  <rect x="110" y="322" width="675" height="36" fill="#efece7" stroke="#b8b3aa" stroke-width="1.2"/>
  <rect x="110" y="322" width="337.5" height="36" fill="#2f6f8f"/>
  <text x="278" y="345" text-anchor="middle" font-size="13" fill="#ffffff">SHOUT — 10 ms</text>
  <rect x="447.5" y="322" width="33.75" height="36" fill="#9a9a9a"/>
  <rect x="481.25" y="322" width="135" height="36" fill="#cfe3d3" stroke="#3f7f4f" stroke-width="1"/>
  <text x="548" y="345" text-anchor="middle" font-size="12" fill="#1f4a2f">listening</text>
  <rect x="616.25" y="322" width="168.75" height="36" fill="#a9cdb4" stroke="#3f7f4f" stroke-width="1"/>
  <text x="700" y="345" text-anchor="middle" font-size="12" fill="#1f4a2f">receiving</text>

  <!-- B zoom -->
  <text x="100" y="414" text-anchor="end" font-size="14" font-weight="600" fill="#8f5a2f">B</text>
  <rect x="110" y="394" width="675" height="36" fill="#efece7" stroke="#b8b3aa" stroke-width="1.2"/>
  <text x="177" y="417" text-anchor="middle" font-size="12" fill="#8a8a8a">deaf</text>
  <rect x="245" y="394" width="33.75" height="36" fill="#cfe3d3" stroke="#3f7f4f" stroke-width="1"/>
  <text x="262" y="450" text-anchor="middle" font-size="11" fill="#3f7f4f">sniff</text>
  <rect x="278.75" y="394" width="236.25" height="36" fill="#cfe3d3" stroke="#3f7f4f" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="397" y="417" text-anchor="middle" font-size="12" fill="#1f4a2f">WAIT for A to stop</text>
  <rect x="515" y="394" width="67.5" height="36" fill="#cfe3d3" stroke="#3f7f4f" stroke-width="1"/>
  <rect x="582.5" y="394" width="202.5" height="36" fill="#2f6f8f"/>
  <text x="684" y="417" text-anchor="middle" font-size="13" fill="#ffffff">B TRANSMITS</text>

  <!-- axis -->
  <g stroke="#b8b3aa" stroke-width="1.2">
    <line x1="110" y1="430" x2="110" y2="446"/>
    <line x1="447.5" y1="430" x2="447.5" y2="446"/>
    <line x1="515" y1="430" x2="515" y2="446"/>
    <line x1="582.5" y1="430" x2="582.5" y2="446"/>
    <line x1="785" y1="430" x2="785" y2="446"/>
  </g>
  <g font-size="11" fill="#8a8a8a" text-anchor="middle">
    <text x="110" y="462">0</text>
    <text x="447.5" y="462">10</text>
    <text x="515" y="462">12</text>
    <text x="582.5" y="462">14</text>
    <text x="785" y="462">20 ms</text>
  </g>

  <!-- event badges -->
  <g>
    <circle cx="278.75" cy="308" r="11" fill="#8f5a2f"/><text x="278.75" y="313" text-anchor="middle" font-size="12" fill="#fff" font-weight="600">1</text>
    <circle cx="447.5" cy="308" r="11" fill="#2f6f8f"/><text x="447.5" y="313" text-anchor="middle" font-size="12" fill="#fff" font-weight="600">2</text>
    <circle cx="515" cy="308" r="11" fill="#8f5a2f"/><text x="515" y="313" text-anchor="middle" font-size="12" fill="#fff" font-weight="600">3</text>
    <circle cx="582.5" cy="308" r="11" fill="#8f5a2f"/><text x="582.5" y="313" text-anchor="middle" font-size="12" fill="#fff" font-weight="600">4</text>
    <circle cx="616.25" cy="286" r="11" fill="#2f6f8f"/><text x="616.25" y="291" text-anchor="middle" font-size="12" fill="#fff" font-weight="600">5</text>
  </g>

  <!-- conclusion -->
  <rect x="90" y="486" width="720" height="112" rx="12" fill="#ffffff" stroke="#2f6f8f" stroke-width="2"/>
  <text x="450" y="516" text-anchor="middle" font-size="17" font-weight="600" fill="#1a1a1a">The one who SHOUTED does not send the data.</text>
  <text x="450" y="546" text-anchor="middle" font-size="16" fill="#2f6f8f">The one who HEARD the shout talks first.</text>
  <text x="450" y="576" text-anchor="middle" font-size="13" fill="#7a7a7a">A is still deaf and busy at the end of its own shout. B is already free.</text>

  <text x="450" y="636" text-anchor="middle" font-size="13" fill="#8a8a8a">Handoff — contact trigger — 5/6</text>
</svg>
