<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="560" fill="#ffffff"/>
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#333"/>
    </marker>
  </defs>

  <text x="450" y="36" text-anchor="middle" font-size="21" font-weight="700" fill="#1a1a1a">Manchester — every bit is a pair, and the pair judges itself</text>
  <line x1="50" y1="52" x2="850" y2="52" stroke="#d0d0d0" stroke-width="1"/>

  <!-- Panel A -->
  <text x="70" y="82" font-size="14" font-weight="700" fill="#4066c0">A.  One bit -&gt; two chips</text>

  <text x="100" y="118" font-size="30" font-weight="700" fill="#2e7d32">1</text>
  <line x1="128" y1="112" x2="160" y2="112" stroke="#333" stroke-width="2" marker-end="url(#ah)"/>
  <rect x="172" y="94" width="52" height="34" fill="#2e7d32"/>
  <rect x="224" y="94" width="52" height="34" fill="#ffffff" stroke="#bbb"/>
  <text x="198" y="117" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">on</text>
  <text x="250" y="117" text-anchor="middle" font-size="13" fill="#999">off</text>
  <text x="296" y="117" font-size="13" fill="#555">first louder</text>

  <text x="100" y="176" font-size="30" font-weight="700" fill="#c0392b">0</text>
  <line x1="128" y1="170" x2="160" y2="170" stroke="#333" stroke-width="2" marker-end="url(#ah)"/>
  <rect x="172" y="152" width="52" height="34" fill="#ffffff" stroke="#bbb"/>
  <rect x="224" y="152" width="52" height="34" fill="#c0392b"/>
  <text x="198" y="175" text-anchor="middle" font-size="13" fill="#999">off</text>
  <text x="250" y="175" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">on</text>
  <text x="296" y="175" font-size="13" fill="#555">second louder</text>

  <text x="470" y="120" font-size="12" fill="#555">Bits go MSB-first.</text>
  <text x="470" y="140" font-size="12" fill="#555">1 byte = 8 bits = 16 chips.</text>
  <text x="470" y="168" font-size="12" fill="#888">Cost: half the data rate.</text>
  <text x="470" y="186" font-size="12" fill="#888">Gain: no threshold needed.</text>

  <line x1="50" y1="212" x2="850" y2="212" stroke="#e5e5e5" stroke-width="1"/>

  <!-- Panel B -->
  <text x="70" y="240" font-size="14" font-weight="700" fill="#c0392b">B.  Why not just a threshold? Because the level walks away.</text>

  <!-- fixed threshold line -->
  <line x1="100" y1="300" x2="790" y2="300" stroke="#c0392b" stroke-width="2" stroke-dasharray="5,4"/>
  <text x="798" y="304" font-size="11" fill="#c0392b">fixed</text>
  <text x="798" y="317" font-size="11" fill="#c0392b">threshold</text>

  <!-- decaying chip pairs: each pair on/off, amplitude shrinking -->
  <g>
    <rect x="110" y="262" width="26" height="78" fill="#2e7d32"/><rect x="138" y="330" width="26" height="10" fill="#cfd8ea"/>
    <rect x="180" y="272" width="26" height="68" fill="#2e7d32"/><rect x="208" y="332" width="26" height="8"  fill="#cfd8ea"/>
    <rect x="250" y="290" width="26" height="50" fill="#2e7d32"/><rect x="278" y="333" width="26" height="7"  fill="#cfd8ea"/>
    <rect x="320" y="308" width="26" height="32" fill="#2e7d32"/><rect x="348" y="334" width="26" height="6"  fill="#cfd8ea"/>
    <rect x="390" y="318" width="26" height="22" fill="#2e7d32"/><rect x="418" y="335" width="26" height="5"  fill="#cfd8ea"/>
    <rect x="460" y="324" width="26" height="16" fill="#2e7d32"/><rect x="488" y="336" width="26" height="4"  fill="#cfd8ea"/>
  </g>
  <line x1="100" y1="340" x2="560" y2="340" stroke="#333"/>
  <text x="110" y="360" font-size="11" fill="#555">grip loosens -&gt; every chip gets quieter, together</text>

  <text x="110" y="386" font-size="12" fill="#c0392b" font-weight="700">threshold: 1 1 0 0 0 0</text>
  <text x="255" y="386" font-size="12" fill="#c0392b">— wrong after the 2nd bit</text>
  <text x="110" y="406" font-size="12" fill="#2e7d32" font-weight="700">pair compare: 1 1 1 1 1 1</text>
  <text x="265" y="406" font-size="12" fill="#2e7d32">— right all the way down</text>

  <rect x="590" y="262" width="240" height="100" rx="8" fill="#eef3fb" stroke="#4066c0" stroke-width="1.5"/>
  <text x="710" y="288" text-anchor="middle" font-size="13" font-weight="700" fill="#4066c0">the only test</text>
  <text x="710" y="318" text-anchor="middle" font-size="16" font-family="Consolas, monospace" fill="#1a1a1a">first &gt; second</text>
  <text x="710" y="344" text-anchor="middle" font-size="11" fill="#555">no constant, no calibration</text>

  <line x1="50" y1="428" x2="850" y2="428" stroke="#e5e5e5" stroke-width="1"/>

  <!-- Panel C -->
  <text x="70" y="456" font-size="14" font-weight="700" fill="#8a6d1f">C.  Broken pairs are not an error here</text>

  <rect x="100" y="470" width="34" height="26" fill="#2e7d32"/><rect x="134" y="470" width="34" height="26" fill="#2e7d32"/>
  <text x="180" y="489" font-size="13" font-family="Consolas, monospace" fill="#555">1 1  ->  take the first chip</text>
  <rect x="100" y="506" width="34" height="26" fill="#ffffff" stroke="#bbb"/><rect x="134" y="506" width="34" height="26" fill="#ffffff" stroke="#bbb"/>
  <text x="180" y="525" font-size="13" font-family="Consolas, monospace" fill="#555">0 0  ->  take the first chip</text>

  <text x="470" y="489" font-size="12" fill="#555">Never returns a failure.</text>
  <text x="470" y="509" font-size="12" fill="#555">Guessing costs nothing —</text>
  <text x="470" y="529" font-size="12" font-weight="700" fill="#8a6d1f">the CRC is the arbiter, not this layer.</text>

  <line x1="50" y1="544" x2="850" y2="544" stroke="#d0d0d0"/>
  <text x="450" y="556" text-anchor="middle" font-size="11" fill="#888">Handoff — M1 walkthrough — 6/13</text>
</svg>
