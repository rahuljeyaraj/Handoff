<svg xmlns="http://www.w3.org/2000/svg" width="900" height="545" viewBox="0 0 900 545" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="545" fill="#ffffff"/>
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#333"/>
    </marker>
  </defs>

  <text x="450" y="36" text-anchor="middle" font-size="21" font-weight="700" fill="#1a1a1a">Compact — the text is too big, so send slots instead</text>
  <line x1="50" y1="52" x2="850" y2="52" stroke="#d0d0d0" stroke-width="1"/>

  <!-- A: the squeeze -->
  <text x="70" y="82" font-size="14" font-weight="700" fill="#4066c0">A.  Same card, a third of the size</text>

  <rect x="90" y="96" width="290" height="120" fill="#fbeae8" stroke="#c0392b"/>
  <text x="235" y="118" text-anchor="middle" font-size="12" font-weight="700" fill="#c0392b">the real vCard text</text>
  <g font-size="11" font-family="Consolas, monospace" fill="#8a5a52">
    <text x="104" y="140">FN:Alice Smith</text>
    <text x="104" y="158">TEL;TYPE=CELL:+44 7700 900123</text>
    <text x="104" y="176">EMAIL:alice@gmail.com</text>
    <text x="104" y="194">ORG:Acme Ltd</text>
  </g>
  <text x="235" y="234" text-anchor="middle" font-size="13" font-weight="700" fill="#c0392b">~169 bytes</text>
  <text x="235" y="252" text-anchor="middle" font-size="11" fill="#999">will not fit in one contact</text>

  <line x1="400" y1="160" x2="470" y2="160" stroke="#333" stroke-width="2" marker-end="url(#ah)"/>

  <rect x="490" y="96" width="290" height="120" fill="#eaf3ea" stroke="#2e7d32"/>
  <text x="635" y="118" text-anchor="middle" font-size="12" font-weight="700" fill="#2e7d32">what goes on the wire</text>
  <g font-size="11" font-family="Consolas, monospace" fill="#3a6b3c">
    <text x="504" y="140">01 11  Alice Smith</text>
    <text x="504" y="158">03 07  44 · 77009 00123</text>
    <text x="504" y="176">05 06  alice · 00</text>
    <text x="504" y="194">06 08  Acme Ltd</text>
  </g>
  <text x="635" y="234" text-anchor="middle" font-size="13" font-weight="700" fill="#2e7d32">~55 bytes</text>
  <text x="635" y="252" text-anchor="middle" font-size="11" fill="#999">labels gone, digits packed</text>

  <line x1="50" y1="268" x2="850" y2="268" stroke="#e5e5e5"/>

  <!-- B: three tricks -->
  <text x="70" y="296" font-size="14" font-weight="700" fill="#8a6d1f">B.  Where the savings come from</text>

  <rect x="90" y="310" width="230" height="86" rx="8" fill="#f7f9fc" stroke="#aabbdd"/>
  <text x="205" y="332" text-anchor="middle" font-size="12" font-weight="700" fill="#2a4a90">1. drop the label</text>
  <text x="205" y="356" text-anchor="middle" font-size="12" font-family="Consolas, monospace" fill="#777">TEL;TYPE=CELL:</text>
  <text x="205" y="378" text-anchor="middle" font-size="14" font-family="Consolas, monospace" font-weight="700" fill="#2a4a90">03</text>

  <rect x="335" y="310" width="230" height="86" rx="8" fill="#f7f9fc" stroke="#aabbdd"/>
  <text x="450" y="332" text-anchor="middle" font-size="12" font-weight="700" fill="#2a4a90">2. two digits per byte</text>
  <text x="450" y="356" text-anchor="middle" font-size="12" font-family="Consolas, monospace" fill="#777">"7700900123"  10 bytes</text>
  <text x="450" y="378" text-anchor="middle" font-size="14" font-family="Consolas, monospace" font-weight="700" fill="#2a4a90">5 bytes</text>

  <rect x="580" y="310" width="230" height="86" rx="8" fill="#f7f9fc" stroke="#aabbdd"/>
  <text x="695" y="332" text-anchor="middle" font-size="12" font-weight="700" fill="#2a4a90">3. domain dictionary</text>
  <text x="695" y="356" text-anchor="middle" font-size="12" font-family="Consolas, monospace" fill="#777">"@gmail.com"  10 bytes</text>
  <text x="695" y="378" text-anchor="middle" font-size="14" font-family="Consolas, monospace" font-weight="700" fill="#2a4a90">1 byte</text>

  <line x1="50" y1="416" x2="850" y2="416" stroke="#e5e5e5"/>

  <!-- C: priority -->
  <text x="70" y="444" font-size="14" font-weight="700" fill="#2e7d32">C.  Best fields first, so a short contact still lands something</text>

  <rect x="90"  y="458" width="120" height="34" fill="#2e7d32"/>
  <rect x="212" y="458" width="120" height="34" fill="#5c9e5f"/>
  <rect x="334" y="458" width="120" height="34" fill="#8fc191"/>
  <rect x="456" y="458" width="110" height="34" fill="#cfe0cf"/>
  <rect x="568" y="458" width="110" height="34" fill="#e4ece4"/>
  <rect x="680" y="458" width="130" height="34" fill="#f0f4f0"/>

  <g font-size="12" text-anchor="middle" font-weight="700">
    <text x="150" y="480" fill="#fff">name</text>
    <text x="272" y="480" fill="#fff">mobile</text>
    <text x="394" y="480" fill="#31502f">email</text>
    <text x="511" y="480" fill="#4a5a4a">org</text>
    <text x="623" y="480" fill="#6a7a6a">title</text>
    <text x="745" y="480" fill="#8a9a8a">the rest</text>
  </g>
  <text x="90" y="508" font-size="11" fill="#2e7d32">first fragment = a usable contact on its own</text>

  <line x1="50" y1="527" x2="850" y2="527" stroke="#d0d0d0"/>
  <text x="450" y="540" text-anchor="middle" font-size="11" fill="#888">Handoff — M1 walkthrough — 9/13</text>
</svg>
