<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 660" width="900" height="660" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="660" fill="#faf9f7"/>
  <text x="450" y="40" text-anchor="middle" font-size="24" font-weight="600" fill="#1a1a1a">The three faults that still need an answer</text>
  <line x1="90" y1="56" x2="810" y2="56" stroke="#d8d4cd" stroke-width="2"/>

  <!-- 1 -->
  <text x="110" y="88" font-size="14" font-weight="600" fill="#7a7a7a">1 — A CARRIER THAT NEVER STOPS  (noise, or a stuck band)</text>
  <rect x="110" y="100" width="660" height="34" fill="#efece7" stroke="#b8b3aa" stroke-width="1.2"/>
  <rect x="110" y="100" width="70" height="34" fill="#cfe3d3" stroke="#3f7f4f" stroke-width="1"/>
  <text x="145" y="122" text-anchor="middle" font-size="11" fill="#1f4a2f">listen</text>
  <rect x="180" y="100" width="380" height="34" fill="#f0e2c8" stroke="#c79a3a" stroke-width="1.4"/>
  <text x="370" y="122" text-anchor="middle" font-size="12" fill="#8a6a1a">waiting for it to stop… it never does</text>
  <rect x="560" y="100" width="210" height="34" fill="#cfe3d3" stroke="#3f7f4f" stroke-width="1"/>
  <text x="665" y="122" text-anchor="middle" font-size="12" fill="#1f4a2f">give up, go back to listening</text>
  <path d="M 180 142 L 180 152 L 560 152 L 560 142" fill="none" stroke="#c79a3a" stroke-width="1.5"/>
  <text x="370" y="170" text-anchor="middle" font-size="13" font-weight="600" fill="#c79a3a">cap the wait at 30 ms</text>
  <text x="370" y="188" text-anchor="middle" font-size="12" fill="#8a8a8a">3x the longest legal shout, so a real shout is never cut off</text>

  <line x1="90" y1="210" x2="810" y2="210" stroke="#e2ded7" stroke-width="1.5"/>

  <!-- 2 -->
  <text x="110" y="242" font-size="14" font-weight="600" fill="#7a7a7a">2 — HANDS COME APART MID-CARD</text>
  <text x="102" y="278" text-anchor="end" font-size="13" font-weight="600" fill="#8f5a2f">B</text>
  <rect x="110" y="258" width="660" height="34" fill="#efece7" stroke="#b8b3aa" stroke-width="1.2"/>
  <rect x="110" y="258" width="260" height="34" fill="#2f6f8f"/>
  <text x="240" y="280" text-anchor="middle" font-size="12" fill="#ffffff">sending…</text>
  <line x1="370" y1="252" x2="370" y2="298" stroke="#c0392b" stroke-width="2.5"/>
  <text x="378" y="248" font-size="12" font-weight="600" fill="#c0392b">skin separates — channel gone</text>
  <rect x="370" y="258" width="400" height="34" fill="#fbe9e7" stroke="#c0392b" stroke-width="1.2"/>
  <text x="570" y="280" text-anchor="middle" font-size="12" fill="#c0392b">nothing arrives</text>
  <text x="110" y="320" font-size="13" fill="#3a3a3a">Answer: after a quiet timeout, go back to shouting.</text>
  <text x="110" y="342" font-size="13" font-weight="600" fill="#3f7f4f">Keep the half-received card — half a name is still worth showing.</text>

  <line x1="90" y1="364" x2="810" y2="364" stroke="#e2ded7" stroke-width="1.5"/>

  <!-- 3 -->
  <text x="110" y="396" font-size="14" font-weight="600" fill="#7a7a7a">3 — WHOSE TURN IS IT AFTER THE FIRST CARD?</text>
  <text x="102" y="432" text-anchor="end" font-size="13" font-weight="600" fill="#8f5a2f">B</text>
  <rect x="110" y="412" width="660" height="30" fill="#efece7" stroke="#b8b3aa" stroke-width="1.2"/>
  <rect x="110" y="412" width="300" height="30" fill="#2f6f8f"/>
  <text x="260" y="432" text-anchor="middle" font-size="12" fill="#ffffff">B sends its card</text>
  <rect x="410" y="412" width="360" height="30" fill="#cfe3d3" stroke="#3f7f4f" stroke-width="1"/>
  <text x="590" y="432" text-anchor="middle" font-size="12" fill="#1f4a2f">B listens</text>

  <text x="102" y="480" text-anchor="end" font-size="13" font-weight="600" fill="#2f6f8f">A</text>
  <rect x="110" y="460" width="660" height="30" fill="#efece7" stroke="#b8b3aa" stroke-width="1.2"/>
  <rect x="110" y="460" width="300" height="30" fill="#cfe3d3" stroke="#3f7f4f" stroke-width="1"/>
  <text x="260" y="480" text-anchor="middle" font-size="12" fill="#1f4a2f">A receives</text>
  <rect x="410" y="460" width="360" height="30" fill="#2f6f8f"/>
  <text x="590" y="480" text-anchor="middle" font-size="12" fill="#ffffff">A sends its card</text>

  <text x="110" y="518" font-size="13" fill="#3a3a3a">The sender stops and listens. The receiver has been listening all along,</text>
  <text x="110" y="540" font-size="13" fill="#3a3a3a">so it sees the silence and takes the turn. Same rule as before, no new machinery.</text>

  <!-- summary -->
  <rect x="110" y="562" width="680" height="52" rx="12" fill="#eef4f7" stroke="#2f6f8f" stroke-width="2"/>
  <text x="450" y="594" text-anchor="middle" font-size="15" font-weight="600" fill="#1a1a1a">Three timeouts. That is the entire error handling.</text>

  <text x="450" y="644" text-anchor="middle" font-size="13" fill="#8a8a8a">Handoff — simplified trigger — 5/5</text>
</svg>
