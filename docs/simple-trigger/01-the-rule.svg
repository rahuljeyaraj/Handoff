<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" width="900" height="640" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="640" fill="#faf9f7"/>
  <text x="450" y="40" text-anchor="middle" font-size="24" font-weight="600" fill="#1a1a1a">The whole system — three states, one rule</text>
  <line x1="90" y1="56" x2="810" y2="56" stroke="#d8d4cd" stroke-width="2"/>

  <!-- loop -->
  <rect x="110" y="96" width="170" height="70" rx="12" fill="#2f6f8f"/>
  <text x="195" y="128" text-anchor="middle" font-size="16" font-weight="600" fill="#ffffff">SHOUT</text>
  <text x="195" y="150" text-anchor="middle" font-size="13" fill="#cfe3ef">10 ms flat carrier</text>

  <path d="M 280 131 L 330 131" stroke="#b8b3aa" stroke-width="2"/>
  <polygon points="330,131 318,125 318,137" fill="#b8b3aa"/>

  <rect x="336" y="96" width="130" height="70" rx="12" fill="#efece7" stroke="#b8b3aa" stroke-width="2"/>
  <text x="401" y="128" text-anchor="middle" font-size="15" font-weight="600" fill="#7a7a7a">DEAF</text>
  <text x="401" y="150" text-anchor="middle" font-size="13" fill="#8a8a8a">1 ms, own amp</text>

  <path d="M 466 131 L 516 131" stroke="#b8b3aa" stroke-width="2"/>
  <polygon points="516,131 504,125 504,137" fill="#b8b3aa"/>

  <rect x="522" y="96" width="200" height="70" rx="12" fill="#cfe3d3" stroke="#3f7f4f" stroke-width="2.5"/>
  <text x="622" y="126" text-anchor="middle" font-size="16" font-weight="600" fill="#1f4a2f">LISTEN</text>
  <text x="622" y="150" text-anchor="middle" font-size="13" fill="#1f4a2f">50–100 ms — dice</text>

  <path d="M 622 172 L 622 196 L 195 196 L 195 172" fill="none" stroke="#b8b3aa" stroke-width="2"/>
  <polygon points="195,172 189,184 201,184" fill="#b8b3aa"/>
  <text x="408" y="214" text-anchor="middle" font-size="13" fill="#8a8a8a">heard nothing the whole time → shout again</text>

  <line x1="90" y1="244" x2="810" y2="244" stroke="#e2ded7" stroke-width="1.5"/>
  <text x="450" y="276" text-anchor="middle" font-size="17" font-weight="600" fill="#1a1a1a">While listening, whatever you hear is one of exactly two things</text>

  <!-- branch 1 -->
  <rect x="110" y="300" width="320" height="216" rx="14" fill="#ffffff" stroke="#2f6f8f" stroke-width="2.5"/>
  <text x="270" y="330" text-anchor="middle" font-size="15" font-weight="600" fill="#2f6f8f">A FLAT CARRIER</text>
  <rect x="150" y="344" width="240" height="26" fill="#2f6f8f"/>
  <text x="270" y="392" text-anchor="middle" font-size="13" fill="#7a7a7a">no pattern in it at all</text>
  <text x="270" y="416" text-anchor="middle" font-size="14" font-weight="600" fill="#1a1a1a">= somebody's shout</text>
  <path d="M 270 430 L 270 450" stroke="#b8b3aa" stroke-width="2"/>
  <polygon points="270,450 264,438 276,438" fill="#b8b3aa"/>
  <text x="270" y="472" text-anchor="middle" font-size="14" fill="#3a3a3a">wait for it to stop,</text>
  <text x="270" y="494" text-anchor="middle" font-size="15" font-weight="600" fill="#2f6f8f">then send your card</text>

  <!-- branch 2 -->
  <rect x="470" y="300" width="320" height="216" rx="14" fill="#ffffff" stroke="#3f7f4f" stroke-width="2.5"/>
  <text x="630" y="330" text-anchor="middle" font-size="15" font-weight="600" fill="#3f7f4f">A STRIPED PREAMBLE</text>
  <g fill="#3f7f4f">
    <rect x="510" y="344" width="12" height="26"/><rect x="534" y="344" width="12" height="26"/>
    <rect x="558" y="344" width="12" height="26"/><rect x="582" y="344" width="12" height="26"/>
    <rect x="606" y="344" width="12" height="26"/><rect x="630" y="344" width="12" height="26"/>
    <rect x="654" y="344" width="12" height="26"/><rect x="678" y="344" width="12" height="26"/>
    <rect x="702" y="344" width="12" height="26"/><rect x="726" y="344" width="12" height="26"/>
  </g>
  <text x="630" y="392" text-anchor="middle" font-size="13" fill="#7a7a7a">alternating, 8 ms of it</text>
  <text x="630" y="416" text-anchor="middle" font-size="14" font-weight="600" fill="#1a1a1a">= a real card arriving</text>
  <path d="M 630 430 L 630 450" stroke="#b8b3aa" stroke-width="2"/>
  <polygon points="630,450 624,438 636,438" fill="#b8b3aa"/>
  <text x="630" y="472" text-anchor="middle" font-size="14" fill="#3a3a3a">receive it.</text>
  <text x="630" y="494" text-anchor="middle" font-size="15" font-weight="600" fill="#3f7f4f">you are the listener</text>

  <!-- key rule -->
  <rect x="110" y="536" width="680" height="56" rx="12" fill="#fff8e6" stroke="#c79a3a" stroke-width="2"/>
  <text x="450" y="560" text-anchor="middle" font-size="14" font-weight="600" fill="#8a6a1a">The dice timer only counts SILENT time.</text>
  <text x="450" y="582" text-anchor="middle" font-size="13" fill="#8a6a1a">So a band never shouts over a card that is already being sent.</text>

  <text x="450" y="624" text-anchor="middle" font-size="13" fill="#8a8a8a">Handoff — simplified trigger — 1/5</text>
</svg>
