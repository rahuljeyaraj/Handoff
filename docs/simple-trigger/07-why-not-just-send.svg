<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 660" width="900" height="660" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="660" fill="#faf9f7"/>
  <text x="450" y="40" text-anchor="middle" font-size="24" font-weight="600" fill="#1a1a1a">And why not skip the shout — just send the card?</text>
  <line x1="90" y1="56" x2="810" y2="56" stroke="#d8d4cd" stroke-width="2"/>

  <!-- option A -->
  <text x="110" y="88" font-size="14" font-weight="600" fill="#3f7f4f">SHOUT FIRST — deaf for 11 ms per cycle</text>
  <rect x="110" y="100" width="660" height="34" fill="#cfe3d3" stroke="#3f7f4f" stroke-width="1.2"/>
  <rect x="110" y="100" width="66" height="34" fill="#2f6f8f"/>
  <rect x="470" y="100" width="66" height="34" fill="#2f6f8f"/>
  <text x="322" y="122" text-anchor="middle" font-size="12" fill="#1f4a2f">listening</text>
  <text x="655" y="122" text-anchor="middle" font-size="12" fill="#1f4a2f">listening</text>
  <text x="143" y="152" text-anchor="middle" font-size="11" fill="#2f6f8f">10 ms</text>
  <text x="503" y="152" text-anchor="middle" font-size="11" fill="#2f6f8f">10 ms</text>
  <rect x="110" y="164" width="660" height="26" rx="6" fill="#ffffff" stroke="#3f7f4f" stroke-width="1.4"/>
  <text x="440" y="182" text-anchor="middle" font-size="13" fill="#1f4a2f">deaf about 15 % of the time — the peer's shout almost always lands</text>

  <line x1="90" y1="214" x2="810" y2="214" stroke="#e2ded7" stroke-width="1.5"/>

  <!-- option B -->
  <text x="110" y="246" font-size="14" font-weight="600" fill="#c0392b">SEND THE CARD BLIND — deaf for 157 ms per cycle</text>
  <rect x="110" y="258" width="660" height="34" fill="#cfe3d3" stroke="#3f7f4f" stroke-width="1.2"/>
  <rect x="110" y="258" width="300" height="34" fill="#2f6f8f"/>
  <text x="260" y="280" text-anchor="middle" font-size="12" fill="#ffffff">whole card — 156 ms</text>
  <text x="500" y="280" text-anchor="middle" font-size="12" fill="#1f4a2f">listening</text>
  <rect x="640" y="258" width="130" height="34" fill="#2f6f8f"/>
  <text x="705" y="280" text-anchor="middle" font-size="12" fill="#ffffff">card again</text>
  <rect x="110" y="308" width="660" height="26" rx="6" fill="#fff5f4" stroke="#c0392b" stroke-width="1.4"/>
  <text x="440" y="326" text-anchor="middle" font-size="13" fill="#c0392b">deaf about 68 % of the time — most of what the peer sends is never heard</text>

  <line x1="90" y1="358" x2="810" y2="358" stroke="#e2ded7" stroke-width="1.5"/>

  <!-- the collision -->
  <text x="450" y="390" text-anchor="middle" font-size="16" font-weight="600" fill="#1a1a1a">And two blind senders overlap for 156 ms, not 10</text>

  <text x="102" y="428" text-anchor="end" font-size="13" font-weight="600" fill="#2f6f8f">A</text>
  <rect x="110" y="410" width="660" height="28" fill="#efece7" stroke="#b8b3aa" stroke-width="1.2"/>
  <rect x="110" y="410" width="420" height="28" fill="#2f6f8f"/>
  <text x="320" y="429" text-anchor="middle" font-size="12" fill="#ffffff">A sends its whole card — deaf throughout</text>

  <text x="102" y="470" text-anchor="end" font-size="13" font-weight="600" fill="#8f5a2f">B</text>
  <rect x="110" y="452" width="660" height="28" fill="#efece7" stroke="#b8b3aa" stroke-width="1.2"/>
  <rect x="200" y="452" width="420" height="28" fill="#2f6f8f"/>
  <text x="410" y="471" text-anchor="middle" font-size="12" fill="#ffffff">B sends its whole card — deaf throughout</text>

  <text x="440" y="504" text-anchor="middle" font-size="13" font-weight="600" fill="#c0392b">both talking, neither hearing — and both cards are lost</text>

  <!-- verdict -->
  <rect x="110" y="526" width="680" height="88" rx="12" fill="#eef4f7" stroke="#2f6f8f" stroke-width="2"/>
  <text x="450" y="554" text-anchor="middle" font-size="15" font-weight="600" fill="#1a1a1a">The shout is short so the deaf window is short.</text>
  <text x="450" y="580" text-anchor="middle" font-size="14" fill="#2f6f8f">A short deaf window is the whole reason a tie is impossible.</text>
  <text x="450" y="602" text-anchor="middle" font-size="12" fill="#7a7a7a">Send blind and you need the dice, the backoff and the election all back again.</text>

  <text x="450" y="646" text-anchor="middle" font-size="13" fill="#8a8a8a">Handoff — simplified trigger — 7/7</text>
</svg>
