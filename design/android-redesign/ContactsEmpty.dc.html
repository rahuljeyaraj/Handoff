<!doctype html>
<html>

<body>
<x-dc>
<helmet>

  <style>

    a{color:var(--primary);} a:hover{color:var(--onpc);}
    .ib{width:48px;height:48px;border-radius:24px;display:flex;align-items:center;justify-content:center;color:var(--onv);flex:none;}
  </style>
</helmet>

      <div style="display:flex;align-items:center;gap:6px;">
        <span style="width:7px;height:7px;border-radius:4px;background:#2E6B4F;flex:none;"></span>
        <span style="font-size:12px;line-height:16px;color:#5B5852;">Connected</span>

  </div>

  <div style="flex:none;margin:0 16px;padding:14px 16px;border:1px solid #DCD7D0;border-radius:16px;display:flex;align-items:center;gap:14px;">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#8A5A00" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="flex:none;"><path d="M12 4l9 16H3z"></path><path d="M12 10v4.3M12 17.1v.1"></path></svg>
    <div style="flex-grow:1;display:flex;flex-direction:column;gap:3px;min-width:0;">
      <div style="font-size:14px;line-height:19px;font-weight:500;">You haven't set your contact card</div>
    </div>
    <div style="height:40px;border-radius:20px;background:#DDE1FF;color:#172052;padding:0 18px;display:flex;align-items:center;font-size:14px;font-weight:500;flex:none;">Set up</div>
  </div>

  <div style="height:40px;flex:none;"></div>

</body>
</html>
