<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap">
  <style>
    :root{--surface:#FCF9F6;--sc:#F3EFEA;--on:#1C1B1A;--onv:#5B5852;--outline:#8D8A84;--ov:#DCD7D0;--primary:#40518B;--pc:#DDE1FF;--onpc:#172052;}
    *{box-sizing:border-box;}
    body{margin:0;font-family:Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--surface);color:var(--on);-webkit-font-smoothing:antialiased;}
    a{color:var(--primary);} a:hover{color:var(--onpc);}
    .br{position:absolute;width:40px;height:40px;}
  </style>
</helmet>

<div style="width:412px;height:915px;position:relative;background:#FCF9F6;overflow:hidden;">

  <div style="position:absolute;inset:0;display:flex;flex-direction:column;opacity:.32;">
    <div style="height:30px;flex:none;"></div>
    <div style="height:56px;flex:none;display:flex;align-items:center;padding:0 16px;">
      <div style="font-size:12px;font-weight:500;letter-spacing:.6px;text-transform:uppercase;color:#5B5852;">Step 1 of 2</div>
    </div>
    <div style="flex-grow:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 32px 20px;">
      <div style="font-size:28px;line-height:36px;text-align:center;">Switch on the band and scan its QR code</div>
      <div style="width:248px;height:248px;border-radius:28px;background:#211F1D;position:relative;margin-top:34px;">
        <div class="br" style="top:16px;left:16px;border-top:3px solid #DDE1FF;border-left:3px solid #DDE1FF;border-top-left-radius:12px;"></div>
        <div class="br" style="bottom:16px;right:16px;border-bottom:3px solid #DDE1FF;border-right:3px solid #DDE1FF;border-bottom-right-radius:12px;"></div>
      </div>
    </div>
  </div>

  <div style="position:absolute;inset:0;background:#1C1B1A;opacity:.34;"></div>

  <div style="position:absolute;left:16px;right:16px;bottom:34px;border-radius:28px;background:#FCF9F6;padding:26px 0 10px;box-shadow:0 8px 28px rgba(28,27,26,.22);">

    <div style="padding:0 26px;display:flex;flex-direction:column;align-items:center;">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#40518B" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7l10 10-5 4V3l5 4L7 17"></path></svg>
      <div style="font-size:22px;line-height:29px;text-align:center;margin-top:16px;">Connect to Handoff 7A3C?</div>
    </div>

    <div style="display:flex;align-items:center;justify-content:flex-end;gap:8px;padding:26px 18px 8px;">
      <div style="height:40px;border-radius:20px;padding:0 16px;display:flex;align-items:center;font-size:14px;font-weight:500;color:#40518B;">Don't allow</div>
      <div style="height:40px;border-radius:20px;padding:0 22px;display:flex;align-items:center;font-size:14px;font-weight:500;background:#40518B;color:#FFFFFF;">Allow</div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
