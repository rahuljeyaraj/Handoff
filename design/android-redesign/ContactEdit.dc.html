<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap">
  <style>
    :root{--surface:#FCF9F6;--on:#1C1B1A;--onv:#5B5852;--outline:#8D8A84;--ov:#DCD7D0;--primary:#40518B;--pc:#DDE1FF;--onpc:#172052;}
    *{box-sizing:border-box;}
    body{margin:0;font-family:Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--surface);color:var(--on);-webkit-font-smoothing:antialiased;}
    a{color:var(--primary);} a:hover{color:var(--onpc);}
    .ib{width:48px;height:48px;border-radius:24px;display:flex;align-items:center;justify-content:center;color:var(--onv);flex:none;}
    .tf{position:relative;height:56px;border:1px solid var(--outline);border-radius:4px;padding:0 16px;display:flex;align-items:center;flex:none;}
    .tl{position:absolute;top:-8px;left:12px;background:var(--surface);padding:0 4px;font-size:12px;line-height:16px;color:var(--onv);}
    .tv{font-size:16px;line-height:22px;}
    .cap{font-size:12px;line-height:16px;color:var(--onv);padding:6px 16px 0;}
  </style>
</helmet>

<div style="width:412px;height:915px;display:flex;flex-direction:column;background:#FCF9F6;overflow:hidden;">

  <div style="height:30px;flex:none;"></div>

  <div style="height:64px;flex:none;display:flex;align-items:center;padding:0 8px 0 4px;">
    <div class="ib">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>
    </div>
    <div style="flex-grow:1;font-size:22px;line-height:28px;padding-left:8px;">Edit contact</div>
    <div style="height:40px;border-radius:20px;padding:0 16px;display:flex;align-items:center;font-size:15px;font-weight:500;color:#40518B;flex:none;">Save</div>
  </div>

  <div style="flex:none;display:flex;flex-direction:column;gap:20px;padding:14px 16px 0;">

    <div class="tf">
      <span class="tl">Name</span>
      <span class="tv">Priya Raghavan</span>
    </div>

    <div class="tf">
      <span class="tl">Mobile</span>
      <span class="tv">+91 98410 23117</span>
    </div>

    <div class="tf">
      <span class="tv" style="color:#5B5852;">Work phone</span>
    </div>

    <div class="tf">
      <span class="tl">Email</span>
      <span class="tv">priya.r@vit.ac.in</span>
    </div>

    <div class="tf">
      <span class="tl">Organisation</span>
      <span class="tv">Vellore Institute</span>
    </div>

    <div class="tf">
      <span class="tl">Title</span>
      <span class="tv">Firmware lead</span>
    </div>

    <div style="position:relative;height:118px;border:2px solid #40518B;border-radius:4px;padding:16px;display:flex;align-items:flex-start;flex:none;">
      <span style="position:absolute;top:-9px;left:12px;background:#FCF9F6;padding:0 4px;font-size:12px;line-height:16px;color:#40518B;font-weight:500;">Note</span>
      <span style="font-size:16px;line-height:23px;white-space:pre-line;text-wrap:pretty;">Met at the PCBWay booth. Wants the 1500 mAh variant — send her the enclosure STLs.</span>
    </div>

  </div>

  <div style="flex-grow:1;"></div>

  <div style="flex:none;padding:0 16px;">
    <hr style="height:1px;background:#DCD7D0;border:0;margin:0 0 12px;">
    <div style="height:48px;display:flex;align-items:center;gap:12px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#BA1A1A" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="flex:none;"><path d="M4 7h16M9 7V4.5h6V7M6.5 7l1 13h9l1-13"></path></svg>
      <span style="font-size:15px;font-weight:500;color:#BA1A1A;">Delete this contact</span>
    </div>
  </div>

  <div style="height:28px;flex:none;"></div>
</div>
</x-dc>
</body>
</html>
