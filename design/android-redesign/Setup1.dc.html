<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap">
  <style>
    :root{--surface:#FCF9F6;--sc:#F3EFEA;--on:#1C1B1A;--onv:#5B5852;--outline:#8D8A84;--ov:#DCD7D0;--primary:#40518B;--pc:#DDE1FF;--onpc:#172052;}
    *{box-sizing:border-box;}
    body{margin:0;font-family:Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--surface);color:var(--on);-webkit-font-smoothing:antialiased;}
    a{color:var(--primary);} a:hover{color:var(--onpc);}
    .br{position:absolute;width:40px;height:40px;}
  </style>
</helmet>

<div style="width:412px;height:915px;display:flex;flex-direction:column;background:#FCF9F6;overflow:hidden;">

  <div style="height:30px;flex:none;"></div>

  <div style="height:56px;flex:none;display:flex;align-items:center;padding:0 16px;">
    <div style="font-size:12px;font-weight:500;letter-spacing:.6px;text-transform:uppercase;color:#5B5852;">Step 1 of 2</div>
  </div>

  <div style="flex-grow:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 32px 20px;">

    <div style="font-size:28px;line-height:36px;text-align:center;text-wrap:pretty;">Switch on the band and scan its QR code</div>

    <div style="width:248px;height:248px;border-radius:28px;background:#211F1D;position:relative;display:flex;align-items:center;justify-content:center;margin-top:34px;">
      <div class="br" style="top:16px;left:16px;border-top:3px solid #DDE1FF;border-left:3px solid #DDE1FF;border-top-left-radius:12px;"></div>
      <div class="br" style="top:16px;right:16px;border-top:3px solid #DDE1FF;border-right:3px solid #DDE1FF;border-top-right-radius:12px;"></div>
      <div class="br" style="bottom:16px;left:16px;border-bottom:3px solid #DDE1FF;border-left:3px solid #DDE1FF;border-bottom-left-radius:12px;"></div>
      <div class="br" style="bottom:16px;right:16px;border-bottom:3px solid #DDE1FF;border-right:3px solid #DDE1FF;border-bottom-right-radius:12px;"></div>

      <svg width="112" height="112" viewBox="0 0 24 24" fill="none" stroke="#6F6B66" stroke-width="1.5">
        <rect x="2.2" y="2.2" width="6.6" height="6.6" rx="1"></rect>
        <rect x="4.6" y="4.6" width="1.8" height="1.8" fill="#6F6B66" stroke="none"></rect>
        <rect x="15.2" y="2.2" width="6.6" height="6.6" rx="1"></rect>
        <rect x="17.6" y="4.6" width="1.8" height="1.8" fill="#6F6B66" stroke="none"></rect>
        <rect x="2.2" y="15.2" width="6.6" height="6.6" rx="1"></rect>
        <rect x="4.6" y="17.6" width="1.8" height="1.8" fill="#6F6B66" stroke="none"></rect>
        <g fill="#6F6B66" stroke="none">
          <rect x="11" y="3" width="1.7" height="1.7"></rect>
          <rect x="11" y="6.4" width="1.7" height="1.7"></rect>
          <rect x="11" y="9.8" width="1.7" height="1.7"></rect>
          <rect x="14.4" y="11" width="1.7" height="1.7"></rect>
          <rect x="17.8" y="11" width="1.7" height="1.7"></rect>
          <rect x="3" y="11" width="1.7" height="1.7"></rect>
          <rect x="6.4" y="11" width="1.7" height="1.7"></rect>
          <rect x="11.9" y="14.4" width="1.7" height="1.7"></rect>
          <rect x="15.3" y="15.3" width="1.7" height="1.7"></rect>
          <rect x="18.7" y="14.4" width="1.7" height="1.7"></rect>
          <rect x="11.9" y="18.7" width="1.7" height="1.7"></rect>
          <rect x="15.3" y="20" width="1.7" height="1.7"></rect>
          <rect x="19.6" y="18.7" width="1.7" height="1.7"></rect>
        </g>
      </svg>
    </div>

  </div>

  <div style="flex:none;padding:0 24px;">
    <div style="height:48px;border-radius:24px;color:#40518B;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:500;">Enter the band code instead</div>
  </div>

  <div style="height:40px;flex:none;"></div>
</div>
</x-dc>
</body>
</html>
