<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&family=Roboto+Mono:wght@400&display=swap">
  <style>
    :root{--surface:#FCF9F6;--sc:#F3EFEA;--on:#1C1B1A;--onv:#5B5852;--outline:#8D8A84;--ov:#DCD7D0;--primary:#40518B;--pc:#DDE1FF;--onpc:#172052;--ok:#2E6B4F;--error:#BA1A1A;}
    *{box-sizing:border-box;}
    body{margin:0;font-family:Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--surface);color:var(--on);-webkit-font-smoothing:antialiased;}
    a{color:var(--primary);} a:hover{color:var(--onpc);}
    .ib{width:48px;height:48px;border-radius:24px;display:flex;align-items:center;justify-content:center;color:var(--onv);flex:none;}
    .r{min-height:72px;display:flex;align-items:center;gap:16px;padding:12px 16px;flex:none;}
    .rt{font-size:16px;line-height:22px;}
    .rs{font-size:14px;line-height:19px;color:var(--onv);}
  </style>
</helmet>

<div style="width:412px;height:915px;display:flex;flex-direction:column;background:#FCF9F6;overflow:hidden;">

  <div style="height:30px;flex:none;"></div>

  <div style="height:64px;flex:none;display:flex;align-items:center;padding:0 4px;">
    <div class="ib">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 18l-6-6 6-6"></path></svg>
    </div>
    <div style="flex-grow:1;font-size:22px;line-height:28px;padding-left:8px;">Band</div>
  </div>

  <div style="flex:none;margin:4px 16px 0;padding:22px 20px;border-radius:20px;background:#F3EFEA;display:flex;flex-direction:column;align-items:center;">
    <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="#40518B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="8" width="12" height="8" rx="2"></rect><path d="M8 8V6.4a4 4 0 018 0V8M8 16v1.6a4 4 0 008 0V16"></path></svg>
    <div style="font-size:22px;line-height:28px;margin-top:12px;">Handoff 7A3C</div>
    <div style="display:flex;align-items:center;gap:7px;height:32px;border-radius:16px;background:#DDE1FF;color:#172052;padding:0 14px;margin-top:14px;">
      <span style="width:8px;height:8px;border-radius:4px;background:#2E6B4F;"></span>
      <span style="font-size:13px;font-weight:500;">Connected</span>
    </div>
  </div>

  <div class="r" style="margin-top:4px;">
    <svg width="26" height="15" viewBox="0 0 28 16" fill="none" style="flex:none;color:#2E6B4F;">
      <rect x="0.9" y="2.9" width="22.2" height="10.2" rx="2.6" stroke="currentColor" stroke-width="1.4"></rect>
      <rect x="24.6" y="5.8" width="2.6" height="4.4" rx="1.2" fill="currentColor"></rect>
      <rect x="2.9" y="5" width="5.2" height="6" rx="0.9" fill="currentColor"></rect>
      <rect x="9.4" y="5" width="5.2" height="6" rx="0.9" fill="currentColor"></rect>
    </svg>
    <div style="flex-grow:1;min-width:0;display:flex;flex-direction:column;gap:2px;">
      <div class="rt">Battery</div>
      <div class="rs">Good</div>
    </div>
  </div>

  <div class="r">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#5B5852" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="flex:none;"><rect x="4" y="4" width="16" height="16" rx="2.5"></rect><path d="M9 9h6v6H9z"></path></svg>
    <div style="flex-grow:1;min-width:0;display:flex;flex-direction:column;gap:2px;">
      <div class="rt">Firmware</div>
      <div class="rs">0.4.2</div>
    </div>
  </div>

  <div class="r">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#5B5852" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="flex:none;"><circle cx="12" cy="8" r="3.6"></circle><path d="M5 20a7 7 0 0114 0"></path></svg>
    <div style="flex-grow:1;min-width:0;display:flex;flex-direction:column;gap:2px;">
      <div class="rt">Your contact card</div>
      <div class="rs">Rohan Iyer</div>
    </div>
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8D8A84" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="flex:none;"><path d="M9 5l7 7-7 7"></path></svg>
  </div>

  <div style="flex-grow:1;"></div>

  <div style="flex:none;padding:0 16px;display:flex;flex-direction:column;gap:12px;">
    <div style="height:48px;border:1px solid #8D8A84;border-radius:24px;color:#40518B;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:500;">Disconnect</div>
    <div style="height:48px;border-radius:24px;color:#BA1A1A;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:500;">Forget this band</div>
  </div>

  <div style="height:28px;flex:none;"></div>
</div>
</x-dc>
</body>
</html>
