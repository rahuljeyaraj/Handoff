<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap">
  <style>
    :root{--surface:#FCF9F6;--sc:#F3EFEA;--scx:#E7E1DB;--on:#1C1B1A;--onv:#5B5852;--outline:#8D8A84;--ov:#DCD7D0;--primary:#40518B;--pc:#DDE1FF;--onpc:#172052;--ok:#2E6B4F;--error:#BA1A1A;}
    *{box-sizing:border-box;}
    body{margin:0;font-family:Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--surface);color:var(--on);-webkit-font-smoothing:antialiased;}
    a{color:var(--primary);} a:hover{color:var(--onpc);}
    .ib{width:48px;height:48px;border-radius:24px;display:flex;align-items:center;justify-content:center;color:var(--onv);flex:none;}
    .fieldrow{display:flex;align-items:center;gap:12px;}
    .tf{position:relative;height:56px;border:1px solid var(--outline);border-radius:4px;padding:0 16px;display:flex;align-items:center;flex-grow:1;min-width:0;}
    .tl{position:absolute;top:-8px;left:12px;background:var(--surface);padding:0 4px;font-size:12px;line-height:16px;color:var(--onv);}
    .tv{font-size:16px;line-height:22px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .hint{font-size:16px;line-height:22px;color:var(--onv);}
    .on{width:52px;height:32px;border-radius:16px;background:var(--primary);display:flex;align-items:center;justify-content:flex-end;padding:0 4px;flex:none;}
    .onk{width:24px;height:24px;border-radius:12px;background:#FFFFFF;}
    .off{width:52px;height:32px;border-radius:16px;background:var(--scx);border:2px solid var(--outline);display:flex;align-items:center;padding:0 6px;flex:none;}
    .offk{width:16px;height:16px;border-radius:8px;background:var(--outline);}
  </style>
</helmet>

<div style="width:412px;height:915px;display:flex;flex-direction:column;background:#FCF9F6;overflow:hidden;">

  <div style="height:30px;flex:none;"></div>

  <div style="height:64px;flex:none;display:flex;align-items:center;padding:0 8px 0 4px;">
    <div class="ib">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 18l-6-6 6-6"></path></svg>
    </div>
    <div style="flex-grow:1;font-size:22px;line-height:28px;padding-left:8px;">Your contact card</div>
    <div style="height:40px;border-radius:20px;padding:0 16px;display:flex;align-items:center;font-size:15px;font-weight:500;color:#40518B;flex:none;">Save</div>
  </div>

  <div style="flex:none;padding:6px 16px 0;">
    <div style="height:44px;border:1px solid #8D8A84;border-radius:22px;color:#40518B;display:flex;align-items:center;justify-content:center;gap:10px;font-size:14px;font-weight:500;">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.6"></circle><path d="M5 20a7 7 0 0114 0"></path></svg>
      Fill from a phone contact
    </div>
  </div>

  <div style="flex:none;padding:14px 16px 0;font-size:13px;line-height:19px;color:#5B5852;">
    Choose what you share.
  </div>

  <div style="flex:none;display:flex;flex-direction:column;gap:18px;padding:20px 16px 0;">

    <div class="tf">
      <span class="tl">Name</span>
      <span class="tv">Rohan Iyer</span>
    </div>

    <div class="fieldrow">
      <div class="tf">
        <span class="tl">Mobile</span>
        <span class="tv">+91 98860 41225</span>
      </div>
      <div class="on"><div class="onk"></div></div>
    </div>

    <div class="fieldrow">
      <div class="tf">
        <span class="hint">Work phone</span>
      </div>
      <div class="off"><div class="offk"></div></div>
    </div>

    <div class="fieldrow">
      <div class="tf">
        <span class="tl">Email</span>
        <span class="tv">rohan@handoff.dev</span>
      </div>
      <div class="on"><div class="onk"></div></div>
    </div>

    <div class="fieldrow">
      <div class="tf">
        <span class="tl">Organisation</span>
        <span class="tv">Handoff</span>
      </div>
      <div class="on"><div class="onk"></div></div>
    </div>

    <div class="fieldrow">
      <div class="tf">
        <span class="tl">Title</span>
        <span class="tv">Hardware lead</span>
      </div>
      <div class="off"><div class="offk"></div></div>
    </div>

  </div>

  <div style="flex-grow:1;"></div>

  <div style="flex:none;padding:0 16px;">
    <hr style="height:1px;background:#DCD7D0;border:0;margin:0 0 10px;">
    <div style="height:48px;display:flex;align-items:center;gap:12px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#BA1A1A" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="flex:none;"><path d="M4 7h16M9 7V4.5h6V7M6.5 7l1 13h9l1-13"></path></svg>
      <span style="font-size:15px;font-weight:500;color:#BA1A1A;">Remove my contact card</span>
    </div>
  </div>

  <div style="height:26px;flex:none;"></div>
</div>
</x-dc>
</body>
</html>
