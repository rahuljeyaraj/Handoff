<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap">
  <style>
    :root{--surface:#FCF9F6;--sc:#F3EFEA;--scx:#E7E1DB;--on:#1C1B1A;--onv:#5B5852;--outline:#8D8A84;--ov:#DCD7D0;--primary:#40518B;--pc:#DDE1FF;--onpc:#172052;--ok:#2E6B4F;}
    *{box-sizing:border-box;}
    body{margin:0;font-family:Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--surface);color:var(--on);-webkit-font-smoothing:antialiased;}
    a{color:var(--primary);} a:hover{color:var(--onpc);}
    .ib{width:48px;height:48px;border-radius:24px;display:flex;align-items:center;justify-content:center;color:var(--onv);flex:none;}
    .sh{font-size:12px;line-height:16px;font-weight:500;letter-spacing:.6px;text-transform:uppercase;color:var(--primary);padding:0 16px;height:40px;display:flex;align-items:flex-end;padding-bottom:8px;flex:none;}
    .r{min-height:72px;display:flex;align-items:center;gap:16px;padding:12px 16px;flex:none;}
    .rt{font-size:16px;line-height:22px;}
    .rs{font-size:14px;line-height:19px;color:var(--onv);}
  </style>
</helmet>

<div style="width:412px;height:915px;display:flex;flex-direction:column;background:#FCF9F6;overflow:hidden;">

  <div style="height:30px;flex:none;"></div>

  <div style="height:64px;flex:none;display:flex;align-items:center;padding:0 4px;">
    <div class="ib">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 18l-6-6 6-6"></path></svg>
    </div>
    <div style="flex-grow:1;font-size:22px;line-height:28px;padding-left:8px;">Settings</div>
  </div>

  <div class="sh">Your card</div>
  <div class="r">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#5B5852" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="flex:none;"><circle cx="12" cy="8" r="3.6"></circle><path d="M5 20a7 7 0 0114 0"></path></svg>
    <div style="flex-grow:1;min-width:0;display:flex;flex-direction:column;gap:2px;">
      <div class="rt">Your contact card</div>
      <div class="rs">Rohan Iyer</div>
    </div>
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8D8A84" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="flex:none;"><path d="M9 5l7 7-7 7"></path></svg>
  </div>

  <div class="sh">Band</div>
  <div class="r">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#5B5852" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="flex:none;"><rect x="6" y="8" width="12" height="8" rx="2"></rect><path d="M8 8V6.4a4 4 0 018 0V8M8 16v1.6a4 4 0 008 0V16"></path></svg>
    <div style="flex-grow:1;min-width:0;display:flex;flex-direction:column;gap:2px;">
      <div class="rt">Handoff 7A3C</div>
      <div class="rs">Connected</div>
    </div>
    <svg width="26" height="15" viewBox="0 0 28 16" fill="none" style="flex:none;color:#2E6B4F;">
      <rect x="0.9" y="2.9" width="22.2" height="10.2" rx="2.6" stroke="currentColor" stroke-width="1.4"></rect>
      <rect x="24.6" y="5.8" width="2.6" height="4.4" rx="1.2" fill="currentColor"></rect>
      <rect x="2.9" y="5" width="5.2" height="6" rx="0.9" fill="currentColor"></rect>
      <rect x="9.4" y="5" width="5.2" height="6" rx="0.9" fill="currentColor"></rect>
    </svg>
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8D8A84" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="flex:none;"><path d="M9 5l7 7-7 7"></path></svg>
  </div>

  <div class="sh">Contacts</div>
  <div class="r">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#5B5852" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="flex:none;"><path d="M4 7h13M4 12h9M4 17h5"></path></svg>
    <div style="flex-grow:1;min-width:0;display:flex;flex-direction:column;gap:2px;">
      <div class="rt">Sort order</div>
      <div class="rs">Newest first</div>
    </div>
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8D8A84" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="flex:none;"><path d="M9 5l7 7-7 7"></path></svg>
  </div>

  <div class="r">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#5B5852" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="flex:none;"><rect x="6" y="2.5" width="12" height="19" rx="2.5"></rect><path d="M12 8.5v6M9 11.5h6"></path></svg>
    <div style="flex-grow:1;min-width:0;display:flex;flex-direction:column;gap:2px;">
      <div class="rt">Save to phone automatically</div>
    </div>
    <div style="width:52px;height:32px;border-radius:16px;background:#E7E1DB;border:2px solid #8D8A84;display:flex;align-items:center;padding:0 6px;flex:none;">
      <div style="width:16px;height:16px;border-radius:8px;background:#8D8A84;"></div>
    </div>
  </div>

  <div class="sh">Appearance</div>
  <div class="r">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#5B5852" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="flex:none;"><circle cx="12" cy="12" r="8.5"></circle><path d="M12 3.5v17" ></path><path d="M12 3.5a8.5 8.5 0 000 17z" fill="#5B5852" stroke="none"></path></svg>
    <div style="flex-grow:1;min-width:0;display:flex;flex-direction:column;gap:2px;">
      <div class="rt">Theme</div>
      <div class="rs">System default</div>
    </div>
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8D8A84" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="flex:none;"><path d="M9 5l7 7-7 7"></path></svg>
  </div>

  <div class="sh">About</div>
  <div class="r" style="min-height:64px;">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#5B5852" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="flex:none;"><circle cx="12" cy="12" r="8.5"></circle><path d="M12 11.2v5.3M12 8.1v.1"></path></svg>
    <div style="flex-grow:1;min-width:0;display:flex;flex-direction:column;gap:2px;">
      <div class="rt">App version</div>
      <div class="rs">0.9.1</div>
    </div>
  </div>

  <hr style="height:1px;background:#DCD7D0;border:0;margin:8px 16px;">

  <div class="r">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#5B5852" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="flex:none;"><path d="M10 4H5.5A1.5 1.5 0 004 5.5V10M14 4h4.5A1.5 1.5 0 0120 5.5V10M10 20H5.5A1.5 1.5 0 014 18.5V14M14 20h4.5a1.5 1.5 0 001.5-1.5V14"></path><circle cx="12" cy="12" r="2.4"></circle></svg>
    <div style="flex-grow:1;min-width:0;display:flex;flex-direction:column;gap:2px;">
      <div class="rt">Advanced</div>
      <div class="rs">Bench and diagnostic tools</div>
    </div>
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8D8A84" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="flex:none;"><path d="M9 5l7 7-7 7"></path></svg>
  </div>

  <div style="flex-grow:1;"></div>
  <div style="height:24px;flex:none;"></div>
</div>
</x-dc>
</body>
</html>
