<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap">
  <style>
    :root{--surface:#FCF9F6;--sc:#F3EFEA;--on:#1C1B1A;--onv:#5B5852;--outline:#8D8A84;--ov:#DCD7D0;--primary:#40518B;--pc:#DDE1FF;--onpc:#172052;--error:#BA1A1A;}
    *{box-sizing:border-box;}
    body{margin:0;font-family:Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--surface);color:var(--on);-webkit-font-smoothing:antialiased;}
    a{color:var(--primary);} a:hover{color:var(--onpc);}
    .ib{width:48px;height:48px;border-radius:24px;display:flex;align-items:center;justify-content:center;color:var(--onv);flex:none;}
    .tf{position:relative;height:56px;border:1px solid var(--outline);border-radius:4px;padding:0 16px;display:flex;align-items:center;flex-grow:1;min-width:0;}
    .tl{position:absolute;top:-8px;left:12px;background:var(--surface);padding:0 4px;font-size:12px;line-height:16px;color:var(--onv);}
    .tv{font-size:16px;line-height:22px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .hint{font-size:16px;line-height:22px;color:var(--onv);}
    .lbl{position:relative;height:56px;width:132px;border:1px solid var(--outline);border-radius:4px;padding:0 10px 0 16px;display:flex;align-items:center;justify-content:space-between;flex:none;}
  </style>
</helmet>

<div style="width:412px;height:915px;display:flex;flex-direction:column;background:#FCF9F6;overflow:hidden;">

  <div style="height:30px;flex:none;"></div>

  <div style="height:64px;flex:none;display:flex;align-items:center;padding:0 8px 0 4px;">
    <div class="ib">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 18l-6-6 6-6"></path></svg>
    </div>
    <div style="flex-grow:1;font-size:22px;line-height:28px;padding-left:8px;">Your contact card</div>
    <div style="height:40px;border-radius:20px;padding:0 16px;display:flex;align-items:center;font-size:15px;font-weight:500;color:#8D8A84;flex:none;">Save</div>
  </div>

  <div style="flex:none;padding:6px 16px 0;font-size:14px;line-height:20px;color:#5B5852;text-wrap:pretty;">Handed over when you shake hands.</div>

  <div style="flex:none;display:flex;flex-direction:column;gap:20px;padding:22px 16px 0;">

    <div class="tf">
      <span class="hint">Name</span>
    </div>

    <div style="display:flex;align-items:center;gap:12px;">
      <div class="tf">
        <span class="hint">Phone</span>
      </div>
      <div class="lbl">
        <span class="tl">Label</span>
        <span class="tv">Mobile</span>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5B5852" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="flex:none;"><path d="M7 10l5 5 5-5"></path></svg>
      </div>
    </div>

    <div style="height:40px;margin:-8px 0 -8px -12px;display:flex;align-items:center;gap:8px;padding:0 12px;color:#40518B;font-size:14px;font-weight:500;align-self:flex-start;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"></path></svg>
      Add another phone
    </div>

    <div class="tf">
      <span class="hint">Email</span>
    </div>

    <div class="tf">
      <span class="hint">Organisation</span>
    </div>

    <div class="tf">
      <span class="hint">Title</span>
    </div>

  </div>

  <div style="flex-grow:1;"></div>

  <div style="height:28px;flex:none;"></div>
</div>
</x-dc>
</body>
</html>
